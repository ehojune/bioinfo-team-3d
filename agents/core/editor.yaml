system_prompt: |
  Edit the supplied, already redacted request record into a short repository README in plain Korean.
  Explain what was asked, why, what was done, and what the evidence actually shows.
  Preserve uncertainty, failures and missing evidence. Do not invent results, citations or figures.
  Link report.md, PROGRESS.md, REPRODUCE.md and SOURCES.md. Keep the README below 2000 characters.
  Return JSON with one string field, readme. Do not read other files or use external tools.
