<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
  <title id="t">요청이 흐르는 길</title>
  <desc id="d">PI 요청이 브리핑, CSO 계획, 직원 단계, 과학 리뷰를 거쳐 최종 보고서가 되고, PI 결정함의 카드가 계획과 실행 사이에 끼는 자리를 보여 준다.</desc>
  <style>
    text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; fill: #0F172A; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #475569; }
    .title { font-size: 18px; font-weight: 700; }
    .loop { font-size: 12px; fill: #6D28D9; }
    .band { font-size: 14px; font-weight: 700; fill: #92400E; }
    .bs { font-size: 12px; fill: #92400E; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="400" rx="16" fill="#F8FAFC"/>
  <text class="title" x="32" y="38">요청이 흐르는 길</text>

  <!-- revise loop -->
  <path d="M748,96 L748,70 L424,70 L424,94" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowp)"/>
  <text class="loop" x="586" y="62" text-anchor="middle">revise면 CSO가 다시 계획하고 그 단계와 하류를 재실행 (기본 1회)</text>

  <!-- stages -->
  <g>
    <rect x="32" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="100" y="124" text-anchor="middle">PI 요청</text>
    <text class="s" x="100" y="146" text-anchor="middle">웹 입력창</text>
    <text class="s" x="100" y="164" text-anchor="middle">CSO에게 (팀 전체)</text>

    <rect x="194" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="262" y="124" text-anchor="middle">브리핑</text>
    <text class="s" x="262" y="146" text-anchor="middle">비서실장이</text>
    <text class="s" x="262" y="164" text-anchor="middle">동향·데이터 조사</text>

    <rect x="356" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="424" y="124" text-anchor="middle">CSO 계획</text>
    <text class="s" x="424" y="146" text-anchor="middle">단계 DAG</text>
    <text class="s" x="424" y="164" text-anchor="middle">단계마다 직원 1명</text>

    <rect x="518" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="586" y="124" text-anchor="middle">직원 단계</text>
    <text class="s" x="586" y="146" text-anchor="middle">병렬 실행</text>
    <text class="s" x="586" y="164" text-anchor="middle">산출은 outputs/</text>

    <rect x="680" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="748" y="124" text-anchor="middle">과학 리뷰</text>
    <text class="s" x="748" y="146" text-anchor="middle">다른 벤더 모델</text>
    <text class="s" x="748" y="164" text-anchor="middle">accept / revise</text>

    <rect x="842" y="96" width="136" height="84" rx="10" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.5"/>
    <text class="h" x="910" y="124" text-anchor="middle">최종 보고서</text>
    <text class="s" x="910" y="146" text-anchor="middle">CSO가 종합</text>
    <text class="s" x="910" y="164" text-anchor="middle">작업판에서 열람</text>
  </g>
  <g stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
    <line x1="168" y1="138" x2="192" y2="138"/>
    <line x1="330" y1="138" x2="354" y2="138"/>
    <line x1="492" y1="138" x2="516" y2="138"/>
    <line x1="654" y1="138" x2="678" y2="138"/>
    <line x1="816" y1="138" x2="840" y2="138"/>
  </g>

  <!-- PI decision band -->
  <rect x="32" y="236" width="946" height="136" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="band" x="52" y="276">PI 결정함</text>
  <text class="bs" x="52" y="298">웹·폰에서</text>
  <text class="bs" x="52" y="316">승인 · 거절 · 답</text>

  <g stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="424" y1="180" x2="404" y2="262"/>
    <line x1="586" y1="180" x2="616" y2="262"/>
  </g>
  <g>
    <rect x="304" y="262" width="200" height="92" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text class="h" x="404" y="288" text-anchor="middle">계획 전후</text>
    <text class="bs" x="404" y="310" text-anchor="middle">CSO 확인 질문에 답</text>
    <text class="bs" x="404" y="328" text-anchor="middle">파견직 채용 승인</text>
    <text class="bs" x="404" y="346" text-anchor="middle">연구 요청은 CP1 계획 승인</text>

    <rect x="516" y="262" width="200" height="92" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text class="h" x="616" y="288" text-anchor="middle">실행 중</text>
    <text class="bs" x="616" y="310" text-anchor="middle">HPC 제출 · 위험 명령</text>
    <text class="bs" x="616" y="328" text-anchor="middle">작업 폴더 밖 쓰기</text>
    <text class="bs" x="616" y="346" text-anchor="middle">개인 경로가 보이는 셸</text>

    <rect x="728" y="262" width="200" height="92" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text class="h" x="828" y="288" text-anchor="middle">예산 초과</text>
    <text class="bs" x="828" y="310" text-anchor="middle">요청 예산을 넘으면</text>
    <text class="bs" x="828" y="328" text-anchor="middle">어느 단계에서든</text>
    <text class="bs" x="828" y="346" text-anchor="middle">계속할지 묻는다</text>
  </g>
</svg>
