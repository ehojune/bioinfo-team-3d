    <path d="M406 118q14 16 28 38" fill="none" stroke-dasharray="3 4" marker-end="url(#a)"/>
    <!-- checklist (large) -->
    <rect x="306" y="144" width="96" height="90" rx="9" fill="#FFFFFF"/>
    <!-- contract badge (small) -->
    <rect x="422" y="164" width="40" height="62" rx="7" fill="#FFFFFF"/>
    <circle cx="442" cy="186" r="7" fill="#EDE9FE"/>
  </g>
  <rect x="362" y="38" width="30" height="5" rx="2.5" fill="#7C3AED"/>
  <path d="M362 54h44M362 64h44M362 74h36M362 84h42M362 94h26M362 104h38" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
