<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="t d">
  <title id="t">논문에서 출발한다</title>
  <desc id="d">논문에서 출발한다. 선행 논문으로 계획을 다지고, 없는 방법은 파견직으로 들일 수 있다. 그림: 돋보기로 읽은 논문이 큰 점검표로 이어지고, 점선 화살표 끝에 기한이 적힌 작은 파견 명찰이 있다.</desc>
  <style>
    text { font-family: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; fill: #0F172A; }
    .h { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .l { font-size: 15px; fill: #475569; }
    .n { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .b { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="479" height="259" rx="18" fill="#F7F5FF" stroke="#DDD6FE"/>
  <circle cx="392" cy="130" r="86" fill="#EDE9FE"/>

  <circle cx="42" cy="74" r="14" fill="#7C3AED"/>
  <text class="n" x="42" y="79" text-anchor="middle">2</text>
  <text class="h" x="28" y="128">논문에서 출발한다</text>
  <text class="l" x="28" y="164">선행 논문으로 계획을 다지고,</text>
  <text class="l" x="28" y="188">없는 방법은 파견직으로 들일 수 있다</text>

  <g stroke="#6D28D9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- paper -->
    <path d="M354 26h48l14 14v72h-62z" fill="#FFFFFF"/>
    <path d="M402 26v14h14" fill="none"/>
    <!-- arrows: solid to the checklist, dashed to the optional contract hire -->
