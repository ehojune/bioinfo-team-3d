<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="t d">
  <title id="t">일을 넘겨도 기준은 같다</title>
  <desc id="d">일을 넘겨도 기준은 같다. 분야 이름표 하나로 계획·리뷰·보고서가 같은 점검표를 본다. 그림: 계획에서 리뷰, 보고서로 일이 넘어가는 동안 셋 모두 bulk_rna_seq 이름표 하나와 그 네 칸짜리 점검표에 이어져 있다.</desc>
