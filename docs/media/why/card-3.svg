    .l { font-size: 15px; fill: #475569; }
    .n { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .k { font-size: 13px; font-weight: 700; fill: #1E4E73; }
    .m { font-family: "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <defs>
