<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
  <title id="t">How a request flows</title>
  <desc id="d">A PI request goes through briefing, CSO planning, staff steps, and science review to become the final report. Cards in the PI decision inbox come in between planning and execution.</desc>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif; fill: #0F172A; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #475569; }
    .title { font-size: 18px; font-weight: 700; }
    .loop { font-size: 12px; fill: #6D28D9; }
    .band { font-size: 14px; font-weight: 700; fill: #92400E; }
    .bs { font-size: 12px; fill: #92400E; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="400" rx="16" fill="#F8FAFC"/>
  <text class="title" x="32" y="38">How a request flows</text>

  <!-- revise loop -->
  <path d="M748,96 L748,70 L586,70 L586,94" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowp)"/>
  <text class="loop" x="667" y="62" text-anchor="middle">On revise, the flagged step and downstream steps rerun with review notes (once by default)</text>

  <!-- stages -->
  <g>
    <rect x="32" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="100" y="124" text-anchor="middle">PI request</text>
    <text class="s" x="100" y="146" text-anchor="middle">Web input box</text>
    <text class="s" x="100" y="164" text-anchor="middle">To CSO (team-wide)</text>

    <rect x="194" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="262" y="124" text-anchor="middle">Briefing</text>
    <text class="s" x="262" y="146" text-anchor="middle">Chief of staff</text>
    <text class="s" x="262" y="164" text-anchor="middle">scans trends, data</text>

    <rect x="356" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="424" y="124" text-anchor="middle">CSO plan</text>
    <text class="s" x="424" y="146" text-anchor="middle">Step DAG</text>
    <text class="s" x="424" y="164" text-anchor="middle">One staff per step</text>

    <rect x="518" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="586" y="124" text-anchor="middle">Staff steps</text>
    <text class="s" x="586" y="146" text-anchor="middle">Run in parallel</text>
    <text class="s" x="586" y="164" text-anchor="middle">Output to outputs/</text>

    <rect x="680" y="96" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="h" x="748" y="124" text-anchor="middle">Science review</text>
    <text class="s" x="748" y="146" text-anchor="middle">Other-vendor model</text>
    <text class="s" x="748" y="164" text-anchor="middle">accept / revise</text>

    <rect x="842" y="96" width="136" height="84" rx="10" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.5"/>
    <text class="h" x="910" y="124" text-anchor="middle">Final report</text>
    <text class="s" x="910" y="146" text-anchor="middle">Synthesized by CSO</text>
    <text class="s" x="910" y="164" text-anchor="middle">View on workboard</text>
  </g>
  <g stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
    <line x1="168" y1="138" x2="192" y2="138"/>
    <line x1="330" y1="138" x2="354" y2="138"/>
    <line x1="492" y1="138" x2="516" y2="138"/>
    <line x1="654" y1="138" x2="678" y2="138"/>
    <line x1="816" y1="138" x2="840" y2="138"/>
  </g>

  <!-- PI decision band -->
  <rect x="32" y="236" width="946" height="136" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="band" x="52" y="276">PI decision inbox</text>
  <text class="bs" x="52" y="298">On web or phone</text>
  <text class="bs" x="52" y="316">Approve · reject · reply</text>

  <g stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="424" y1="180" x2="404" y2="262"/>
    <line x1="586" y1="180" x2="616" y2="262"/>
  </g>
  <g>
    <rect x="304" y="262" width="200" height="92" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text class="h" x="404" y="288" text-anchor="middle">Around planning</text>
    <text class="bs" x="404" y="310" text-anchor="middle">Answer CSO's questions</text>
    <text class="bs" x="404" y="328" text-anchor="middle">Approve contractor hire</text>
    <text class="bs" x="404" y="346" text-anchor="middle">Research: CP1 plan approval</text>

    <rect x="516" y="262" width="200" height="92" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text class="h" x="616" y="288" text-anchor="middle">During execution</text>
    <text class="bs" x="616" y="310" text-anchor="middle">HPC submit · risky commands</text>
    <text class="bs" x="616" y="328" text-anchor="middle">Writes outside work folder</text>
    <text class="bs" x="616" y="346" text-anchor="middle">Shell with personal paths</text>

    <rect x="728" y="262" width="200" height="92" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text class="h" x="828" y="288" text-anchor="middle">Over budget</text>
    <text class="bs" x="828" y="310" text-anchor="middle">If a request exceeds</text>
    <text class="bs" x="828" y="328" text-anchor="middle">its budget, at any step</text>
    <text class="bs" x="828" y="346" text-anchor="middle">it asks whether to go on</text>
  </g>
</svg>
