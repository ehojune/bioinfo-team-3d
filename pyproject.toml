[project]
name = "labhq"
version = "0.5.0"
description = "Bio lab HQ: run a team of CLI coding agents (Claude Code, Codex, Gemini CLI) as a bioinformatics research lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "mcp>=1.2",
]

[project.urls]
Repository = "https://github.com/ehojune/bioinfo-team-3d"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
labhq = "labhq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["labhq*"]

[tool.setuptools.package-data]
labhq = ["config/*.yaml", "web/*", "web/ui/*", "web/lab3d/*", "web/lab3d/src/*", "web/lab3d/assets/*",
         "bench_data/cases/*.yaml", "bench_data/references/*.md", "bench_data/references/*.tsv",
         "bench_data/checks/*.py",
         "research/packs/*.yaml", "research/semantics_v1.yaml", "research/semantics_input_fit.yaml",
         "vocab/*.yaml", "vocab/*.tsv", "vocab/NOTICE.md", "facilities/*.yaml",
         "web/vendor/three/*", "web/vendor/three/build/*", "web/vendor/three/examples/jsm/*/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]   # tests import scripts/* (redact_stream) the same way under `pytest` and `python -m pytest`
