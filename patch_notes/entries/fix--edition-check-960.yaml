  summary: 정리본 표의 빈 비고와 근거 표의 기술 문자열 때문에 게시 검사가 막히는 문제를 고쳤습니다.
  text: '마지막 비고 칸만 빠진 CSV·TSV는 정리본에서 빈 칸을 추가하고 보정 기록을 연결합니다. 다른 열 누락·초과와 강조 오류는 계속 차단합니다. 자동 생성 근거 표의 MCP 도구명과 URL query key는 inline code로 표시합니다. 원본은 보존하며 관련 테스트 117건과 저장 결과의 최소 재현을 확인했습니다. 실제 게시·browser QA는 미검증입니다.'
