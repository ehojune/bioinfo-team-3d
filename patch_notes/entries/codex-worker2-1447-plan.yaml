- sha: '38c2266'
  at: 2026-11-21 04:15
  text: 버전 1 연구 계획의 단계별 실행 위치와 runner를 CP1 해시에 넣고 재개와 실행 전에 대조한다.
  summary: 승인한 연구 계획에 단계가 실행될 위치와 담당 runner가 함께 기록됩니다.
- sha: '918984b'
  at: 2026-11-21 05:16
  text: 기본 계획 스키마의 해시를 보존하고 단계별 실행 계약 테스트를 Windows CI에 등록한다.
  summary: 계획을 만드는 기존 경로와 새 승인 계약을 함께 검사합니다.
- sha: 'd280192'
  at: 2026-11-21 05:23
  text: PI가 실행 위치를 고른 연구 요청에서 버전 1을 선택하면 CP1 전에 서버가 runner를 채운다.
  summary: 연구 계획을 만들 때 단계의 실행 위치를 승인 내용에 넣을 수 있습니다.
- sha: '9fce908'
  at: 2026-11-21 05:31
  text: 채용으로 담당 직원이 바뀌면 CP1 승인 전에 최종 runner를 다시 고정한다.
  summary: 채용한 직원이 실제로 사용할 runner를 연구 계획 승인에 담습니다.
- sha: 'e162996'
  at: 2026-11-21 05:36
  text: 한영 매뉴얼에 버전 1 적용 조건, CP1의 단계별 runner 확인과 배정 변경 시 재승인 절차를 적는다.
  summary: 연구 계획을 승인할 때 단계별로 무엇을 확인하고 언제 다시 승인하는지 매뉴얼에서 볼 수 있습니다.
- sha: 'd232d81'
  at: 2026-11-21 05:42
  text: 환경 단계 복제 뒤 runner를 확정하고 실행 전 배정 변경을 새 CP1에 반영한다.
  summary: 실행 전 담당 runner가 바뀌면 새 승인 카드에서 배정을 다시 확인합니다.
- sha: 'd952f7d'
  at: 2026-11-21 05:48
  text: blind draft를 포함한 준비가 끝난 뒤 첫 단계 실행 직전에 runner 배정을 다시 확인한다.
  summary: 연구를 시작하기 직전에 담당 runner가 바뀌어도 새 승인을 받습니다.
- sha: '4431f3e'
  at: 2026-11-21 05:57
  text: 논문 스킬 준비와 예산 예약 뒤 첫 gateway dispatch 경계까지 CP1의 runner 배정을 대조한다.
  summary: 준비를 기다리는 동안 담당 runner가 바뀌면 연구 단계를 보내기 전에 새 승인을 받습니다.
- sha: '4a751e6'
  at: 2026-11-21 06:04
  text: 실행 기록이 있는 재개·이어 가기에서도 dispatch 직전에 runner를 확인하고 변경 시 연구 중단으로 넘긴다.
  summary: 재개 중 담당 runner가 바뀌면 이미 얻은 결과를 보존하고 새 계획을 요청합니다.
- sha: '4614883'
  at: 2026-11-21 06:10
  text: 결과 교정과 증거 칸 보완 전에도 CP1 배정을 확인하고 변경 시 원래 산출 기록을 보존한다.
  summary: 결과를 다듬기 전에 담당 runner가 바뀌면 원래 산출물을 남기고 새 계획을 요청합니다.
