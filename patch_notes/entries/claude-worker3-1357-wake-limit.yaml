pr: 1363
rows:
- sha: '6f27da6'
  at: 2026-11-10 09:06
  text: 'HPC 단계에서 새 잡을 낸 깨우기는 상한에 세지 않고(상한 4배 하드 캡), 잡을 남긴 채 끝난 단계의 늦은 결과는 outputs/가 아닌 jobs/late/에 받고 이벤트를 남긴다 (#1357).'
  summary: HPC 잡을 고쳐 다시 내다 단계가 실패하지 않게 하고, 늦게 끝난 잡이 결과를 덮어쓰지 않게 했습니다.
- sha: '2ba55b9'
  at: 2026-11-10 09:22
  text: '해제보다 먼저 또는 전송 중에 outputs/로 회수된 잡 결과도 jobs/late/<job>/로 옮긴다 (#1363 리뷰).'
  summary: 단계가 끝날 즈음 회수된 잡 결과가 산출에 섞이지 않게 했습니다.
- sha: '38f4b90'
  at: 2026-11-10 09:24
  text: 'manual 15 한·영에 HPC 깨우기 상한(재제출 깨우기 제외, 4배 하드 캡)과 늦게 끝난 잡의 jobs/late/ 회수를 적는다 (#1363 리뷰).'
  summary: 잡을 다시 낼 때의 깨우기 상한과 늦게 끝난 잡 결과의 위치를 설정 안내에 적었습니다.
- sha: '58f6e5c'
  at: 2026-11-10 09:57
  text: '이미 회수된 잡 결과의 jobs/late/ 이동을 깨우기 상한 해제(release 표시)에만 적용하고, 요청 취소에서는 앞 단계 결과를 그대로 둔다 (#1363 리뷰).'
  summary: 요청을 취소해도 이미 끝난 단계의 결과는 옮겨지지 않습니다.
- sha: 'bd46cf9'
  at: 2026-11-10 10:15
  text: '잡 결과를 늘 jobs/fetch/<job>/에 먼저 받고 단계가 기다릴 때만 제자리로 옮긴다. 덮어쓴 단계 파일은 jobs/replaced/에 두었다가 해제되면 되돌린다 (#1363 리뷰).'
  summary: 늦게 끝난 잡 결과가 단계 파일을 덮어쓰거나 섞이지 않게 회수 방식을 바꿨습니다.
