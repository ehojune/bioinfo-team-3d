rows:
  - sha: 'd8db1eb'
    at: 2026-11-17 23:36
    text: 승인 묶음 판정에서 작업 폴더 안 mv·sed -i·perl -i를 삭제 대신 쓰기로 본다(원본·대상 모두 작업 폴더 안이면 작업 폴더 쓰기, 풀 수 없으면 경로 미확정, 밖이면 개별). $'...' 따옴표와 대상 미확정 쓰기는 경로 미확정 부류로 옮기고, $'...'는 풀어 쓴 글자로도 삭제·네트워크·시작 변수를 검사한다. 자기 세션 tool-results 읽기는 작업 파일과 같은 부류다. 요청 재생 사람 카드 A 15→12, B 28→21
    summary: 작업 폴더 안 파일 옮기기·고치기와 자기 세션 출력 읽기가 이번 요청 묶음 허용에 들어갑니다.
  - sha: '708193e'
    at: 2026-11-18 00:30
    text: 리뷰 P1 수정. mv 옵션에 붙은 값(-t../out, -S.bak, -Destination:..)은 경로 미확정으로 두고, $'...'를 풀어 쓴 명령을 한 번 더 판정해 닫힌 구역·개인 경로·쓰기 대상 사유가 나오면 개별로 남긴다
    summary: 옵션이나 특수 따옴표로 감춘 경로도 이번 요청 묶음 허용에서 빠집니다.
  - sha: '9bff881'
    at: 2026-11-18 01:10
    text: 리뷰 P1 수정. 따옴표 조각이 붙은 mover 피연산자와 쓰기 대상, 값 없는 switch·-i[확장자]·따로 쓴 -e CODE 밖의 perl -i 옵션 모양은 피연산자를 읽지 않고 경로 미확정으로 둔다
    summary: 다 풀지 못한 파일 옮기기·고치기 대상은 묶음 허용에서 작업 폴더로 보지 않습니다.
  - sha: 'fd02c37'
    at: 2026-11-18 01:40
    text: 리뷰 P1 수정. 자기 세션 tool-results 파일을 개인 경로 검사에서 가릴 때 피연산자 전체가 그 파일일 때만 가린다. 같은 글자로 시작하는 더 긴 경로는 그대로 판정한다
    summary: 자기 세션 출력 파일 이름을 앞에 붙인 다른 경로는 묶음 허용에 들어가지 않습니다.
