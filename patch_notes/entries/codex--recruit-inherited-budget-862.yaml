- sha: 519de71
  at: 2026-10-23 09:04
  summary: 취소 중 이미 저장된 채용 변환 비용을 상위 비용 모름으로 다시 예약하지 않습니다.
  text: '예약된 계획 채용만 실제 nested ID를 runner private map에 기록하고, 기존 FIFO writer lane 뒤의 finished receipt로 상위 비용을 정한다. Python 반환이나 queued hint는 저장 증거로 쓰지 않는다. 내부 known/UNKNOWN 비용은 기존 자기 ID에 남고 근거가 없으면 상위 UNKNOWN이다. timeout과 명시 취소·반복 취소 fallback이 같은 확인을 쓰며 취소 전파·cleanup 의미와 map 정리를 유지한다. 재사용 ID·stale receipt·binding 변경을 거부한다. 추출한 생산 코드와 inert awaitable로 17건을 검증했으며 실제 event loop·프로세스·모델은 실행하지 않았다. runner 재시작 뒤 lineage는 UNKNOWN이다.'
- sha: 4dd595b
  at: 2026-10-23 08:49
  summary: 계획 채용도 실제 변환 호출에 상위 비용 예약 상한을 적용합니다.
  text: '예약 모드의 plan_recruit가 상위 task 예산과 남은 금액을 내부 변환 Task로 전달한다. 채용 설정과 함께 최소값을 택하고 없는 값·0·음수·비유한 값은 거절하며 Claude의 cent 출력은 내림한다. 1cent 미만은 보내지 않는다. 기본 예약-off와 수동 채용은 유지한다. 내부 결과는 자기 task ID로 기존 회계에 한 번만 기록하고 결과 유실은 상위 UNKNOWN으로 보존한다. 추출한 Task·Claude argv·회계 코드로 pure fake 11건과 3.10 문법·Windows 새 파일 경계 등록을 검증했다. 실제 CLI·모델·async loop는 실행하지 않았다. #862.'
