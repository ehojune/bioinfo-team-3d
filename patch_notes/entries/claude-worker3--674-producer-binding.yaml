pr: 1032
rows:
- sha: 'c5c59b3'
  at: 2026-10-29 21:05
  text: 환경 단계 dispatch의 session_runner가 배열·객체 같은 값이어도 해시하지 않고 비교해 runner 불일치 거부로 끝낸다
  summary: 형식이 잘못된 환경 작업이 runner를 비정상 종료시키지 않고 비용 없이 거부됩니다.
- sha: '66fbd13'
  at: 2026-10-29 20:50
  text: 환경 단계 dispatch에 step ID가 없거나 binding과 다르면 거부한다
  summary: 단계 정체가 증명되지 않은 환경 작업은 시작되지 않습니다.
- sha: '489af2c'
  at: 2026-10-29 20:25
  text: runner가 환경 단계의 단수 environment_binding(계약 형식, runner ID, runtime, step ID)을 엔진 시작 전에 검사하고 어긋나면 비용 없이 거부한다
  summary: 다른 runner나 다른 OS용으로 정해진 환경 단계가 이 runner에서 시작되지 않습니다.
