rows:
  - sha: 31494ef
    at: "2026-10-22 10:31"
    summary: "앞 단계 결과를 다음 단계로 복사할 때 크기 합이 작업 드라이브 여유보다 크면 내용 복사 전에 멈추고 이유를 알립니다."
    text: "runner stage_inputs가 수집한 산출의 알려진 크기 합을 작업 드라이브 여유와 먼저 비교해, 크기 합이 여유보다 크면 파일 내용을 복사하기 전에 멈추고 기존 거부 경로(활동 기록 warn·직원 안내, 직원은 CSO에게 묻는다)로 필요·여유 크기를 알린다. 원본 산출은 그대로이고 여유가 생기면 같은 단계 재시도는 이전처럼 복사한다. 여유 조회 실패는 기존 상한 복사를 유지하고 복사 중 ENOSPC는 disk full로 알린다. 예비 공간 기준과 직원 셸 다운로드 차단은 새 정책이라 넣지 않았고 #678의 PI 카드·fail 단계·큰 원자료 위치는 남아 있다."
  - sha: 865ced9
    at: "2026-10-22 10:50"
    summary: "복사 중 파일이 바뀌면 거부하는 기존 안전 검사를 새 공간 검사 뒤에서도 계속 확인하고, 설명을 실제 동작대로 고쳤습니다."
    text: "기존 link_swap 검사의 바꿔치기 주입을 크기 사전 검사 뒤로 옮겨, 새 크기 확인이 아니라 원래대로 복사 열기 시점의 거부를 확인한다. 제품 코드는 바뀌지 않았다. 매뉴얼은 크기 합이 여유보다 크면 내용 복사 전에 멈춘다고 고치고, 압축 볼륨처럼 실제 사용량이 파일 크기와 다른 드라이브는 보장하지 않는다고 적었다."
