rows:
  - sha: 31494ef
    at: "2026-10-22 10:31"
    summary: "앞 단계 결과를 다음 단계로 복사할 때 작업 드라이브에 들어가지 않으면 복사 전에 멈추고 이유를 알립니다."
    text: "runner stage_inputs가 수집한 산출의 알려진 크기 합을 작업 드라이브 여유와 먼저 비교해, 확실히 들어가지 않으면 한 바이트도 쓰지 않고 기존 거부 경로(활동 기록 warn·직원 안내, 직원은 CSO에게 묻는다)로 필요·여유 크기를 알린다. 원본 산출은 그대로이고 여유가 생기면 같은 단계 재시도는 이전처럼 복사한다. 여유 조회 실패는 기존 상한 복사를 유지하고 복사 중 ENOSPC는 disk full로 알린다. 예비 공간 기준과 직원 셸 다운로드 차단은 새 정책이라 넣지 않았고 #678의 PI 카드·fail 단계·큰 원자료 위치는 남아 있다."
