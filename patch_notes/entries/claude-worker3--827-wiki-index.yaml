pr: 1039
rows:
- sha: '3f93302'
  at: 2026-10-30 09:20
  text: wiki 루트를 runner.reference_roots로만 허용하고(프로젝트 local_dir 제외), trigram 없이 만든 색인에 trigram이 생기면 FTS를 다시 채운다
  summary: 프로젝트 폴더는 wiki로 연결되지 않고, SQLite 환경이 바뀌어도 검색이 비지 않습니다.
- sha: 'd2ed7ca'
  at: 2026-10-30 08:50
  text: 읽기 권한이 사라진 노트는 색인에서도 지우고, wiki disconnect가 rollback journal도 지우며, 중첩된 허용 root가 있으면 mount를 건너지 않는 root를 인정한다
  summary: 권한이 회수된 노트가 검색에 남지 않고 disconnect가 평문 조각을 남기지 않습니다.
- sha: 'c444414'
  at: 2026-10-30 08:15
  text: policy.private_paths가 별칭이어도 실제 경로와 양방향으로 비교하고, wiki connect가 출력하는 설정 줄을 YAML serializer로 인코딩한다
  summary: 링크로 이름 붙인 비공개 경로와 겹치는 폴더는 연결되지 않고, 특수문자가 든 경로도 설정에 그대로 옮겨집니다.
- sha: 'fb14ded'
  at: 2026-10-30 07:45
  text: manual 한·영에 내 LLM-wiki 연결(labhq wiki 명령 5개, wiki 설정 표, 노트별 보존 정보, 연결 거부 조건) 절을 더한다
  summary: 매뉴얼에서 wiki 연결·색인·검색 명령과 안전 경계를 볼 수 있습니다.
- sha: 'e97d220'
  at: 2026-10-30 07:10
  text: wiki 루트를 runner와 같은 실제 경로의 통제 구역과 비교해 겹치면 거부하고, 허용 루트와 wiki 사이에 mount 지점이 있으면 거부한다
  summary: 링크로 이름 붙인 통제 구역이나 별도 파일 시스템 안의 폴더는 wiki로 연결되지 않습니다.
- sha: '05524f3'
  at: 2026-10-30 06:40
  text: wiki 루트를 해석된 경로로 reference_roots와 비교하고(중간 링크 우회 차단), 저장된 색인의 루트가 현재 루트와 다르면 사용 가능으로 표시하지 않는다
  summary: 링크로 허용 폴더 밖을 가리키는 wiki 경로가 거부되고, 폴더를 바꾸면 이전 색인을 쓰지 않습니다.
- sha: 'e9b12e2'
  at: 2026-10-30 06:10
  text: 새 시험 tests/test_wiki_index.py를 Windows inventory(config/ci)의 검토된 목록에 등록한다
  summary: wiki 시험이 Windows CI 목록에 들어가 CI가 통과합니다.
- sha: '0b520c1'
  at: 2026-10-30 05:30
  text: 'LLM-wiki 1단계: wiki 설정(기본 꺼짐), 링크·mount를 따르지 않는 walker, 변경된 문서만 갱신하는 runner 쪽 FTS5 인덱스(상대 경로·줄·hash·수정 시각·원문 DOI/PMID/URL·오래됨 표시), labhq wiki connect|status|reindex|search|disconnect, doctor wiki 행, README 한·영'
  summary: 내 LLM-wiki 폴더를 읽기 전용으로 연결해 색인하고 노트마다 출처를 달아 검색하는 명령이 생겼습니다(직원용 도구는 다음 단계).
