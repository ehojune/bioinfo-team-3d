  text: 'Windows에서 직원 Python이 OS 신뢰 저장소도 믿게: certifi+OS 저장소 PEM을 SSL_CERT_FILE·REQUESTS_CA_BUNDLE로(9차 시운전 기관 TLS 검사)'
  summary: Windows 분석용 Python이 기관의 인증서도 신뢰하도록 연결했습니다.
- sha: 6fff2a8
  at: 2026-10-03 20:00
  text: CA 묶음을 매 spawn 전에 메모리 사본과 비교해 바뀌었으면 다시 씀(봇 P1), 읽기 전용 실행도 REQUESTS_CA_BUNDLE 유지(봇 P2)
  summary: 인증서 파일이 바뀌면 다시 쓰고 읽기 전용 작업에도 인증서 설정을 전달합니다.
- sha: a8b12aa
  at: 2026-10-03 20:12
  text: OS 신뢰 저장소를 매 spawn 때 다시 읽어 기관 루트 교체가 runner 재시작 없이 반영됨(봇 P2)
  summary: 기관 인증서가 바뀌면 실행기를 다시 켜지 않아도 다음 직원 실행에 반영합니다.
- sha: b9e23d2
