- sha: 20ab71f
  at: 2026-10-22 10:08
  summary: Windows 시험에서 감독 프로세스가 일찍 끝나면, 원인을 가를 실행 기록과 gateway 로그 끝부분도 함께 남깁니다.
  text: 'test_supervisor_process.py의 시험 전용 _print_start_evidence가 기존 gateway-supervisor.log·diagnostics에 더해 detached-launch.jsonl과 gateway.log의 같은 16KiB 꼬리를 실패 출력에 남긴다. #844에서 감독 프로세스가 gateway 기록 전에 끝난 원인 가운데 Windows 자식 기동 거부와 gateway 즉시 종료는 기존 두 파일만으로 구분되지 않았다. token 마스킹·제어문자 치환·symlink 거부·원래 실패 예외 보존·진단 오류 비전파는 그대로이고 제품 코드와 제한시간은 바꾸지 않았다. 원인은 아직 모르며 다음 재발 때 판정한다.'
- sha: '1136231'
  at: 2026-10-22 10:44
  summary: Windows에서 감독 프로세스가 시작하다 실패하면, 그 오류 내용이나 멈춘 단계가 감독 로그에 남습니다.
  text: 'WMI로 띄운 bootstrap은 role 로그로 stderr를 넘긴 뒤 감독 스크립트를 같은 프로세스에서 실행하는데, __main__이 모든 Exception을 출력 없는 종료 코드 2로 바꿔 감독 스크립트 자신의 시작 예외까지 숨겼다. CI는 breakaway가 거부돼 항상 이 경로를 쓴다. 이제 role 단계 예외는 다시 던져 role 로그에 traceback이 남고(직접 시작과 같음), ACK 대기·최종 확인·정리·진입 단계 정지는 같은 로그에 단계와 예외 종류 한 줄만 쓰고 종전처럼 2로 끝난다. receipt 전 실패는 호출자가 계속 기록하며 명령·환경·경로·예외 메시지는 쓰지 않는다. 재시작 검사 실패 메시지에 감독 프로세스 종료 코드를 붙였다. #844 원인 자체는 아직 모른다.'
