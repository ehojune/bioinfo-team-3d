rows:
- sha: 'f684181'
  at: 2026-11-10 15:03
  text: '같은 단계에서 실패·취소된 시도 뒤 다시 낸 잡이 성공하면, 앞선 실패는 원격 산출 판정에서 빼고 기록에만 남긴다. 성공 뒤 실패와 도는 중인 앞 시도는 그대로 거절한다 (#1366).'
  summary: HPC 잡을 다시 내서 성공하면 앞선 실패 때문에 단계가 실패하지 않습니다.
- sha: '7c478aa'
  at: 2026-11-10 15:21
  text: '재시도는 같은 이름으로 나중에 낸 잡으로만 보고, 다른 shard의 성공은 실패를 대신하지 않는다 (#1367 리뷰).'
  summary: 여러 잡으로 나눈 단계에서 한 조각이 실패하면 계속 실패로 판정합니다.
