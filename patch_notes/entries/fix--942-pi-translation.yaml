  text: gateway가 비용 모름을 먼저 기록하는 경로도 task에 지정된 override 엔진·모델을 기록한다(#942 리뷰 P2).
  summary: 비용을 모르는 호출의 모델 칸이 직원 기본 모델이 아니라 실제로 지정한 모델로 남습니다.
