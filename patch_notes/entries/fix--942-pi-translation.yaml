  text: PI 문구 번역 prompt에서 카드용 구조·줄바꿈 규칙을 빼고 한 문단 두 문장 형식을 직접 적고, 번역 task를 연구 슬롯이 아닌 상담 슬롯에서 돌리며, 시간 초과로 비용을 모르는 번역의 모델 칸에 실제 번역 모델을 적는다(#942).
  summary: 번역이 형식 검사에서 계속 탈락하고 연구 단계 뒤에서 시간 초과로 취소되던 문제를 고쳤습니다.
- sha: 893f3b0
