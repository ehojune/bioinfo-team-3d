    summary: "Claude 직원이 curl·wget·unzip·tar 등으로 내려받거나 풀기 전에 대상 드라이브 여유가 기준(기본 2 GiB)보다 적거나 풀 크기가 안 들어가면 승인 카드로 묻고, 크기를 모를 때는 막지 않고 경고만 남깁니다."
    text: "셸 다운로드·압축 해제 직전 대상 드라이브 여유를 확인해 부족하면 PI에게 묻는다 (#678)"
  - sha: "c74af4e"
    at: "2026-10-31 13:50"
    summary: "디스크 확인이 tar의 모든 추출 표기와 git clone·fasterq-dump·aws·rsync가 쓰는 폴더도 읽습니다."
    text: "tar의 모든 추출 표기와 git clone·bulk 도구의 대상 폴더를 읽는다 (#678 리뷰 P1)"
  - sha: "9ab45f7"
    at: "2026-10-31 14:20"
    summary: "Claude 직원에게 미리 허용돼 있던 git clone·unzip·curl 같은 규칙도 이제 gate를 거쳐 디스크 여유 확인을 받습니다."
    text: "사전 승인된 다운로드·압축 해제 규칙을 allowedTools에서 빼 gate의 디스크 확인을 받게 한다 (#678 리뷰 P1)"
  - sha: "a8f48f3"
    at: "2026-10-31 14:50"
    summary: "디스크 확인이 curl --output-dir, tar의 붙여 쓴 값, 모르는 옵션이 붙은 git clone의 대상 폴더도 읽고, 승인 gate가 없는 직원의 규칙은 그대로 둡니다."
    text: "curl --output-dir·tar 붙은 값·git clone 모르는 옵션을 읽고, 규칙 제외는 gate가 있을 때만 한다 (#678 리뷰)"
  - sha: "c9ce2da"
