  summary: 긴 Python 명령이 불필요한 경로 승인 질문에 막히는 문제를 고쳤습니다.
- sha: 91e3287
  at: 2026-10-04 02:54
  text: 없는 이름 판정에서 대소문자·유니코드 정규화·끝 점과 공백을 모두 같은 이름으로 본다(대소문자 무시 볼륨의 링크).
  summary: 대소문자나 글자 표기 차이로 같은 경로의 검사를 피하지 못하게 했습니다.
- sha: f587b05
  at: 2026-10-04 03:00
  text: 없는 이름 판정이 첫 성분을 /, /와 \, NTFS stream 앞 이름으로 모두 대조하고 8.3 이름은 따옴표 안에서도 센다.
  summary: 여러 경로 표기와 짧은 Windows 이름도 빠짐없이 비교하도록 보강했습니다.
- sha: f132912
  at: 2026-10-04 03:08
  text: 경로 어디에든 . 이나 .. 성분이 있으면 없는 이름으로 건너뛰지 않는다(Windows는 missing/.. 을 먼저 지운다).
  summary: 점으로 현재·상위 폴더를 가리키는 경로가 검사에서 빠지지 않게 했습니다.
