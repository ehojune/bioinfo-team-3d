- sha: 'bf5e371'
  at: 2026-11-01 04:30
  text: 요청에 남은 예산으로 잘라낸 보류액을 센트 단위로 내린다. Claude 어댑터가 호출 상한을 센트로 적어 1.9센트 보류가 2센트로 나가 보류액과 요청 상한을 넘겨 쓸 수 있던 틈을 막는다. 부동소수점 오차 때문에 한 센트를 잃지 않도록 먼저 소수 여섯째 자리로 맞춘다. 잘라내지 않은 호출 상한은 그대로 둔다
  summary: 남은 예산이 센트 단위가 아니어도 호출이 보류액이나 요청 상한을 넘겨 쓰지 않습니다.
- sha: '6a2cee9'
  at: 2026-11-01 05:30
  text: 리뷰의 두 지적을 고친다. 센트 내림이 소수 여섯째 자리 반올림 때문에 실제 잔액 0.0199996달러를 0.02달러로 올리던 것을 Decimal 계산과 1e-9 오차 허용으로 바꾼다. 2.0에서 1.98을 뺀 값이나 5.0에서 4.99를 뺀 값처럼 부동소수점 오차가 센트를 잃게 하지 않으면서 0.0199996달러는 0.01달러가 된다. 센트 내림을 manual 한영의 보내기 전 예약 단락에 적는다
  summary: 잘라낸 보류액이 센트 내림에서 올림되지 않고, 동작이 사용자 문서에 있습니다.
