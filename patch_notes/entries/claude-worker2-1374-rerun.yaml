pr: 1378
rows:
  - sha: "d1ffa95"
    at: "2026-11-11 12:40"
    summary: "labhq verify <요청> --rerun으로 끝난 요청을 이 PC에서 다시 돌려 봅니다. 실행할 명령을 먼저 보여 주고 물은 뒤, 단계마다 입력과 스크립트만 복사한 임시 폴더에서 스크립트를 돌려 산출 sha256을 원래 기록과 비교합니다. 결과는 게시 영수증의 실행 상태가 됩니다."
    text: "reproduction_receipt에 rerun_plan·rerun·rerun_summary·rerun_path, receipt_summary가 저장된 재실행을 실행 상태로, result_storage가 게시 때 state/reproduction/<id>.json을 영수증에 붙임, audit rerun_steps·render_rerun_plan·render_verify 재실행 줄, cli --rerun·--yes·--rerun-timeout, manual 07·13 한영, 시험 8건 (#1374)"
  - sha: "ec4af72"
    at: "2026-11-11 13:00"
    summary: "보고서 머리의 재현 줄이 PI가 돌린 재실행 결과를 보입니다. 재현됨, 산출 hash 불일치, 스크립트 실패처럼 결과대로 적고, 재실행 기록이 없을 때만 '재현 실행 안 함'이라고 씁니다."
    text: "report_consistency.front_lines가 영수증 rerun 요약을 읽어 RERUN_FRONT 문구로, 시험 1건 (#1374)"
  - sha: "29b9603"
    at: "2026-11-11 13:20"
    text: "_sha_file의 이진 열기를 path.open(mode=\"rb\")로, test_text_encoding 통과 (#1374)"
  - sha: "98751a4"
    at: "2026-11-11 13:50"
    summary: "재현 재실행은 끝난 요청에만 돌고, 기록은 그때의 결과에 묶여서 결과가 바뀐 뒤 게시하면 쓰이지 않습니다. 스크립트가 없는 단계가 있으면 '재현됨'이 아니라 '일부 단계만 재현'으로 적습니다."
    text: "results_digest로 기록 결속(result_storage가 일치할 때만 사용), cli가 비종료 요청 거부, 전체 pass는 모든 단계 pass일 때만, manual 07 한영, 시험 4건 (#1374, PR #1378 리뷰 P1 2)"
  - sha: "95e652a"
    at: "2026-11-11 13:55"
    text: "manual 07 한영에 재실행 기록의 결과 결속, 끝나지 않은 요청 거부, 스크립트 없는 단계가 있으면 일부 재현 (#1374)"
