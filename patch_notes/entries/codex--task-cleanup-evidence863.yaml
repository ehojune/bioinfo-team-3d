- sha: 5344d9e
  at: 2026-10-23 04:48
  summary: 작업을 취소했을 때 직원 프로세스가 실제로 정리됐는지, 확인할 수 없는지를 작업 결과에 구분해 남깁니다.
  text: 'Windows 직원 CLI wrapper가 KILL_ON_CLOSE Job에 들어간 직후, CLI를 만들기 전에 stderr 첫 줄로 그 사실을 알리고, runner는 그 첫 줄만 믿는다. 작업 결과의 새 cleanup_evidence에 Job 활성, wrapper PID·생성 시각, 실제 wait 완료와 종료 코드, 종료 처리 결과를 남긴다. wrapper가 유일한 Job handle을 가진 채 끝났을 때만 job_close_contract_enforced이고, Job 꺼짐·확인 못함·대기 미완료·시작 도중 취소·runner 재시작만이면 UNKNOWN이다. labhq가 끝낸 종료 코드는 정리 실패가 아니며, Job에 남은 프로세스 수를 잰 값은 아니다. 시작 도중 취소돼도 이미 만든 wrapper를 넘겨받아 끝낸다. 취소·중단 결과의 shutdown_evidence는 덮어쓰지 않고 cleanup을 합친다. 시험은 가짜 프로세스·Job으로만 했다.'
- sha: c183ade
  at: 2026-10-23 04:55
  summary: 시험용 프로세스 대역에 pid가 없어도 정리 증거 기록이 깨지지 않습니다.
  text: 'cleanup_evidence의 wrapper PID와 생성 시각, Job 첫 줄 확인은 pid가 정수일 때만 읽는다. pid가 없는 대역은 Job을 확인하지 못한 것으로 남는다(UNKNOWN). 실제 asyncio 프로세스 경로는 바뀌지 않는다.'
- sha: 96d20a1
  at: 2026-10-23 05:03
  summary: 직원 프로세스 정리 증거가 무엇을 가정하고 무엇을 보장하지 않는지 사용 설명서에 밝힙니다.
  text: 'job_close_contract_enforced 판정은 runner가 띄운 labhq wrapper의 코드·실행 환경을 믿고, wrapper가 복제·상속하지 않은 유일한 Job handle을 끝날 때까지 쥔다는 가정에 기댄다. OS sandbox가 아니고 Job에 남은 프로세스가 0개임을 잰 값도 아니며, COM·WMI·서비스처럼 Job 밖에서 띄운 프로세스는 다루지 않는다. 문서만 바꿨고 실행 코드는 그대로다.'
