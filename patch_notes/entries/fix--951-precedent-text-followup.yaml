- sha: aa82841
  at: 2026-10-25 08:08
  text: 선행 조사 본문 복사에서 복사 실패를 본문마다 격리하고, 앞 단계 산출과 한 byte 예산을 공유하며, 종합 안내를 열렸다는 단정이 아니라 기록된 본문으로 고친다(#951 리뷰 P2, #952 병합 뒤 후속).
  summary: 본문 하나가 깨져도 나머지는 전달되고, 입력 용량 한도가 한 번만 적용되며, 보고서가 열리지 않은 본문을 읽었다고 말하지 않습니다.
- sha: 793b256
  at: 2026-10-25 09:05
  text: 선행 조사 본문 복사에서 실패한 복사가 임시 파일을 지우지 못해 inventory 밖 파일이 남으면, 그 폴더를 노출하지 않고 정리하거나 단계를 시작하지 않는다(#951 후속 리뷰 P1).
  summary: 해시 검사를 통과하지 못한 바이트가 읽기 전용 입력으로 노출되는 길을 막았습니다.
- sha: 253dbdd
  at: 2026-10-25 09:40
  text: 선행 조사 본문 복사에서 디스크 여유를 후보 전체 합계가 아니라 복사할 본문마다 검사해, 한 본문이 크거나 한도를 넘어도 들어가는 본문은 전달한다(#951 후속 리뷰 P2).
  summary: 큰 본문 하나 때문에 작은 본문까지 전달되지 않던 문제를 고쳤습니다.
