  text: 리뷰 지적 반영. #625의 단계별 모델 등급은 1단계 완료, CSO가 등급을 고르는 기능은 남은 일로 바로잡고, 요인 실험은 승인 전에 provider/account 비용 경계와 확정 receipt 구현·검증, live 활성화가 먼저라고 적는다
  summary: 남은 일을 실제보다 적게 기록하지 않게 정정합니다.
