    text: 동적 실행과 삭제는 개별 승인으로 남기고 기록 재생 수치를 갱신한다. Refs #1445.
  - sha: 78401dd
    at: '2026-11-17 14:14'
    summary: 같은 요청에서 비슷한 명령을 한 번에 허용할 수 있습니다.
    text: 명시적으로 승인한 셸 부류만 요청 종료까지 자동 승인하고 근거 카드와 취소를 기록한다. Refs #1445.
