  text: Windows tree-kill이 재사용된 PID를 부모로 적은 부팅 때 system 프로세스를 실패로 세지 않아, 멈춘 gateway를 강제로 끝낼 수 있다(PR 800 Windows CI).
  summary: Windows 프로세스 번호 재사용으로 멈춘 서버를 종료하지 못하던 오류를 고쳤습니다.
- sha: 1bbb061
