  text: 재현 receipt의 Python 실행이 -S를 빼 interpreter site-packages(numpy 등)를 불러오고, 문법 검사는 -I -S -B를 유지하며, 실제 interpreter 격리 test를 CI에 더했다.
  summary: 재현 검사에서 설치된 Python 패키지를 쓰되 문법 검사의 격리는 유지합니다.
- sha: 6cf6c8a
