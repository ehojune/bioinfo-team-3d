  text: 외부 조회 진행 기록이 Python 3.10에서 잃어버린 취소로 끝없이 돌며 조회를 멈추던 문제를 막았다(PR 800 3.10 CI 멈춤).
  summary: Python 3.10에서 외부 조회 취소를 놓쳐 검사가 끝없이 멈추던 문제를 고쳤습니다.
