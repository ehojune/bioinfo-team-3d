pr: 307
rows:
- sha: 7e552f1
  at: 2026-10-02 19:41
  text: 연구 CP1 승인 뒤 claim·evidence 계약 실행과 CP2 증거 검토 게이트를 추가했다.
  summary: 계획 승인 뒤 연구 결과와 근거를 검사하고 결과 승인을 받는 단계를 추가했습니다.
- sha: cf86bcb
  at: 2026-10-02 20:07
  text: CP2가 모은 산출에 묶이지 않은 artifact의 evidence를 거부하고, 연구 요청은 일반 재계획 없이 자기 실패 경로로 끝나며, 결정은 approve·revise·deny 선택값으로만 읽는다.
  summary: 수집 파일에 연결되지 않은 근거를 거절하고 연구 승인 선택을 엄격히 읽습니다.
- sha: a4dff32
  at: 2026-10-02 20:17
  text: 연구 단계가 PI 결정을 기다리면 산출·원장 검사보다 먼저 질문을 PI에게 보내고, 답을 받아 다시 실행한다.
  summary: 연구 도중 결정이 필요하면 결과 검사보다 먼저 책임자에게 묻고 답을 받아 이어갑니다.
- sha: 355dc61
  at: 2026-10-02 20:26
  text: 연구 요청을 재개할 때 요청에 고정된 실행 여부와 CP2 receipt를 유지해, 이미 내린 PI 결정을 다시 묻거나 모은 결과를 버리지 않는다.
  summary: 연구를 재개해도 이미 내린 실행·결과 승인 결정을 유지하고 수집 결과를 보존합니다.
- sha: 9fe0b84
  at: 2026-10-02 20:28
  text: main을 병합하며 승인 기록에 origin과 CP2 선택값을 함께 남기도록 충돌을 풀었다.
  summary: 승인 기록에서 결정 출처와 결과 승인 선택을 모두 남기도록 병합했습니다.
- sha: 1ac7e10
  at: 2026-10-02 20:50
  text: 패키지 설정 템플릿(labhq/config/labhq.example.yaml)에도 research.evidence_checkpoint를 넣어 저장소 사본과 맞췄다.
  summary: 설치 패키지에도 연구 결과 승인 설정 예시가 들어가도록 맞췄습니다.
- sha: 5af8dd8
  at: 2026-10-02 21:12
  text: 'main 병합: cso.py import에서 한도 대기(quota)와 연구 CP2 계약을 함께 둠'
  summary: 개발 변경을 합치며 사용 한도 대기와 연구 결과 승인 규칙을 모두 유지했습니다.
