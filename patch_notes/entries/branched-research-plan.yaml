pr: 703
rows:
- sha: f29a6f3
  at: 2026-10-17 00:16
  text: 독립된 근거 갈래를 함께 계획하고 실패한 갈래만 격리해 종합까지 이어가게 했다
  summary: 독립된 연구 근거를 여러 갈래로 진행하고 실패한 갈래를 분리해 종합을 이어갑니다.
- sha: e0c5767
  at: 2026-10-17 00:32
  text: 갈래가 없는 CP2 카드의 기존 열 구성을 유지하면서 갈래 계획에만 갈래 열을 보였다
  summary: 연구 갈래가 있는 계획에만 결과 승인 화면의 갈래 열을 표시합니다.
- sha: 99db7fe
  at: 2026-10-17 00:42
  text: 갈래 연구 회귀 test 파일 끝의 불필요한 빈 줄을 정리했다
  summary: 연구 갈래 자동 검사 파일 끝에 있던 불필요한 빈 줄을 정리했습니다.
- sha: 56fd438
  at: 2026-10-17 01:33
  text: 갈래 terminal 종합 완결성을 검증하고 실패 산출물 격리와 CP2 중단 기준을 보강했다
  summary: 갈래별 종합이 완결됐는지 확인하고 실패 자료 격리와 결과 승인 중단 기준을 보강했습니다.
- sha: 8e453f7
  at: 2026-10-17 01:41
  text: 모든 갈래 결과를 읽는 종합 단계가 하나는 있어야 갈래 계획을 받는다(종합 단계마다 다른 갈래만 읽는 계획 거절).
  summary: 모든 연구 갈래를 한데 읽는 종합 단계가 없는 계획은 받지 않습니다.
