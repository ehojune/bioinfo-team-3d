- sha: '677fd9c'
  at: 2026-10-24 16:50
  summary: 15시간 같은 긴 연구 실행도 격리 실행 확인을 통과하도록 확인 기한을 설정값으로 만들었습니다.
  text: 'contained runtime 확인이 owner receipt 수명을 발급 후 5400초로 고정하고 있었다. runner.contained_max_s(기본 5400이라 기존 동작 유지, 하한 60·상한 86400)로 읽도록 바꿨고 다른 확인(nonce·provenance·config hash·pipe·운영자 pin)은 그대로다. receipt를 발급하는 owner는 이 저장소 밖이라 같은 값으로 맞춰야 한다. 기본값 경계(5400 통과·5401 거부), 54000 설정 경계, 상한 밖 설정 거부 테스트 추가. 실제 15시간 owner와 새 설치판은 확인하지 않았다.'
