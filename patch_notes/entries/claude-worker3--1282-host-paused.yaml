pr: 1288
rows:
- sha: 'f8e7538'
  text: gateway의 live source 확인이 호스트 차단(host_paused) 응답을 요청 HTTP 상한 소진(lookup_limit)으로 기록하던 것을 고친다. 연속 실패로 쉬는 호스트는 새 실패 종류 host_paused로 기록하고 호스트와 다시 보낼 수 있는 시점(retry_after_s)을 남기며, 조회 몫이 남아 있다는 사실을 상세에 적는다. 상한이 실제로 소진된 경우는 그대로 lookup_limit이다
  at: 2026-11-06 04:30
  summary: 쉬는 호스트 때문에 조회하지 못한 것이 상한 소진으로 잘못 보이던 문제를 바로잡습니다.
- sha: 'a097fa5'
  at: 2026-11-06 05:40
  text: manual 09장 한영에 host_paused와 lookup_limit의 차이와 재시도 시점을 적는다. CP1 계획이 확정될 때 조회 카운터에서 쉬는 호스트를 읽어 계획 경고에 호스트와 남은 시간, 조회 몫이 남아 있다는 사실을 싣는다. 카운터가 없거나 읽지 못하면 경고를 더하지 않고 계획을 막지 않는다
  summary: 호스트 차단 사실이 도구 오류와 prompt에만 남던 것을 CP1 계획 경고와 manual에도 남깁니다.
- sha: '48484a8'
  at: 2026-11-06 06:30
  text: 쉬는 호스트 경고를 연구 계획(research lane)에도 계획을 검증·동결하기 전에 적용해 CP1 카드와 계획 해시에 들어가게 한다. 연구 요청 CP1 흐름을 거치는 시험을 더했다
  summary: 연구 요청의 CP1 계획에서 쉬는 호스트 경고가 빠지던 틈을 닫습니다.
