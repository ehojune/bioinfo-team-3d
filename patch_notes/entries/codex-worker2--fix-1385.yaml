pr: 1393
rows:
  - sha: "287a586"
    at: "2026-11-12 09:52"
    summary: "제목의 글자를 보존하고 같은 논문의 식별자를 연결해 원문을 찾습니다."
    text: "#1385 r4 P2: 제목 markup·entity·inline 공백 보정, 문헌·선례 receipt의 DOI/PMID/PMCID 대응과 registry URL 확인. 미기록 별칭·hash 불일치 거부. 관련 317건 통과."
  - sha: "4b3f49c"
    at: "2026-11-12 09:43"
    summary: "논문 페이지의 메뉴 대신 첫 논문 제목으로 사본을 대조합니다."
    text: "#1385 r4 리뷰 P2: HTML의 첫 비탐색 h1과 inline 글자를 보존해 제목 확인. 뒤쪽 제목 대체 거부 유지. 재현 1건 실패 → 문헌 관련 199건 통과, 마지막 경계 시험 6건 통과."
  - sha: "9850b0d"
    at: "2026-11-12 09:36"
    summary: "인용한 제목과 DOI만 보고 다른 논문을 전문으로 인정하지 않습니다."
    text: "#1385 r4 P1: DOI 일치 때도 첫 제목 전체를 요구하고 제목 미확인은 거부. Unpaywall 제목 보존·이전 identity 캐시 제외. 재현 4건 실패 → 문헌 관련 197건 통과."
  - sha: "b11c3c6"
    at: "2026-11-12 09:28"
    summary: "재조회가 실패해도 앞서 저장한 논문으로 원문을 대조합니다."
    text: "#1385 r4 리뷰 P2: metadata·파손·hash 불일치인 로컬 사본 뒤에 검증된 선례 사본을 시도. 수정 전 5건 실패, 수정 후 관련 132건 통과."
  - sha: "c7d2157"
    at: "2026-11-12 09:18"
    summary: "저장 원문의 인용문과 수치를 결과 승인 전에 대조합니다."
    text: "#1385 r4: 수집 산출·문헌·선례 사본 hash를 확인해 CP2와 보고서 검사에 연결. 문헌 전달 경고만으로 HPC를 막지 않으며 실제 산출 누락 거부는 유지. 관련 회귀 554건 통과. 실제 자료 기준은 미충족으로 보류."
  - sha: "128f1da"
    at: "2026-11-12 05:05"
    summary: "본문 조회가 깨져도 초록을 남기고 조회 몫 반환 오류를 다시 확인합니다."
    text: "#1385 r3: 제공자 JSON·schema 오류의 초록 보존·캐시 제외, 반환 API HTTP 검사·재시도. 지속 실패 시 송신 차단. 회귀 7건 실패·3건 통과 → 관련 203건 통과."
  - sha: "313b9ff"
    at: "2026-11-12 04:55"
    summary: "일괄 문헌 조회가 거절돼도 정상 논문과 조회 버전을 보존합니다."
    text: "#1385 r3: HTTP 400·414도 논문별 조회로 격리하고 fallback REST 버전 유지. 수정 전 회귀 7건 실패, 수정 후 문헌·receipt·차단기 193건 통과."
  - sha: "33b191d"
    at: "2026-11-12 04:42"
    summary: "원문 수신 시험의 사본을 논문 정보와 일치시켰습니다."
    text: "#1385 r3: PDF 추출·HTML receipt fixture에 제목과 DOI를 명시. 기존 coverage·hash·전달 단언 유지. 수정 전 3건 실패, 수정 후 관련 262건 통과."
  - sha: "85ee0e4"
    at: "2026-11-12 04:25"
    summary: "본문의 제목 일부 언급만으로 다른 논문을 인정하지 않습니다."
    text: "#1385 r2: DOI로 확인되지 않는 사본은 첫 제목 전체(최대 3줄)를 대조. 수정 전 거부 회귀 3건 실패, 수정 후 문헌 시험 114건 통과."
  - sha: "57f636d"
    at: "2026-11-12 04:21"
    summary: "논문 한 편의 잘못된 검색 응답도 조회 실패로 정리합니다."
    text: "#1385 r2: 단일 Europe PMC metadata의 JSON·schema 오류를 LookupFailed로 변환. 수정 전 5건 실패, 수정 후 문헌 시험 110건 통과."
  - sha: "f6be7ef"
    at: "2026-11-12 04:18"
    summary: "DOI 안의 꺾쇠와 괄호를 보존해 원문을 대조합니다."
    text: "#1385 r2: SICI와 괄호로 끝나는 DOI를 자르지 않고 문장부호만 허용. 수정 전 6건 실패, 수정 후 문헌 시험 105건 통과. 다른 접미사는 계속 거부."
  - sha: "2ab5fef"
    at: "2026-11-12 04:14"
    summary: "문헌 일괄 응답이 깨져도 다른 논문의 조회를 이어갑니다."
    text: "#1385 r2: Europe PMC batch JSON·schema 오류는 논문별 재조회로 격리. 수정 전 5건 실패, 수정 후 문헌 시험 99건 통과."
  - sha: "bc5dce4"
    at: "2026-11-12 04:10"
    summary: "논문 정보에 DOI가 빠져도 제목으로 원문을 대조하도록 고쳤습니다."
    text: "#1385 r2: 본문에만 DOI가 있는 사본의 제목 대조를 허용하고 명시 DOI 불일치 거부는 유지. 수정 전 1건 실패, 수정 후 문헌 시험 94건 통과."
  - sha: "b7eec30"
    at: "2026-11-12 04:04"
    summary: "논문 업로드 폴더를 전달 누락으로 잘못 알리던 문제를 고쳤습니다."
    text: "#1385 r2: 문헌 전달에서 inbox 같은 일반 폴더를 건너뛰고 위험한 파일 경고는 유지. 수정 전 1건 실패, 수정 후 입력 전달 40건 통과."
  - sha: "410152e"
    at: "2026-11-12 04:00"
    summary: "원문 검색의 대체 경로와 조회 차단 시험을 복구했습니다."
    text: "#1385 r2: Europe PMC 기록 없는 PMID·PMCID의 OpenAlex DOI·제목 보존, 응답별 반환 receipt 회귀 갱신, status HHMM 이름 복구. 관련 187건 통과. A/C 연결·실제 KRAS 대조·HPC 경고 처리는 잔여."
  - sha: "902d528"
    at: "2026-11-12 03:46"
    summary: "논문 초록을 먼저 저장하고 사본의 정체성과 전달 누락을 확인하는 수정안을 마련했습니다."
    text: "#1385: 초록 일괄 확보·PMC 우선·논문별 송신 상한, 응답 직후 조회 몫 반환, OA DOI·제목 대조, 문헌 전달 경고와 literal_check API. 실행 연결·settings·최종 검증은 통합 대기."
