rows:
  - sha: "57f636d"
    at: "2026-11-12 04:21"
    summary: "논문 한 편의 잘못된 검색 응답도 조회 실패로 정리합니다."
    text: "#1385 r2: 단일 Europe PMC metadata의 JSON·schema 오류를 LookupFailed로 변환. 수정 전 5건 실패, 수정 후 문헌 시험 110건 통과."
  - sha: "f6be7ef"
    at: "2026-11-12 04:18"
    summary: "DOI 안의 꺾쇠와 괄호를 보존해 원문을 대조합니다."
    text: "#1385 r2: SICI와 괄호로 끝나는 DOI를 자르지 않고 문장부호만 허용. 수정 전 6건 실패, 수정 후 문헌 시험 105건 통과. 다른 접미사는 계속 거부."
  - sha: "2ab5fef"
    at: "2026-11-12 04:14"
    summary: "문헌 일괄 응답이 깨져도 다른 논문의 조회를 이어갑니다."
    text: "#1385 r2: Europe PMC batch JSON·schema 오류는 논문별 재조회로 격리. 수정 전 5건 실패, 수정 후 문헌 시험 99건 통과."
  - sha: "bc5dce4"
    at: "2026-11-12 04:10"
    summary: "논문 정보에 DOI가 빠져도 제목으로 원문을 대조하도록 고쳤습니다."
    text: "#1385 r2: 본문에만 DOI가 있는 사본의 제목 대조를 허용하고 명시 DOI 불일치 거부는 유지. 수정 전 1건 실패, 수정 후 문헌 시험 94건 통과."
  - sha: "b7eec30"
    at: "2026-11-12 04:04"
    summary: "논문 업로드 폴더를 전달 누락으로 잘못 알리던 문제를 고쳤습니다."
    text: "#1385 r2: 문헌 전달에서 inbox 같은 일반 폴더를 건너뛰고 위험한 파일 경고는 유지. 수정 전 1건 실패, 수정 후 입력 전달 40건 통과."
  - sha: "410152e"
    at: "2026-11-12 04:00"
    summary: "원문 검색의 대체 경로와 조회 차단 시험을 복구했습니다."
    text: "#1385 r2: Europe PMC 기록 없는 PMID·PMCID의 OpenAlex DOI·제목 보존, 응답별 반환 receipt 회귀 갱신, status HHMM 이름 복구. 관련 187건 통과. A/C 연결·실제 KRAS 대조·HPC 경고 처리는 잔여."
  - sha: "902d528"
    at: "2026-11-12 03:46"
    summary: "논문 초록을 먼저 저장하고 사본의 정체성과 전달 누락을 확인하는 수정안을 마련했습니다."
    text: "#1385: 초록 일괄 확보·PMC 우선·논문별 송신 상한, 응답 직후 조회 몫 반환, OA DOI·제목 대조, 문헌 전달 경고와 literal_check API. 실행 연결·settings·최종 검증은 통합 대기."
