  - sha: 2163c58
    at: "2026-10-26 13:46"
    summary: "로컬 계산을 요청 단계에 연결해 이름과 상태를 표시하고 HPC 작업과 구분합니다."
    text: "기존 job event·snapshot pending_jobs로 공통 단계 흐름·task card·3D 요청 줄을 갱신합니다. 종료·재접속·다른 요청 회귀 mock을 추가했으며 실제 진행률은 추정하지 않습니다. Refs #675."
  - sha: 8b9b70e
    at: "2026-10-26 13:50"
    summary: "계산 상태가 바뀌면 요청의 작업 카드도 바로 갱신합니다."
    text: "2.5D 요청 cache에 stepJobs를 포함하고 job-only 갱신·요청 전환·동시 단계 격리 회귀검사를 추가했습니다."
  - sha: c08de09
    at: "2026-10-26 13:51"
    summary: "서로 다른 계산의 작업 번호가 같아도 요청 단계가 섞이지 않도록 고쳤습니다."
    text: "새 단계 표시용 관측을 task_id·job_id로 구분하고 소유자가 불명확한 상태 event는 적용하지 않습니다. bot P2의 같은 scheduler ID 충돌 회귀를 검사했습니다."
