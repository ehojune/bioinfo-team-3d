- sha: 'e8ed8f2'
  at: 2026-10-30 21:18
  text: PI 답변·리뷰어 피드백으로 재개된 단계의 updates에 그 시점의 조회 사용량을 다시 넣어, 이어 받은 세션이 이전 turn의 낡은 값을 쓰지 않게 한다
  summary: 재개된 단계도 지금 남은 조회 횟수를 봅니다.
- sha: '28c3340'
  at: 2026-10-30 21:04
  text: CSO 계획·재계획·선행 연구 검색·모든 단계 prompt에 요청의 공개 조회 사용량(N/M, 남음 K, 담당별)을 사실로 넣고 상한이 없으면 생략·계수를 못 읽으면 UNKNOWN으로 적으며 manual 한·영에 적는다
  summary: CSO와 직원이 이 요청에서 조회를 몇 번 썼고 몇 번 남았는지 알고 계획·조회를 정하며, 모르면 0 대신 모른다고 보입니다.
- sha: '53e7455'
  at: 2026-10-30 20:40
  text: LookupAdmission.usage(request_id)와 usage_note를 더해 요청의 공개 조회 사용량·남은 횟수·담당별 소진을 사실값으로 내고, 상한이 꺼졌거나 읽지 못하면 0 대신 UNKNOWN으로 표시한다
  summary: CSO와 직원에게 요청의 조회 사용량을 보여 줄 재료가 생깁니다(prompt 연결은 다음 단계).
