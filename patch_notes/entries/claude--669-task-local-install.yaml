  summary: 직원이 받은 자료를 읽으려고 자기 작업 폴더에 패키지를 설치하는 것을 막지 않게 했고, 읽을 도구가 끝내 없으면 CP2에서 보이게 했습니다.
  text: '연구 계획 prompt에 작업 폴더 안 설치(./.pylib, 작업 폴더 venv, ./.rlib, 판본 고정)는 기본 허용이고 resource_limits에 새 패키지 금지를 쓰지 말라는 규칙을 넣었다. 단계 prompt와 작업 폴더 규칙은 승인 없이 설치해 읽도록 바꿨다. 읽을 도구가 끝내 없으면 status_detail이 도구 없음으로 시작하는 unavailable 근거 행을 남기게 하고, 그 줄을 CP2 경고로 올린다(tool_missing_lines). 시스템·공유 환경 설치와 작업 폴더 밖 설치는 정책 게이트가 그대로 거부한다. 새 테스트 4건과 관련 묶음 통과. 실제 요청에서 모델이 이 규칙을 따르는지는 확인하지 않았다.'
