  text: 한·영 manual의 셸 다운로드·압축 해제 확인 단락에 PowerShell 안전망을 반영한다. `$r = iwr ...`·`[void](iwr ...)`처럼 이름은 보이는데 위치를 읽지 못한 다운로드도 현재 폴더와 명령에 적힌 드라이브(`D:a.zip` 포함)의 여유를 확인하고, 기준 아래면 ask, 경고 기준 아래면 경고, 아니면 허용하며 deny는 없다
  summary: PR #1184·#1270이 바꾼 PowerShell 디스크 확인 동작을 한·영 manual이 그대로 설명합니다.
