  at: 2026-11-07 06:37
  text: "#589 PI 인스턴스 종료 기록 감사 문서를 더한다. 10-24 이후는 인스턴스가 돌지 않아 자료가 없고, 10-20 09:59~10:09에 gateway·runner·두 supervisor가 종료 기록 없이 함께 사라진 것을 pid별 시간표로 찾았다. 원인 후보와 남은 일"
  summary: 기록 없이 꺼진 PI 인스턴스를 로그 시간표로 감사했습니다.
- sha: '9e8f033'
  at: 2026-11-07 06:37
  text: supervisor의 heartbeat 간격을 한 시간에서 gateway·runner와 같은 10분으로 줄인다(HEARTBEAT_S). 프로세스가 기록 없이 사라질 때 시각을 한 시간이 아니라 10분 창으로 좁힐 수 있다. 로그는 supervisor 둘 합쳐 하루 약 7 KiB에서 약 42 KiB로 늘어난다
  summary: 인스턴스가 기록 없이 꺼져도 언제쯤인지 10분 단위로 알 수 있습니다.
