rows:
- sha: '339a8a5'
  at: 2026-11-07 06:37
  text: "#589 PI 인스턴스 종료 기록 감사 문서를 더한다. 10-24 이후는 인스턴스가 돌지 않아 자료가 없고, 10-20 09:59~10:09에 gateway·runner·두 supervisor가 종료 기록 없이 함께 사라진 것을 pid별 시간표로 찾았다. 원인 후보와 남은 일"
  summary: 기록 없이 꺼진 PI 인스턴스를 로그 시간표로 감사했습니다.
- sha: '9e8f033'
  at: 2026-11-07 06:37
  text: supervisor의 heartbeat 간격을 한 시간에서 gateway·runner와 같은 10분으로 줄인다(HEARTBEAT_S). 프로세스가 기록 없이 사라질 때 시각을 한 시간이 아니라 10분 창으로 좁힐 수 있다. 로그는 supervisor 둘 합쳐 하루 약 7 KiB에서 약 42 KiB로 늘어난다
  summary: 인스턴스가 기록 없이 꺼져도 언제쯤인지 10분 단위로 알 수 있습니다.
- sha: '4c5542e'
  at: 2026-11-07 07:02
  text: 리뷰 지적 반영. manual 05장 한·영에 supervisor도 gateway·runner처럼 10분마다 heartbeat를 남기고, 한 줄 약 150바이트로 감독 둘이 하루 약 42 KiB(전에는 약 7 KiB) 쓴다고 적는다
  summary: heartbeat 간격과 로그 증가를 정식 문서가 설명합니다.
- sha: '4122e6d'
  at: 2026-11-07 07:17
  text: 리뷰 지적 반영. status·doctor가 보여 주는 마지막 child_exit를 감독 로그의 끝 256 KiB만이 아니라 끝에서 256 KiB씩 거슬러 올라가 찾는다(상한 16 MiB). 10분 heartbeat가 쌓여 약 12일 뒤 마지막 종료 기록을 밀어내던 회귀를 막는다. manual 05장 한·영에 한 줄
  summary: 인스턴스가 오래 돌아도 마지막 종료 기록이 사라진 것으로 표시되지 않습니다.
