rows:
- sha: '1f213fe'
  at: 2026-11-06 10:30
  text: 셸과 R 코드의 비밀값 가리기를 기본값을 뒤집어 바꾼다. 셸은 값(따옴표·이스케이프·붙여 쓴 조각 포함)을 한 단어로 읽어 $VAR·${VAR}·$(...)·역따옴표만으로 이뤄진 경우에만 남기고 나머지는 전부 가린다. R은 변수·NULL 같은 원자와 Sys.getenv 등 조회·읽기 함수, 문자열·숫자 인자가 없는 호출만 남기고 나머지는 전부 가린다. scan_publish_files도 같은 판정을 쓴다. Python의 ast 판정과 문서 규칙, SECRET_PATTERNS는 그대로다
  summary: 셸·R에서 따옴표나 조각을 붙여 쓴 비밀값이 가려지지 않던 부류를 닫습니다. TOKEN=abc'xyz' 같은 사례를 포함합니다.
