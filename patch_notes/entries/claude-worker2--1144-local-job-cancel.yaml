rows:
- sha: '0713ade'
  at: 2026-10-31 13:30
  text: 로컬 job 폴링이 상태를 읽는 사이 취소가 job을 끝냈으면 읽어 둔 낡은 상태로 덮어쓰지 않는다. 재현 시험을 더했다 (#1144).
  summary: 작업이 막 끝나는 순간과 취소가 겹쳐도 취소된 job이 완료로 바뀌어 중단된 단계가 깨어나는 일이 없습니다.
- sha: '6509567'
  at: 2026-10-31 14:00
  text: 취소의 kill이 실패해 cancel_requested만 설정된 job도 낡은 상태 읽기가 끝난 것으로 만들지 않게, 가드를 terminal 또는 cancel_requested로 넓히고 시험을 더했다 (#1144 리뷰 P1).
  summary: 취소가 프로세스를 다 끝내지 못했을 때도 폴링이 작업을 끝난 것으로 잘못 기록해 살아 있는 프로세스를 놓치는 일이 없습니다.
