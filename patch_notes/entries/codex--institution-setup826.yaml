  at: 2026-10-22 09:30
  summary: 처음 설정할 때 소속 기관과 논문 접속 방법을 묻고, 안전하게 저장할 수 있는 항목만 설정에 남깁니다.
  text: 'labhq init이 터미널에서만 기관 이름·도서관 프록시 주소·문헌 서비스·Unpaywall 연락 email을 묻는다. 각 질문은 Enter로 건너뛴다. 기존 설정 항목 literature.institution_proxy(https, 계정·세션 없는 url= 접두만)와 annot.unpaywall_email만 저장하고 기관 세션·TDM·외부 모델 전송은 꺼 둔다. 기관 이름과 서비스는 안내에만 쓰며, Web of Science는 확인된 기관 연결이 없으면 자동 연결하지 않는다고 알린다. 기존 설정은 바꾸지 않고 넣을 항목만 보여 주며, --yes·--dry-run·비대화형은 묻지 않는다. 비밀번호·cookie·API 키는 묻지 않고 접속·로그인도 하지 않는다. 순수 helper 실행은 통과했고 init 흐름 test는 CI 몫이다. #826은 부분 해결이다.'
