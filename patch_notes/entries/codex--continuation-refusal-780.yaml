    text: "#881 포함 main을 충돌 없이 통합했다. 복구 제품·fake 검사·선택기는 검토판 a142462d와 같고 browser/workflow는 병합된 main과 같다. profile·Python3.10 문법·기록·공개 검사를 확인했으며 최종 head CI·리뷰는 별도다."
  - sha: 3c5eb68
