rows:
- sha: '835f891'
  at: 2026-10-31 15:20
  text: 시설 수리 카드를 저장하는 중에 요청이 취소되면, 카드 저장이 끝난 뒤 요청 상태를 waiting_facilities_fix로 되돌리지 않고 방금 연 카드를 닫는다 (#1148).
  summary: 취소한 요청이 늦게 끝난 카드 저장 때문에 다시 '수리 승인 대기'로 보이거나 카드가 남는 일이 없습니다.
- sha: '683bf3d'
  at: 2026-10-31 16:00
  text: 시설 수리 카드를 게시하기 직전에 카드가 아직 열려 있고 요청이 활성인지 다시 확인해, 요청 저장 중에 들어온 취소가 카드를 닫은 뒤 approval.requested가 늦게 나가 웹에 유령 카드가 남는 일을 막았다 (#1148 리뷰 P1).
  summary: 취소한 요청에 이미 거둔 수리 카드가 화면에 다시 나타나는 일이 없습니다.
- sha: '358b265'
  at: 2026-10-31 16:40
  text: manual 한·영의 facilities_fix 절에 카드 저장 중 요청이 취소되면 요청은 취소로 남고 카드는 닫혀 다시 게시되지 않는다는 설명을 더했다 (#1148).
  summary: 시설 수리 카드가 저장되는 도중에 취소했을 때의 동작을 매뉴얼에 적었습니다.
