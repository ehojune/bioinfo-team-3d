rows:
  - sha: "62de999"
    at: "2026-11-07 04:00"
    summary: "PC와 클러스터가 파일을 공유하지 않는 사이트에서도 제출할 수 있습니다. 사이트 프로필에 클러스터 작업 폴더를 적으면 열어 둔 셸로 잡 스크립트를 올리고 올린 파일의 sha256이 같을 때만 제출하며, 잡이 끝나면 로그와 작은 결과를 가져옵니다. 크기 상한을 넘거나 작업 폴더 밖으로 나가는 경로는 거부합니다. 로그인은 더 들지 않습니다."
    text: "hpc_transfer(Transfer: 청크 올리기·sha256 확인·가져오기·경로 가둠·링크 거부, job_spec·remote_script·upload_job·fetch_results), Scheduler.transfer와 session.profile, submit_job이 올린 뒤 제출, 끝난 잡 회수와 에이전트 깨움 대기(_fetch_finished_jobs), 가짜 gateway 샌드박스, manual 09·15 한영, 시험 29건 (#1308)"
  - sha: "d73d450"
    at: "2026-11-07 04:40"
    summary: "클러스터에 폴더를 만들 때 한 단계씩 실제 위치를 확인해, 작업 폴더 밖으로 나가는 링크 뒤에는 폴더를 만들기 전에 거부합니다."
    text: "Transfer.ensure_dir를 컴포넌트별 test -d / mkdir로 바꿔 pwd -P 검증 뒤에만 다음 단계 생성, 가짜 gateway에 test -d 형태 추가, 시험 1건 (#1308)"
  - sha: "c18cfde"
    at: "2026-11-07 05:30"
    summary: "에이전트가 hpc_submit에 작은 입력 파일 목록을 줄 수 있고, 파일을 공유하지 않는 사이트에서는 그 파일이 클러스터 작업 폴더로 올라갑니다. 작업 번호를 읽지 못한 제출 출력과 Slurm 다른 클러스터 안내에 든 호스트 이름도 가립니다."
    text: "hpc_mcp.hpc_submit의 inputs 인자(상대 경로 20개 이하 검증)를 broker payload로 전달, submit_job이 inputs 형식 확인, scheduler의 job id 해석 실패·Slurm -M 문장에 _hide 적용, 도구 경로 시험과 가림 시험 (#1308)"
  - sha: "b4d5a9a"
    at: "2026-11-07 06:30"
    summary: "결과를 가져올 로컬 폴더가 링크로 바뀌어 있으면 거부하고, 가져오다 전송이 실패하면 끝난 것으로 치지 않고 다시 시도합니다. 올리기는 시간 상한(300초)을 두고 도구의 기다리는 시간에 그만큼을 더했습니다."
    text: "hpc_transfer.safe_local_root(링크·밖 폴더 거부)를 fetch_results가 base로 적용, 크기·이름 같은 영구 사유만 skipped하고 전송 오류는 전파, 없는 로그는 exists로 구분, Transfer.deadline·UPLOAD_BUDGET_S, hpc_mcp._submit_wait_s, 시험 6건 (#1308)"
  - sha: "4ff16d3"
    at: "2026-11-07 07:30"
    summary: "도구와 피드로 나가는 HPC 오류·알림 문구가 runner의 한 곳에서 호스트·포트·사용자 이름과 클러스터 작업 폴더를 가린 채 나갑니다. 결과 파일이 너무 깊이 있어 가져오지 못한 경우도 기록에 남습니다."
    text: "Runner._hide_hpc 경계(_on_submit 응답의 error·detail·result·reason·note, _emit_hpc_notice, fetch_error), Scheduler.redactor(work 폴더 마스킹 포함), Transfer 오류의 같은 가림, list_deeper로 깊이 밖 파일을 skipped에 기록, 시험 6건 (#1308)"
