  text: broker port 소유 기록을 계정별 홈이 아닌 PC 전체 폴더로 옮기고, 같은 설정의 살아 있는 runner 기록은 덮어쓰지 않으며, 쓸 수 없는 폴더는 시작을 막지 않는다 (#1024 리뷰 P2).
  summary: 서로 다른 계정의 실행기도 같은 내부 포트 충돌을 알아보게 했고, 이미 돌고 있는 실행기의 기록을 덮어쓰지 않게 했습니다.
