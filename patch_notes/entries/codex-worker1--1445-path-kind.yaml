  - sha: 02d8594
    at: "2026-11-17 22:08"
    summary: "직원 환경 변수가 가리키는 개인 경로도 개별 확인합니다."
    text: "묶음 판정에 직원 환경을 전달하고 승인 뒤 개인 경로 회귀를 추가했다."
  - sha: 539d553
    at: "2026-11-17 22:01"
    summary: "읽기 범위를 확인하지 못한 명령의 요청 단위 승인을 복구했습니다."
    text: "명시적 개인 경로 근거는 개별 확인을 유지하고 미확인 판정과 구분한다."
