pr: 1025
rows:
- sha: 'e404b8d'
  at: 2026-10-29 19:00
  text: Windows 풀 timeout(9분 제한)으로 실패한 CI를 다시 돌리기 위해 빈 커밋을 올린다
  summary: 코드 변경 없이 CI를 다시 시작합니다.
- sha: '9c0fca1'
  at: 2026-10-29 18:45
  text: 너무 깊게 중첩된 runner-manifest.json의 RecursionError를 환경 단계 실패로 처리해 runner 결과 정리가 중단되지 않게 한다
  summary: 비정상적으로 중첩된 manifest가 runner를 멈추지 않고 환경 단계 실패로 끝납니다.
- sha: '07858f2'
  at: 2026-10-29 18:20
  text: manual 한·영에 환경 단계가 끝날 때 manifest·binding·interpreter를 대조하고 어긋나면 실패 처리한다는 설명을 더한다
  summary: 매뉴얼이 환경 단계 자체가 실패하는 경우를 설명합니다.
- sha: '7b41aaf'
  at: 2026-10-29 18:05
  text: 환경 단계의 manifest·binding 검증을 선언 산출 검사와 같은 최종 턴 조건에서만 한다
  summary: job이나 질문을 기다리는 환경 단계가 아직 manifest를 쓰기 전에 실패 처리되지 않습니다.
- sha: 'a34579b'
  at: 2026-10-29 17:45
  text: manifest·binding 대조 test를 Windows inventory에 등록된 기존 test_runner_env_inputs_674.py로 옮긴다
  summary: 새 시험이 기존 시험 파일에 들어가 CI 목록을 늘리지 않고 같은 검사를 합니다.
- sha: 'a1ce63f'
  at: 2026-10-29 17:20
  text: 환경 단계가 끝날 때 runner가 수집된 runner-manifest.json의 hash와 내용을 승인 계획의 binding과 대조하고 interpreter 존재까지 확인해 어긋나면 그 단계를 실패 처리한다
  summary: 환경 담당 직원이 엉뚱한 manifest를 남기면 환경 단계가 성공으로 보이지 않고 바로 실패합니다.
