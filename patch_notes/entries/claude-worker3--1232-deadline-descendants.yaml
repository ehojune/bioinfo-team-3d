  text: 새 시험의 정리 코드가 taskkill의 /T를 쓰던 것을 test_no_tree_kill 규칙에 맞게 뺀다. 정리는 pid 파일의 프로세스를 하나씩 죽이므로 동작은 같다 (#1232)
