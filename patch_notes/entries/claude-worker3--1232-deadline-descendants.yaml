  text: '요청 전체 기한이 되면 직원 CLI와 그 자식·손자까지 끝나는지 실제 gateway·runner 프로세스와 가짜 CLI로 확인하는 시험을 더했다. 기한에 취소되고 deadline_receipt가 confirmed이며, 요청 밖 프로세스는 남는지 본다. 일회성 드라이버로만 있던 증명을 저장소 시험으로 옮겼다 (#1232)'
