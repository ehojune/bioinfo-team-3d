  summary: 개발 인수인계 문서의 현재 작업 배정 정책을 최신 PI 결정에 맞췄습니다.
  text: 'HANDOFF 현재 우선순위의 옛 문장(신규 일반 작업 보류 해제)을 현재 결정으로 바꿨다. Codex는 총괄을 유지하고 새 일반 Codex 작업은 보류하며 기존 PR 마무리와 긴급 수정만 맡는다. 개발은 Claude Opus가 동시 최대 3으로 하고 Claude 사용량은 Codex 예산에 넣지 않는다. 사용자 문서는 바꾸지 않았다.'
