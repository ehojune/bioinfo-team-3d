  text: web reducer가 같은 seq를 한 번만 적용하고, 끝난 요청이 늦은 dispatch·상태·리뷰 이벤트로 되살아나지 않게 한다 (#1170).
  summary: 화면에서 이미 끝난 요청이 늦게 도착한 이벤트 때문에 다시 진행 중으로 바뀌던 문제를 막았습니다.
- sha: "048d2f0"
  at: 2026-10-31 13:42
  text: web_environment 시험의 겹친 seq 입력을 고유하게 바꾼다 (#1170).
  summary: 시험 입력에서 같은 이벤트 번호가 겹치던 것을 바로잡았습니다.
- sha: "b50bf20"
  at: 2026-10-31 14:27
  text: 끝난 요청이 일을 새로 시작하거나 붙잡는 이벤트를 받지 않는 규칙을 apply() 입구 한 곳으로 모은다 (#1170).
  summary: 이미 끝난 요청에 늦게 도착한 작업 시작 이벤트가 직원 상태와 작업 목록을 되살리지 못하게 한 곳에서 막았습니다.
- sha: "a64a770"
  at: 2026-10-31 14:41
  text: 끝난 요청의 입구 규칙을 스냅샷 재생에도 적용하고, 종류를 모르는 task의 시작은 거절한다 (#1170).
  summary: 재연결 직후에도 끝난 요청의 작업이 다시 진행 중으로 보이지 않게 하고, 출처를 모르는 작업 시작도 막았습니다.
- sha: "554fd52"
  at: 2026-10-31 14:56
  text: 끝난 요청 뒤 시작할 수 있는 task kind를 followup 하나로 명시하고 스냅샷의 실행 중 task 복원에도 같은 규칙을 쓴다 (#1170).
  summary: 끝난 요청 뒤에는 후속 질문 작업만 시작할 수 있고, 재연결 때도 끝난 요청의 옛 작업이 되살아나지 않습니다.
- sha: "c8d3cc4"
  at: 2026-10-31 15:11
  text: 스냅샷의 follow-up 행을 gateway가 보내는 모양(step_id followup, kind 없음) 그대로 알아보고 복원한다 (#1170).
  summary: 재연결할 때 진행 중인 후속 질문 작업이 화면에서 사라지지 않게 했습니다.
- sha: "ba955bf"
  at: 2026-10-31 15:25
  text: 스냅샷의 요청 상태를 이벤트 재생 전에 심어, 재생 창보다 오래된 완료도 늦은 작업 이벤트를 거르게 한다 (#1170).
  summary: 재연결 때 오래전에 끝난 요청의 늦은 작업 이벤트가 직원 상태를 진행 중으로 되돌리지 않게 했습니다.
