  text: '게시 PDF는 정리본이 담을 수 있는 그림(보고된 산출물, 정리본이 담는 형식)만 넣고 크기 제한만 푼다. 보고서의 graphical abstract는 첫 제목 아래 첫 그림으로 옮기고, verify는 자체 abstract가 없으면 그려 넣을 한 자리를 빼 결과 그림 10장까지만 센다(#608, #611 리뷰 P2).'
  summary: 게시 가능한 결과 그림만 PDF에 넣고 그림 초록의 위치와 그림 수 계산을 바로잡았습니다.
