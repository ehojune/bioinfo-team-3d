pr: 1057
rows:
- sha: 'd80c5e1'
  at: 2026-10-30 15:18
  text: 범위 밖 claim의 제거된 링크도 거부 행에 남기고, 정리 뒤 단계 자신의 claim이 하나도 안 남으면 실패를 유지한다
  summary: 거부 기록에 제거된 링크가 빠지지 않고, 비어 버린 결과가 통과하지 않습니다.
- sha: '837e6fe'
  at: 2026-10-30 15:06
  text: 단계가 선언하지 않은 claim은 그것과 링크만 거부하고 나머지를 지켜, 같은 출처를 다른 independence group으로 적은 행처럼 살릴 수 있는 결함과 함께 와도 단계 전체가 실패하지 않게 한다
  summary: 단계가 선언하지 않은 claim이 한 개 섞여도 단계가 통째로 실패하지 않고 그 claim만 CP2에 거부로 남습니다.
