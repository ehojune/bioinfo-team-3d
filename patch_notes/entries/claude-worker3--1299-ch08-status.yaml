rows:
- sha: '8b31a41'
  at: 2026-11-06 21:30
  text: manual 08장 한영의 HPC 범용 정책에서 세션 관리자(hpc_session.py, #1299)와 사이트 프로필(hpc_site.py, #1303)이 병합됐다고 고치고, 도구와 runner에는 아직 연결되지 않아 지금 제출·상태 조회는 scheduler 명령마다 ssh를 연다고 밝힌다. labhq init이 프로필을 적을지 묻고(기본 아니오) 예이면 접속 방식 등을 묻는 흐름과 묻지 않는 경우(--yes·--dry-run·비대화형·이미 설정됨)를 적는다
  summary: 개발 중으로 적었던 세션 관리자와 사이트 프로필의 현재 상태를 문서에 맞춥니다.
