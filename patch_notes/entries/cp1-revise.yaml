pr: 514
rows:
  - sha: "d0f7bc5"
    at: "2026-10-09 06:19"
    text: "CP1 카드에 수정 요청을 넣었다. 메모와 함께 고르면 지금 요청은 단계 없이 끝나고, 같은 문장·참고 자료·확인 질문 답에 메모를 붙인 새 연구 요청이 열린다(이어 가기 차수에는 없음)."
  - sha: "8e662be"
    at: "2026-10-09 06:35"
    text: "CP1 수정 요청의 새 요청이 승인받지 못한 이전 계획과 메모를 받아 그 계획을 고친다. 새 요청을 열 수 없으면 plan_revision_failed로 메모를 남기고, 재시작에도 두 번 열지 않으며, 넘겨받은 답은 질문 횟수에 세지 않는다."
  - sha: "e689c6c"
    at: "2026-10-09 07:00"
    text: "CP1 수정 요청이 넘겨받은 PI 메모는 새 요청의 메모 상한에 세지 않고, 재시작 경로에서도 이전 요청에 revised_to 링크를 남긴다."
