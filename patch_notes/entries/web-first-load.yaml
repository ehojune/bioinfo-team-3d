  - sha: "d7a94d7"
    at: "2026-10-11 06:33"
    text: "웹 사무실이 첫 스냅샷 전에는 빈 사무실·$0.00·결정 없음 대신 '불러오는 중'으로 보인다."
  - sha: "62f61cb"
    at: "2026-10-12 01:31"
    text: "토큰이 없으면 첫 화면이 '토큰을 넣으면 … 불러와요'로 보이고, manual 웹 사무실 절에 첫 스냅샷 전 표시를 적었다(#516 리뷰)."
  - sha: "cc70a41"
    at: "2026-10-12 01:31"
    text: "main(#513)을 합쳤다."
  - sha: "70810b5"
    at: "2026-10-12 01:36"
    text: "웹 첫 화면의 정적 비용 문구도 '사용 비용 불러오는 중'이라 모듈이 로드되기 전에도 $0.00이 보이지 않는다(#516 리뷰)."
