  text: 상담 ref의 경로 중간에 드라이브 표기가 있으면, 앞 폴더가 없어도 상담 전체를 거부한다
  summary: 없는 폴더 뒤에 숨긴 드라이브 경로가 건너뛰기로 통과하지 않습니다.
- sha: 35b980b
  at: 2026-10-30 06:13
  text: 폴더를 가리키는 상담 ref는 기존대로 상담을 거부하고, 상태 보고 파일명을 claim 범위에 맞춘다
  summary: 폴더 ref 동작은 바뀌지 않고, 없는 파일·설명 문구만 건너뜁니다.
- sha: '2d892a3'
  at: 2026-10-30 06:12
  text: 상담 refs 중 없는 파일·설명 문구는 그것만 빼고 사유를 프롬프트에 남긴 채 상담을 진행한다(링크·작업 폴더 밖·통제 구역은 그대로 전체 거부)
  summary: 상담 참고 파일 하나가 잘못돼도 요청 전체가 끝나지 않고, 그 파일만 빠진 채 상담이 이어집니다.
