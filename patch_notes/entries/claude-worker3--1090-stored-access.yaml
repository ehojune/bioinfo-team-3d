pr: 1094
rows:
- sha: 'dd81100'
  at: 2026-10-30 20:44
  text: 결론 근거 논문 표시와 문헌 접근 원장 줄이 선행 검색이 저장한 본문·초록 영수증(stored_access)을 별칭까지 합쳐 인정하고 출처를 함께 적는다(인자가 비면 기존 줄 그대로)
  summary: 저장된 선행 본문을 읽고 쓴 요청이 "조회 기록 없음"으로 표시되던 것을 실제 읽은 수준으로 바로잡을 재료가 생깁니다(호출 연결은 다음 단계).
- sha: 'cffd7ac'
  at: 2026-10-30 21:30
  text: CSO의 결론 근거 줄·접근 원장 줄 두 호출에 요청의 analysis_precedents에서 구한 stored_access를 넘기고 manual 한·영에 적는다
  summary: ② 6차처럼 선행 검색에서 본문을 읽은 논문이 CP2 카드에서 "조회 기록 없음"으로 나오던 문제가 실제 요청에서 해소됩니다.
- sha: '4b2dbd8'
  at: 2026-10-30 21:50
  text: 시험 추가 — CP2 결론 근거 줄·접근 원장 줄 호출이 요청의 analysis_precedents에서 구한 stored_access를 받는지(연결을 빼면 실패)
  summary: 선행 검색 기록 합산이 실제 요청 흐름에서 빠지지 않도록 막는 시험입니다.
- sha: '0b22a95'
  at: 2026-10-30 22:20
  text: 저장된 선행 인용의 bare DOI·PMCID와 DOI·PubMed·PMC URL을 별칭으로 정규화(리뷰 P2) + 시험
  summary: 선행 검색 프롬프트가 허용하는 인용 형식이 어떤 것이든 저장된 본문이 결론 근거와 이어집니다.
