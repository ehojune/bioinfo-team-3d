rows:
- sha: '30962b3'
  at: 2026-10-31 20:20
  text: PowerShell 도구의 Invoke-WebRequest·Invoke-RestMethod(iwr·irm·curl·wget 별칭)의 -OutFile, Expand-Archive, Start-BitsTransfer도 Bash와 같은 디스크 확인(disk_space.powershell_check)을 받는다. 대상 드라이브 여유가 기준 아래거나 zip 목록의 실제 크기를 풀면 기준 아래로 내려가면 승인 카드로 묻고, 크기를 모르면 막지 않고 경고만 남긴다. PowerShell을 PowerShell로 읽는 tokenizer를 따로 두어 역슬래시는 경로 구분자, 작은따옴표는 문자 그대로, 큰따옴표는 백틱 이스케이프로 본다. 판정 공통부는 _assess로 모아 Bash 쪽 동작은 그대로다. 사전 승인 규칙 PowerShell(Invoke-WebRequest *) 등도 gate로 돌린다
  summary: PowerShell로 내려받거나 푸는 명령이 디스크 확인을 건너뛰던 틈을 닫습니다. allow에서 ask로만 엄격해지고 크기를 모르면 막지 않습니다.
- sha: '911023e'
  at: 2026-10-31 21:00
  text: manual 한영의 셸 다운로드·압축 해제 확인 단락에 PowerShell 도구도 같은 확인을 받는다는 설명(읽는 cmdlet과 매개변수, PowerShell 문법으로 읽음, 읽지 않는 경우, 사전 승인 규칙)을 넣고 적용하지 못하는 곳 목록에서 PowerShell의 두 cmdlet과 접두 규칙 체인 항목을 뺀다. 체인 항목은 Claude Code가 체인을 명령마다 나눠 검사한다는 #1163 결과에 맞춘 것이다
  summary: 리뷰가 요구할 사용자용 설명을 manual에 더하고 사실과 어긋난 한계 목록을 바로잡습니다.
- sha: '5fe6139'
  at: 2026-10-31 22:00
  text: PowerShell 명령에 출력 경로와 무관한 $ 변수가 있어도(-Headers $h 같은 것) 더는 명령 전체를 건너뛰지 않고, 쓰는 경로 자체에 변수가 든 경우만 읽지 않는다. Expand-Archive는 대상을 생략하면 현재 폴더로 보고 검사한다. Start-BitsTransfer는 -TransferType Upload나 URL 대상이면 로컬 다운로드로 보지 않는다
  summary: PowerShell 디스크 확인의 리뷰 지적 세 건을 고쳐 검사를 건너뛰는 틈을 줄입니다.
- sha: 'aecd193'
  at: 2026-10-31 23:40
  text: PowerShell 인자를 읽는 방식을 cmdlet별 매개변수 표로 바꿔 같은 부류의 지적을 한 번에 닫는다. 이름이나 모호하지 않은 접두어가 표에 있을 때만 매개변수로 보고, 값을 받는 매개변수와 공통 매개변수의 값은 위치 인자로 세지 않는다. 표에 없는 매개변수가 끼면 위치 인자는 읽지 않는다. Module 한정 이름도 같은 cmdlet으로 읽고, Set-Location과 Push-Location의 -Path와 -LiteralPath를 읽는다. 읽을 수 없는 위치 변경 뒤의 명령은 건너뛴다
  summary: PowerShell 디스크 확인이 인자를 잘못 짝짓던 부류를 표 하나로 닫습니다.
