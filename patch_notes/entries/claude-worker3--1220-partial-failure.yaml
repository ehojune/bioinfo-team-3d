pr: 1222
rows:
- sha: 'b3b7a94'
  at: 2026-11-01 02:10
  text: 요청이 일부 단계나 갈래가 실패한 채 완료로 끝나도 목록에는 완료로만 보이던 것을 고친다. 요청이 이미 가진 단계 결과에서 실패와 건너뜀과 한 번도 돌지 않은 단계를 그때그때 계산해 상태 라벨을 완료 일부 실패 N으로 바꾸고, 요청 요약에 failed_steps를 넣는다. 저장하는 필드나 새 상태나 outcome 값은 없다. labhq status는 어느 단계인지 적고 labhq watch의 완료 줄과 웹 요청 목록과 상세와 PDF 보고서 머리말이 같은 표지를 쓴다. 연구 보고서 한계 줄에는 갈래 id를 붙인다. 알림은 띄우지 않는다
  summary: 일부 단계가 실패한 채 끝난 요청이 목록에서 완료 · 일부 실패 N으로 보입니다.
- sha: '643955c'
  at: 2026-11-01 03:00
  text: 리뷰와 CI의 지적을 고친다. 계획만 하는 요청은 일부러 계획만 남기고 완료로 끝나므로 요청 자신의 mode나 outcome으로 알아보아 일부 실패로 세지 않는다. 결과가 하나도 없다는 것만으로 판정하지 않아 어떤 단계도 결과를 남기지 못한 실패는 가려지지 않는다. 보고서 검토 대기 라벨에도 일부 실패 N을 이어 PI가 읽는 라벨에서 표지가 사라지지 않게 하고 review_pending 요청도 같은 판정을 쓴다. 갈래 id가 붙은 한계 줄에 맞춰 mock e2e 시험의 기대값을 바꾼다
  summary: 계획만 한 요청은 일부 실패로 보이지 않고, 보고서 검토 대기 중인 요청에도 일부 실패가 보입니다.
