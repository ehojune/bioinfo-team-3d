pr: 1161
rows:
- sha: 'aa9292d'
  at: 2026-10-31 13:30
  text: 계획 검사의 예약 이름 판정을 둘로 고친다. 예약 이름은 파일 이름 전체일 때만 걸린다(external_lookup_status.jsonl.md나 my_outputs/...는 아님, 문장 끝 마침표와 한국어 조사는 이름을 끝낸다). instruction에서는 그 이름을 직원이 쓰게 하는 문장만 거절한다. 읽기·보고·요약 지시와 다른 파일을 쓰는 동사가 같은 문장에 있는 경우는 허용하고, 쓰기 동사·리다이렉션·새 파일이 이름과 직접 이어진 문장은 계속 거절한다
  summary: 정상 계획을 잘못 거절하던 두 경우(이름이 비슷한 다른 파일, 현재 단계 기록을 읽거나 보고서에 적는 지시)를 허용합니다.
- sha: '11471ae'
  at: 2026-10-31 14:10
  text: instruction에 예약 이름이 나오면 읽기·보고·쓰기를 가리지 않고 모두 거절하고, 앞 단계 산출물 경로(inputs/<단계>/outputs/<이름>)만 허용한다. 쓰기 동사를 해석하는 휴리스틱(_tells_staff_to_write 등)은 뺀다. 리뷰가 같은 부류의 변형(쓰기 동사와 목적지 사이의 출처 경로)을 또 짚어 구조로 닫는다. 파일명 경계 수정은 그대로다
  summary: 쓰기 문구를 해석하다 놓치던 변형을 없애고 계획이 labhq 기록 이름을 직원에게 맡기지 못하게 합니다.
