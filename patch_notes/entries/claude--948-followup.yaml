- sha: '8c2e40e'
  at: 2026-10-25 04:10
  summary: 계획 보정이 깨진 초안에서 예외를 내지 않고, 여러 synthesis 단계 중 가장 가까운 단계를 채우게 했습니다.
  text: '#949 병합 뒤 봇 P2 두 건 반영. 스키마가 틀린 초안(정수 depends_on, 해시 불가능한 id, dict가 아닌 단계)은 예외 대신 그대로 돌려 CSO 교정으로 보낸다. synthesis 단계가 여러 개이고 모두 불완전하면 항상 첫 단계가 아니라 빠진 갈래가 가장 적은 단계(동률이면 첫 단계)를 채운다. 새 테스트 5건과 관련 묶음 통과.'
- sha: '0090b9e'
  at: 2026-10-25 04:40
  summary: synthesis 단계 선택이 빠진 terminal 수가 아니라 빠진 갈래 수를 보게 했고 매뉴얼을 맞췄습니다.
  text: '봇 리뷰 반영. 한 갈래가 여러 terminal로 갈라진 계획에서 terminal 수로 고르면 가장 가까운 단계를 놓친다. 빠진 갈래 수로 고르고(동률이면 첫 단계) docs/manual.md의 "첫 synthesis 단계" 설명을 새 동작에 맞췄다. 새 테스트 1건(옛 기준에서는 실패)과 관련 묶음 통과.'
