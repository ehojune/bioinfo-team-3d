    summary: "잘못된 식별자가 남은 실패 메시지에는 재시도를 안내하지 않습니다."
    text: "#1411 P2: malformed 판정을 failed retry에도 적용한다. 잘못된 task·request 식별자와 type은 모든 retained 상태에서 수동 확인으로 남긴다. 관련 API·doctor·상태 회귀 120건 통과."
  - sha: "518e610"
    at: "2026-11-12 16:05"
    summary: "잘못된 식별자가 남은 메시지도 상태 화면에서 확인하도록 고쳤습니다."
    text: "#1411 집계 경계: malformed 식별자·type을 수동 확인으로 남긴다. 조회 실패 재현 뒤 누적 집계·malformed 경계 8건 통과."
  - sha: "9c00166"
    at: "2026-11-12 15:59"
    summary: "메시지가 많이 보류돼도 상태 조회가 inbox를 반복해서 읽지 않도록 고쳤습니다."
    text: "#1411 P2: runner별 누적 집계로 복구 안내를 판정한다. 40행 읽기 41→1회, 누락·동일 순서와 unknown ask 경계 4개 경우 일치, 관련 회귀 157건 통과."
  - sha: "051bab0"
    at: "2026-11-12 15:46"
    summary: "특수 문자가 든 runner 이름도 안내된 URL로 메시지를 복구하도록 고쳤습니다."
    text: "#1411 P2: runner_id를 query로 전달하고 legacy 세대 표식을 고정한다. 특수 ID 재현 2건 실패 뒤 관련 105건과 기존 경로형 API 회귀 1건 통과."
  - sha: "c856089"
    at: "2026-11-12 15:36"
    summary: "메시지 복구 안내가 기존 웹 화면의 시작·갱신 동작과 함께 작동하도록 고쳤습니다."
    text: "#1411 CI: 3D 경고 영역과 단일 timer를 재사용하고 초기 snapshot을 상태 원본으로 유지한다. 기존 UI 실패 8건 수정 뒤 web·3D·시설 표시 116 passed, 1 skipped. 기존 harness·assertions는 유지했다."
  - sha: "b928d11"
    at: "2026-11-12 15:14"
    summary: "doctor가 원격 서버를 조회할 때 token을 보호하고 복구 명령을 안전하게 안내합니다."
    text: "#1411 P1·P2: 원격 평문 조회 거부, redirect 금지, percent-encoded 복구 경로 검사와 Bash URL quoting을 적용했다. 재현 4건 실패 뒤 web·doctor 회귀 98건 통과."
  - sha: "ebf078e"
    at: "2026-11-12 15:05"
    summary: "다른 runner의 메시지 보류가 전파되지 않게 하고 복구 안내를 웹과 doctor에 표시합니다."
    text: "#1386 10번: 같은 runner의 ACK·세대·결과 불명 보류는 유지한다. 원문 없는 상태 조회와 두 UI의 5초 갱신, doctor --network 읽기와 수동 retry/resume 안내를 추가했다. 관련 mock 310건과 web·doctor 재검증 90건으로 확인했으며 운영 복구는 미검증이다."
