rows:
- sha: 28fe73f
  at: 2026-10-06 02:51
  text: 단계가 앞 단계 산출을 작업 폴더 안 inputs/<단계>로 읽고(runner가 링크, 프롬프트엔 상대경로만), 요청 묶음은 보고하지 않은 산출도 복사하고 link_inputs.py로 그 링크를 다시 건다(#423).
  summary: 앞 단계 결과를 입력 폴더로 연결하고 결과 묶음에서도 같은 연결을 재현하게 했습니다.
- sha: 88cabe3
  at: 2026-10-06 03:05
  text: inputs/<단계> 링크를 held handle로 바꿔 끼우고(진짜 파일·폴더는 안 건드림), 링크 이름 규칙을 요청 묶음의 단계 폴더 규칙과 맞췄다.
  summary: 입력 링크를 안전하게 바꾸되 진짜 파일·폴더는 건드리지 않고 단계 이름 규칙도 맞췄습니다.
- sha: 6623b83
  at: 2026-10-06 03:11
  text: HPC 제출 검사는 앞 단계 outputs로 풀리는 inputs 링크만 지나치고, 링크 교체는 옆으로 옮긴 항목이 링크일 때만 지운다.
  summary: 계산 서버 제출에서 앞 단계 결과 입력 링크만 예외로 두고 링크 교체 시 원본은 지킵니다.
- sha: f985c93
  at: 2026-10-06 03:21
  text: 공유 계정 HPC 모드(hpc.submit_prefix)에서는 inputs 링크 대신 원래 경로를 주고, HPC 제출 검사는 main처럼 모든 링크를 거부한다.
  summary: 공유 계정 계산 서버에는 원래 입력 경로를 주고 제출 검사에서 모든 링크를 거부합니다.
