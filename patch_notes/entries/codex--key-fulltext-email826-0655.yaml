  text: 'docs/manual.md 문헌 도구 절의 Unpaywall email 항목에 key_fulltext도 같은 email을 쓴다는 한 문장을 더했다(177,138→177,193자). 승인 main 9d4836c를 명시 merge했고 annot_mcp.py·test_external_wait.py core는 바뀌지 않았다. 기관 setup·WoS·Nexus·구독 원문은 범위 밖이며 #826은 부분 해결이다.'
