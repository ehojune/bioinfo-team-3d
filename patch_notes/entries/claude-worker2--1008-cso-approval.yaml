- sha: e5c419d
  at: 2026-10-29 18:46
  text: constrain 중 읽기 밖의 도구 호출을 hook→runner broker /restricted→gateway CSO 순으로 한 번씩 판정한다(같은 호출 1회, 제한당 5회, 회차 불일치·종료·무응답은 거절, 허용은 기존 권한 검사를 면제하지 않음) (#1008).
  summary: 도구가 제한된 직원이 꼭 필요한 호출을 하려 할 때 CSO가 한 번씩 허용하거나 거절하고, 같은 일을 되풀이하면 막습니다.
- sha: 18ed324
  at: 2026-10-29 18:59
  text: 연결이 끊겼다 돌아와 다시 보낸 90초 넘은 restricted 요청은 판정·예산에 쓰지 않고 거절한다 (#1028 리뷰 P2).
  summary: 이미 거절된 호출이 뒤늦게 허용 횟수를 써 버리지 않게 했습니다.
- sha: 958470b
  at: 2026-10-29 19:12
  text: restricted.requested 이벤트에서 호출 입력을 빼 runner 기록·재전송 대기열에 남기지 않고(P1), 판정한 호출·허용 횟수를 gateway state에 저장해 재시작 뒤에도 잇는다 (#1028 리뷰).
  summary: 제한 중 도구 호출의 내용이 기록에 남지 않게 했고, 서버를 다시 켜도 허용 횟수가 초기화되지 않게 했습니다.
