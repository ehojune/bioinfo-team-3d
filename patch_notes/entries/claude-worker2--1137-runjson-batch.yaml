rows:
- sha: '847a7b2'
  at: 2026-10-31 11:20
  text: task 종료 직전의 run.json 갱신(산출 환경 기록, 입력 hash)을 메모리에 모았다가 종료 쓰기에 실어 fsync 한 번으로 줄였다. 시작 갱신과 실행 중 accounting은 즉시 쓴다. 중간에 끊긴 단계는 run_task의 finally가 모은 필드를 쓴다 (#1137 안 G1).
  summary: 느린 디스크에서 작업 하나가 기록을 저장하며 기다리는 횟수가 4번에서 2번으로 줄었습니다. 결과를 보내기 전에 모든 기록이 디스크에 있다는 점은 그대로입니다.
