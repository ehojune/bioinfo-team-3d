    summary: "문헌이 없는 원격 계산 단계에는 문헌 누락 경고를 띄우지 않습니다."
    text: "#1410 P2: 링크를 따라가지 않고 문헌 목록만 확인한다. 문헌 없음·빈 폴더·inbox만 있는 경우의 오탐 재현 3건 실패 → 관련 48건 통과. 목록 검사 실패는 경고로 남긴다."
  - sha: "3c5731b"
    at: "2026-11-12 15:00"
    summary: "다음 단계로 넘기지 못한 문헌이 있으면 경고합니다."
    text: "#1385 9번: 200개 초과 문헌 목록의 잘림과 원격 전용 조상의 문헌 미복사를 알린다. 문헌 경고만으로 HPC 배정을 막지 않으며 산출 입력 누락은 계속 거부한다. 관련 mock 회귀 45건 통과."
