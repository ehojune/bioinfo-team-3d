rows:
- sha: b75a0d3
  at: 2026-10-12 12:57
  text: 승인 게이트가 find -exec payload·rm 옵션 단어·PowerShell pipe 뒤 삭제를 리터럴로 읽을 수 없으면 묻고, ~로 시작하는 셸 쓰기 대상을 그 셸의 home으로 펼쳐 허용 폴더와 대조한다. 공유 환경 R 설치 판정은 프로그램 자리 단어에만 걸고, 통제 구역 링크가 있는 project 폴더를 연 Claude 단계는 링크의 다른 표기(8.3 이름·대소문자)도 게이트로 보낸다.
  summary: 복잡한 삭제 명령은 승인을 받고 홈 경로·공유 설치·통제 구역 별칭 검사도 보강했습니다.
- sha: c5c9010
  at: 2026-10-12 12:59
  text: 공유 환경 판정에서 wrapper 뒤 프로그램 자리를 찾는 코드를 하나로 합치고, ~ 쓰기를 묻는 사유에 펼친 경로를 함께 보인다.
  summary: 명령을 감싼 실행기 뒤의 실제 프로그램 판정을 통일하고 홈 경로를 승인 이유에 보입니다.
- sha: 2002b27
  at: 2026-10-12 14:00
  text: 공유 환경 판정이 uv·conda·pixi·poetry 같은 실행기의 전역 옵션을 표로 건너뛰어 run이 실행하는 프로그램을 찾고, 표에 없는 옵션이나 모르는 실행기면 뒤 단어를 모두 프로그램 자리로 본다. 재귀 삭제 규칙은 실제 rm에만 걸어 docker rm·지금 트리의 git rm·따옴표로 감싼 변수 하나를 지우는 rm은 묻지 않고, PowerShell 출력 문자열 속 .Delete( 글자는 삭제로 보지 않는다.
  summary: 실제 실행 명령을 더 정확히 찾아 설치·삭제 위험을 판단하고 단순 문자열 오탐을 줄였습니다.
