  - sha: "b75a0d3"
    at: "2026-10-12 12:57"
    text: "승인 게이트가 find -exec payload·rm 옵션 단어·PowerShell pipe 뒤 삭제를 리터럴로 읽을 수 없으면 묻고, ~로 시작하는 셸 쓰기 대상을 그 셸의 home으로 펼쳐 허용 폴더와 대조한다. 공유 환경 R 설치 판정은 프로그램 자리 단어에만 걸고, 통제 구역 링크가 있는 project 폴더를 연 Claude 단계는 링크의 다른 표기(8.3 이름·대소문자)도 게이트로 보낸다."
  - sha: "c5c9010"
    at: "2026-10-12 12:59"
    text: "공유 환경 판정에서 wrapper 뒤 프로그램 자리를 찾는 코드를 하나로 합치고, ~ 쓰기를 묻는 사유에 펼친 경로를 함께 보인다."
