    text: "실행 중인 직원에게 웹 상세 시트·labhq task·REST로 방향을 보내고, 일시 정지·재개하고, 세션을 남긴 채 멈출 수 있다. Claude는 도구 hook으로 바로, 다른 엔진은 다음 turn에서 받는다(#59)."
  - sha: "b8f4a19"
    at: "2026-10-12 05:11"
    text: "main 병합. 매뉴얼 CLI 예시와 node test 목록의 충돌만 풀었다."
  - sha: "15bbd6a"
    at: "2026-10-12 05:49"
    text: "리뷰 반영: 적용하지 못한 제어는 받았다고 답하지 않아 재연결 때 다시 오고, 다시 온 제어는 끝난 작업에서도 한 번만 적용된다. 한 직원이 작업 둘을 동시에 하면 시트에 작업마다 제어 줄이 생기고, 재개 기한이 지난 멈춤은 열린 화면에서도 재개 버튼이 사라진다(#59)."
  - sha: "92e046a"
    at: "2026-10-12 12:51"
    text: "main 병합. gateway Hub 초기화의 채용 수 주석 충돌만 풀었다."
  - sha: "4f880ca"
    at: "2026-10-12 13:36"
    text: "리뷰 2차: 방향·정지·멈춤은 쓰일 때까지 runner 상태 폴더에 남아 runner를 다시 띄워도 이어지고, 이어 받기는 직원·세션 단위다. 실행 순서를 기다리던 turn은 멈추기를 누르면 시작하지 않고 바로 멈추고, 요청 취소로 끝난 멈춤도 화면의 재개 버튼이 사라진다(#59)."
  - sha: "0c34544"
    at: "2026-10-12 14:25"
    text: "직원 제어 재설계: 방향·정지·멈춤은 작업이 아니라 단계에 걸리고 gateway가 쓰일 때까지 보관한다. 끝난 작업 줄에서 보내도 같은 단계의 지금 turn에 가고, 아직 시작하지 않은 turn은 정지와 방향을 받은 뒤 시작하며, 단계가 끝날 때 쓰이지 않은 방향은 알린다(#59)."
  - sha: "c14107e"
    at: "2026-10-12 15:19"
    text: "직원 제어는 계획 단계 작업과 직접 맡긴 작업에만 되고, 상담·이어 묻기 같은 작업은 거절한다. HPC 잡·질문 대기 중에는 멈추기 대신 일시 정지를 쓰라고 하고, 대기에 들어가며 받은 멈춤은 잡과 대기 뒤 turn을 남긴 채 일시 정지가 된다(#59)."
  - sha: "cdbca07"
    at: "2026-10-12 15:29"
    text: "웹이 제어 줄을 고를 수 있게 snapshot의 실행 중 작업에 작업 종류를 싣는다. 종류가 없는 작업은 전과 같다(#59)."
