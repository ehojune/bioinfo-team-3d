  text: 연구 단계 프롬프트에 동결 protocol(제외 기준·분석 단위·통계)을 넣고 이탈은 method_changes에 적게(8차 시운전 리뷰 P1)
  summary: 단계마다 승인된 분석 기준을 알려주고 방법 변경은 따로 적게 합니다.
- sha: 37722ed
  at: 2026-10-03 19:08
  text: 동결 protocol은 단계·리뷰·보고서 프롬프트 어디서도 자르지 않고, 길면 단계 목록만 자름(봇 P1)
  summary: 승인 후 고정한 분석 절차는 길어도 작업·검토·보고서 안내에서 자르지 않습니다.
