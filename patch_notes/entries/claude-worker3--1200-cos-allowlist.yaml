- sha: '58b02f4'
  at: 2026-11-01 00:00
  text: 직원이 쓸 수 있는 labhq_annot 도구를 서버가 걸러 준다. 직원 파일의 annot_tools에 이름을 적으면 러너가 환경 변수 LABHQ_ANNOT_TOOLS로 서버에 넘기고, 서버는 그 도구만 등록한다. 값이 없으면 전부 내므로 기존 직원은 달라지지 않고, 목록에 모르는 이름이 있으면 서버가 시작하지 않는다. 이름 목록으로 막던 비서실장은 문헌 도구 7개 허용 목록으로 바꾸어 새 도구가 생겨도 닫혀 있다. 엔진마다 다르게 걸리던 차단이 모든 엔진에 같게 걸린다
  summary: 비서실장 같은 직원은 허용된 조회 도구만 받고, 나중에 생기는 도구는 기본으로 닫힙니다.
