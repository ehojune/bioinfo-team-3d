pr: 1201
rows:
- sha: '58b02f4'
  at: 2026-11-01 00:00
  text: 직원이 쓸 수 있는 labhq_annot 도구를 서버가 걸러 준다. 직원 파일의 annot_tools에 이름을 적으면 러너가 환경 변수 LABHQ_ANNOT_TOOLS로 서버에 넘기고, 서버는 그 도구만 등록한다. 값이 없으면 전부 내므로 기존 직원은 달라지지 않고, 목록에 모르는 이름이 있으면 서버가 시작하지 않는다. 이름 목록으로 막던 비서실장은 문헌 도구 7개 허용 목록으로 바꾸어 새 도구가 생겨도 닫혀 있다. 엔진마다 다르게 걸리던 차단이 모든 엔진에 같게 걸린다
  summary: 비서실장 같은 직원은 허용된 조회 도구만 받고, 나중에 생기는 도구는 기본으로 닫힙니다.
- sha: '1b54efe'
  at: 2026-11-01 00:20
  text: 모든 labhq_annot 도구가 20분 실행기를 지나는지 보는 시험이 server.tool 장식자만 도구로 세던 것을 offered 장식자도 세게 한다. 요구하는 도구 수와 실행기 확인은 그대로다
  summary: 도구 등록 방식이 바뀌어도 모든 조회 도구가 시간 상한을 거치는지 계속 확인합니다.
- sha: '2fecd3e'
  at: 2026-11-01 00:50
  text: 읽기 전용 프로필은 AgentSpec의 모든 필드를 분류해야 하는데 새 annot_tools가 빠져 읽기 전용 실행이 시작하지 못했다. 읽기 전용 실행은 labhq MCP 서버를 모두 끄므로 annot_tools도 비우는 쪽에 분류하고 한 시험으로 고정한다
  summary: 검토와 후속 질의 같은 읽기 전용 실행이 annot_tools 필드를 추가한 뒤에도 정상 시작합니다.
