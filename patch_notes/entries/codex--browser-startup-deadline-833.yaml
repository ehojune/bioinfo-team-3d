rows:
- sha: 5cee000
  at: 2026-10-23 09:42
  summary: 창 크기 조절 브라우저 시험이 시간 제한에 걸려도 열어 둔 브라우저를 정리할 시간을 남기고, Chrome이 실제로 만들어졌는지를 기록합니다.
  text: 'tests/test_web_3d.py는 web_resizable_panels.cjs에만 30초 watchdog의 절대 끝 시각을 넘기고, 시험은 그 시각에서 정리 5초·profile 삭제 재시도 2초·종료 1초를 뺀 작업 기한 하나를 desktop과 phone에 함께 쓴다. demo driver는 이 기한이 있을 때만 Chrome 시작, DevTools 조회, CDP socket과 호출, navigate, boot 대기를 그 안에서 끝내고 남은 요청은 abort하거나 버린 뒤 기존 close()로 한 번 정리한다. 기한이 지나면 다음 viewport를 열지 않는다. Job wrapper는 Chrome Popen이 돌아온 뒤 고정 줄을 쓰고, DevToolsActivePort 읽기 실패는 고정 코드별 횟수만, 기한에 걸린 단계는 한 줄만 남긴다. 30초 상한, 판정, 다른 호출의 기본값은 그대로다. Chrome 시작이 느린 원인은 확인되지 않았고 이 변경은 그 해결이 아니다. 예전에 22초를 넘겨 통과하던 느린 실행은 이제 기한 실패로 끝날 수 있다.'
