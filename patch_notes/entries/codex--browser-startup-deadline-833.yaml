pr: 875
rows:
- sha: 5cee000
  at: 2026-10-23 09:42
  summary: 창 크기 조절 브라우저 시험이 시간 제한에 걸려도 열어 둔 브라우저를 정리할 시간을 남기고, Chrome이 실제로 만들어졌는지를 기록합니다.
  text: 'tests/test_web_3d.py는 web_resizable_panels.cjs에만 30초 watchdog의 절대 끝 시각을 넘기고, 시험은 그 시각에서 정리 5초·profile 삭제 재시도 2초·종료 1초를 뺀 작업 기한 하나를 desktop과 phone에 함께 쓴다. demo driver는 이 기한이 있을 때만 Chrome 시작, DevTools 조회, CDP socket과 호출, navigate, boot 대기를 그 안에서 끝내고 남은 요청은 abort하거나 버린 뒤 기존 close()로 한 번 정리한다. 기한이 지나면 다음 viewport를 열지 않는다. Job wrapper는 Chrome Popen이 돌아온 뒤 고정 줄을 쓰고, DevToolsActivePort 읽기 실패는 고정 코드별 횟수만, 기한에 걸린 단계는 한 줄만 남긴다. 30초 상한, 판정, 다른 호출의 기본값은 그대로다. Chrome 시작이 느린 원인은 확인되지 않았고 이 변경은 그 해결이 아니다. 예전에 22초를 넘겨 통과하던 느린 실행은 이제 기한 실패로 끝날 수 있다.'
- sha: f8d91b0
  at: 2026-10-23 09:47
  summary: Windows 검사 목록이 바뀐 시험 파일을 알아보도록 기록값을 맞췄습니다.
  text: 'tests/test_web_3d.py가 바뀌어 config/ci/windows-boundary-v1.json의 원본 sha256만 갱신했다. Windows에서 남기는 node와 suite 구성은 그대로다.'
- sha: 1c49ee5
  at: 2026-10-23 09:54
  summary: 창 크기 조절 브라우저 시험이 데스크톱과 휴대폰 화면을 각각 따로 시간 제한 안에서 실행하므로, 앞 화면이 시간을 다 써서 뒤 화면이 실패하는 일이 없어집니다.
  text: '같은 pytest node가 web_resizable_panels.cjs를 LABHQ_RESIZABLE_VIEWPORT=desktop, phone으로 차례로 두 번 실행하고, 각 실행은 timeout 30초와 새 절대 끝 시각을 받는다. job 120174823730에서 공유 기한이 phone에 812ms만 남긴 문제를 고친다. 브라우저가 필수일 때 각 실행은 pass 3, skipped 0과 해당 viewport의 ok 3 제목을 보여야 하며 어느 한쪽의 실패·skip·누락도 node 실패다. JS는 선택된 viewport의 브라우저 시험만 등록하고 잘못된 선택값과 viewport 없는 기한을 거부한다. 판정, suite, workflow는 그대로이고 Windows 목록은 digest만 바꿨다. 이 node는 최대 약 60초가 걸릴 수 있다. Chrome 시작 지연의 원인은 여전히 확인되지 않았다.'
