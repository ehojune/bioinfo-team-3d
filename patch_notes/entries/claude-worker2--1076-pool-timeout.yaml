- sha: 'fa35af6'
  at: 2026-10-31 04:00
  text: Windows pool 단계 상한을 성공한 최악값 499초의 1.5배인 13분으로, job 상한을 18분으로 올렸다 (#1076).
  summary: Windows 시험 묶음이 9분 제한에 걸려 잘리던 것을 막았습니다. 시험 선택과 gate는 그대로입니다.
- sha: 'e7c0baa'
  at: 2026-10-31 04:20
  text: Windows 워크플로 구조 시험의 상한 고정값 두 줄을 새 상한(13분, 18분)에 맞췄다 (#1076).
  summary: 새 시간 상한을 고정하는 시험이 낡은 값 때문에 실패하지 않게 했습니다.
