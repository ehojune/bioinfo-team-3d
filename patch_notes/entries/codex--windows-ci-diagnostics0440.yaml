    summary: "자동 검사가 시간 초과로 끊겨도 어떤 검사가 실패했고 얼마나 걸렸는지 기록이 남습니다."
    text: "ci_suite가 process별 diagnostics-<worker>.json(진단 전용, proof·재사용 밖)에 실패 stage의 duration·예외 kind·crash 첫 줄과 느린 stage 상위 30을 즉시 원자적으로 남긴다. 시설팀 fallback 검사는 실제 wait_agent_online의 (facilities, 0.2) offline 종료와 CSO fallback·저장을 단언하고 wait_for는 60초 hang 감시로만 둔다. #837 실제 원인은 미확인이다."
