- sha: 481caca
  at: 2026-10-22 09:17
  summary: 웹에서 여우를 누르면 이번 요청의 선행 연구 목록과 논문별 자문 스킬 카드를 볼 수 있습니다.
  text: '요청 상세 GET이 저장된 요청 기록만으로 paper_literature를 함께 돌려준다(새 route·파일 읽기·빌드 없음). 선행 연구 논문마다 계획 참고·자문 스킬·재현 채용 여부를 표시하고, 행을 누르면 스킬로 만든 방법·상태·생성 버전과 skill hash·Paper2Agent commit·붙을/붙은 단계·결과 참조가 열린다. 결과 참조는 도구 호출이나 효용의 증거가 아니라고 함께 적는다. 손상 기록은 스킬 표시를 생략하고 경로는 내보내지 않는다. 실행 기록의 스킬 줄도 호출됨 대신 결과 참조로 바꿨다. 실제 요청에서의 부착·효용은 미확인이며 3D 화면은 아직 없다.'
- sha: 6dcf262
  at: 2026-10-22 09:26
  summary: 3D 사무실에서도 여우를 고르면 같은 선행 연구 목록과 스킬 카드가 나옵니다.
  text: '3D 선택 패널에서 여우를 고르면 2.5D 시트와 같은 ui/literature.js로 현재 요청의 선행 연구 목록을 그린다. 데이터는 live.js가 기존 인증 detail GET으로 받아 공유 reducer에 채우며, 요청이 바뀔 때만 한 번 읽고 실패해도 반복하지 않는다. 매뉴얼 선행 연구 절에 여우 목록·행 카드와 결과 참조의 뜻을 적었다.'
- sha: aadca75
  at: 2026-10-22 09:34
  summary: 저장된 기록 일부가 손상돼도 요청 상세와 여우 목록이 열리고 손상 표시만 남습니다.
  text: '독립 검토에서 recruit_results가 목록이 아닌 기록이 요청 상세 GET 전체를 500으로 깨는 것을 찾았다. literature_view가 그 값을 순회하지 않고 damaged로 표시하며, receipt의 status·reason·call_status는 문자열일 때만 허용 집합과 비교한다. 정상 기록·인증·404·저장 기록 불변은 그대로이고 GET 전체를 예외로 덮지 않았다.'
