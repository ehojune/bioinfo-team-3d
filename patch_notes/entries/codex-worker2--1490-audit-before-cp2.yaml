rows:
  - sha: 'c057767'
    at: '2026-11-25 07:28'
    summary: 옵션을 켜면 근거 승인 전에 연구 초안을 독립 감사합니다.
    text: 코드와 표를 먼저 검토하고 초안과 감사 결과를 근거 승인 카드에서 함께 본다. 산출물을 다시 확인하고 계획·산출물·초안 해시가 맞을 때만 감사 결과를 재사용한다.
  - sha: '3c9d411'
    at: '2026-11-25 07:35'
    summary: 감사자가 읽은 초안과 근거 승인 카드의 초안을 일치시켰습니다.
    text: 그림 링크와 BOM을 포함한 수집 원문을 자동 검사·감사·카드에 사용하고 그 해시를 영수증에 남긴다.
  - sha: 'ac39867'
    at: '2026-11-25 07:44'
    summary: 근거 승인 메모를 독자가 보는 보고서에 싣습니다.
    text: 이번 승인 메모는 보고서 본문에 인용한다. 앞 차수 승인 메모는 초안 작성자와 감사자에게 전달한다.
  - sha: 'dd1f3b7'
    at: '2026-11-25 07:53'
    summary: Gateway로 받은 결과표도 감사 전에 대조합니다.
    text: 구조화된 단계 결과를 표 검사 입력 형식으로 맞추고 검증된 전송본을 읽는 경로를 시험했다.
