  text: runner가 직접 시작하는 로컬 job은 정책 판정만 거치고 셸 명령에 붙는 디스크 확인을 건너뛰었다. 정책이 허용한 명령에 같은 확인을 적용해 다운로드나 압축 해제가 여유 없는 드라이브를 향하면 job을 시작하기 전에 PI에게 묻는다. 허용을 묻기로 바꾸는 것까지만 하고 크기를 모르면 막지 않으며, 여유가 적을 뿐 크기를 모르면 경고만 남긴다. 확인 중 오류가 나도 정책이 허용한 명령을 막지 않는다
  summary: 로컬 job으로 큰 다운로드나 압축 해제를 시작할 때도 드라이브 여유가 없으면 PI에게 묻습니다.
