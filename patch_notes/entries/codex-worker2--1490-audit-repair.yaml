  - sha: '9dc8e11'
    at: '2026-11-25 09:11'
    summary: 감사 지적을 고칠 때 분석 뒤에 바뀐 원본 폴더가 다시 전달되지 않게 했습니다.
    text: 수정 세션에는 해시를 확인한 수집 산출물의 읽기 전용 사본을 전달한다. 요청의 참조 경로와 직원의 프로젝트 폴더는 수정 turn에 열지 않는다.
  - sha: '91ebc0e'
    at: '2026-11-25 09:01'
    summary: 감사자가 지적마다 승인된 계획을 바꿔야 하는지 밝힙니다.
    text: 자동 수정용 감사 응답에서 설계 변경 여부를 필수로 받는다. 별도 차례에서 쓴 초안도 수정할 때는 결과 원장과 산출물을 함께 받는다.
  - sha: 'bef9ce8'
    at: '2026-11-25 08:55'
    summary: 옵션을 켜면 근거 승인 전에 감사에서 발견한 중요한 오류를 다시 확인하고 고칩니다.
    text: 원래 분석 세션이 P1을 최대 두 번 수정한다. 수정본을 다시 감사하고 남은 지적과 수정 결과를 CP2 카드에 표시한다.
