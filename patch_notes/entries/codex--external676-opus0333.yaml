    summary: "외부 자료 조회가 시간 초과·실패·취소로 빠지면 작업판과 보고서 한계에 표시합니다."
    text: "runner가 단계 workspace의 outputs/external_lookup_status.jsonl을 link guard·크기/행/문자열/유한 수치 제한으로 다시 읽어 TaskResult.external_lookups에 도구별 결과를 남기고, 작업판 warn·일반 보고 경고·연구 CP2 카드·## 한계에 검증된 이름·건수·초만 표시한다. 원장 행이 없어도 드러내며 workspace 기록일 뿐 호출·독해 증명이 아니므로 증거 칸·성공·필수/선택 산출·CP2 판정은 바꾸지 않는다. 임의 셸·타사 MCP 상한과 실요청 표시는 미확인이다."
