  text: HPC 단계의 PC 수신 기록을 저장하고 단계 간 전달에 쓸 검사를 준비한다.
  summary: HPC 단계가 끝나면 PC에서 받은 파일과 생략 사유를 작업 기록에 남깁니다.
- sha: 'df436e4'
  at: 2026-11-21 06:43
  text: PC 전달용 검증은 원격 목록에 없는 산출도 거절한다. 매뉴얼에는 현재 저장하는 수신 기록만 설명한다.
  summary: PC 전달용 검증은 같은 HPC 작업의 수신 기록을 파일마다 요구합니다.
