pr: 899
rows:
- sha: '2037417'
  at: 2026-10-24 01:09
  summary: 재시작 뒤 재개 카드 하나로 계획 승인까지 끝나도록 했습니다.
  text: 'CP1(계획 승인) 전에 멈춘 첫 연구 계획이면 재개 카드가 단계·직원·지시 앞부분·비용 추정·집행 상한을 보여 주고, 승인하면 그 계획 hash의 CP1 영수증(via=resume_card)을 한 번만 기록해 CP1 카드를 다시 묻지 않는다. hash 불일치·이어 가기·단계 실행 뒤 재승인·멈춘 의미 장치·paper skill/재배정 안내는 기존 CP1 카드를 그대로 묻는다. 새 테스트 6건(수정 전 4건 실패)과 관련 묶음을 로컬에서 통과했고, 웹 화면 표시와 실제 요청은 확인하지 않았다.'
- sha: '699b0c0'
  at: 2026-10-24 01:25
  summary: 새 테스트가 CI의 Windows 검토 목록에 빠져 있어 등록했습니다.
  text: 'config/ci/windows-boundary-v1.json known_tests에 tests/test_resume_cp1_654.py를 추가했다. 목록에 없는 새 테스트는 pytest 시작 전에 거부되어 3.10·3.12 job이 실패했다. test_ci_windows10m·test_ci_boundary_preview 117건 로컬 통과.'
- sha: '3f05b9e'
  at: 2026-10-24 02:05
  summary: 재개 카드에서도 동결되는 계획 전체를 볼 수 있게 했습니다.
  text: '봇 리뷰 반영. 재개 카드 detail에 CP1 카드와 같은 plan_canonical·pack 적용·경고·protocol 정보를 싣고 웹이 재개 카드에서도 계획 전체를 그린다. resume_cp1은 CP1 영수증을 저장하는 save에서 지워 저장 전 종료에도 PI 승인이 남고, paper skill·재배정 안내가 있는 계획에는 통합 승인 카드를 만들지 않는다. 새 python 테스트 7건·web 테스트 1건(수정 전 실패 확인)과 관련 묶음 303건 통과. 웹 7건은 main에서도 실패하는 브라우저 의존 테스트다.'
- sha: 'fcb0550'
  at: 2026-10-24 02:15
  summary: 매뉴얼의 재개 카드 설명을 바뀐 동작에 맞췄습니다.
  text: 'docs/manual.md 결정 카드 기한 절에 재개 카드가 동결 계획 전체를 보여 주고 CP1 승인을 한 번만 기록하며, 기록은 CP1 영수증 저장 때 함께 지워진다고 적었다. docs/status도 갱신했다. 문서만 바꿨고 실행은 없다.'
- sha: '8c17d4b'
  at: 2026-10-24 02:40
  summary: gateway를 다시 켠 뒤에도 재개 카드 한 번으로 계획 승인까지 끝나도록 했습니다.
  text: '봇 리뷰 반영. 재시작 복구는 orchestrator를 만들기 전에 재개 카드를 열어 계획이 빠졌으므로, Hub가 orchestrator를 만든 뒤 계획 없는 재개 카드에 계획·비용·집행 상한을 붙인다(PI용 요약도 다시 만든다). 승인 토큰(resume_cp1)은 재개 카드를 해결하기 전에 저장해, 그 사이 종료돼도 승인이 남는다. 실제 Hub 두 번 재시작 테스트와 저장 순서 테스트 2건(재시작 테스트는 수정 전 실패 확인)·관련 묶음 248건 통과.'
- sha: '103b9ff'
  at: 2026-10-24 02:50
  summary: 재시작 뒤 재개 카드가 실제로 적용되는 집행 상한과 같은 금액을 보여 주도록 고쳤습니다.
  text: '봇 리뷰 반영. 재시작한 gateway의 비용 장부는 비어 있어, 이미 쓴 비용이 카드의 집행 상한에서 빠졌다(예: 쓴 $2 + 계획 $3인데 $3으로 표시). 카드를 만들기 전에 저장된 cost_usd를 장부에 넣는다. 계획을 붙인 재개 카드는 approval.requested 이벤트도 새로 기록해, 커서로 다시 접속한 화면이 계획 없는 옛 카드를 보지 않게 했다. 새 테스트 2건(수정 전 실패 확인)·관련 묶음 124건 통과.'
