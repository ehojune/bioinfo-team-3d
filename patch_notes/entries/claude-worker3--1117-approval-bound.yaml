  text: test_approval_durable_606의 backpressure 상한 시험에서 취소 뒤 종료 마감을 0.5초에서 5초로, 진입 대기를 1초에서 10초로 올린다. 구현의 전송 상한은 시험이 0.05초로 줄이므로 5초는 그 100배이고, 대기가 끝나지 않는 구현은 여전히 같은 메시지로 실패한다
  summary: 느린 러너에서 0.5초 마감에 걸려 실패하던 간헐 실패(pytest-windows main)를 막습니다.
