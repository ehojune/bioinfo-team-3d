  text: 게시용 코드의 비밀값 가리기가 구문을 깨던 8차 시운전 사례(token = r["x"].split(",")[0])를 회귀 시험으로 먼저 만든다. 리터럴 비밀값은 계속 가려지고 코드는 compile되며 scan_publish_files를 통과해야 한다
  summary: 결과 저장 실패의 원인을 재현하는 실패 시험 13건을 먼저 둡니다.
- sha: 'db4a004'
  text: 코드 파일(.py·.r·.sh)의 비밀값 가리기를 리터럴 값에만 적용한다. 따옴표 문자열은 따옴표와 접두를 남기고 안쪽만, 6자리 이상 숫자와 셸의 따옴표 없는 단어는 따옴표 문자열로 바꾸며 표현식·호출·os.environ 조회는 그대로 둔다. 이름 뒤 따옴표(dict·JSON 키)·R의 <-·타입 주석이 붙은 대입도 읽는다. scan_publish_files도 코드 파일은 같은 규칙으로 판정하고 따옴표로 감싼 가림 표시를 이미 가린 값으로 인정한다. 문서 규칙과 SECRET_PATTERNS는 그대로다
  at: 2026-11-05 17:50
  summary: 변수명이 token·key·secret인 분석 코드 때문에 결과 저장 전체가 실패하던 문제를 닫습니다. 실제 리터럴 비밀값은 계속 가립니다.
