rows:
- sha: 'a9c7e73'
  at: 2026-11-05 17:20
  text: 게시용 코드의 비밀값 가리기가 구문을 깨던 8차 시운전 사례(token = r["x"].split(",")[0])를 회귀 시험으로 먼저 만든다. 리터럴 비밀값은 계속 가려지고 코드는 compile되며 scan_publish_files를 통과해야 한다
  summary: 결과 저장 실패의 원인을 재현하는 실패 시험 13건을 먼저 둡니다.
- sha: 'db4a004'
  text: 코드 파일(.py·.r·.sh)의 비밀값 가리기를 리터럴 값에만 적용한다. 따옴표 문자열은 따옴표와 접두를 남기고 안쪽만, 6자리 이상 숫자와 셸의 따옴표 없는 단어는 따옴표 문자열로 바꾸며 표현식·호출·os.environ 조회는 그대로 둔다. 이름 뒤 따옴표(dict·JSON 키)·R의 <-·타입 주석이 붙은 대입도 읽는다. scan_publish_files도 코드 파일은 같은 규칙으로 판정하고 따옴표로 감싼 가림 표시를 이미 가린 값으로 인정한다. 문서 규칙과 SECRET_PATTERNS는 그대로다
  at: 2026-11-05 17:50
  summary: 변수명이 token·key·secret인 분석 코드 때문에 결과 저장 전체가 실패하던 문제를 닫습니다. 실제 리터럴 비밀값은 계속 가립니다.
- sha: '811b105'
  at: 2026-11-05 18:20
  text: 새 시험 파일 tests/test_result_storage_redact_1278.py를 config/ci/windows-boundary-v1.json의 known_tests에 올려 Windows 검토 목록 검사를 통과시킨다
  summary: 새 시험이 Windows 목록에 없어 CI가 시작 전에 실패하던 것을 바로잡습니다.
- sha: 'faccab7'
  at: 2026-11-05 19:00
  text: 코드의 비밀값 리터럴 판정을 넓힌다. 삼중 따옴표 문자열, 괄호로 감싼 문자열, +나 공백으로 이어 붙인 문자열 전체와 부호가 붙은 숫자·16진수·밑줄 숫자를 읽고, 숫자는 우변 전체일 때만 리터럴로 본다(12345678 + offset은 표현식으로 둔다)
  summary: 삼중 따옴표나 이어 붙인 문자열, 부호·16진 숫자로 쓴 비밀값이 가려지지 않던 틈을 닫습니다.
- sha: '4a6e5b7'
  at: 2026-11-05 19:20
  text: 이어 붙인 문자열의 공백 연결을 같은 줄 안의 공백·탭으로 한정해 다음 줄의 독립된 문자열(docstring 등)까지 가리지 않게 한다
  summary: 비밀값 다음 줄의 문자열이 함께 가려지던 과잉 일치를 막습니다.
- sha: 'f918ee9'
  at: 2026-11-05 20:00
  text: 코드의 비밀값 리터럴 판정을 부류째 구조로 바꾼다. Python은 ast로 읽어 대입·주석 대입·속성·키워드 인자·dict 키의 우변 리터럴을 따옴표 방식(삼중, 줄 이음, 여러 줄 이어 붙임, f-string, bytes)과 상관없이 찾고, 표현식 안의 문자열 조각도 각각 가린다. 읽히지 않는 Python과 R·셸은 패턴을 쓰며 셸의 $'…'와 붙여 쓴 따옴표도 읽는다
  summary: 따옴표를 쓰는 방식을 하나씩 늘려 막던 것을 파서로 바꿔, 어떤 문자열 형식으로 쓴 비밀값도 가립니다.
- sha: '92fb2b5'
  at: 2026-11-05 20:40
  text: 셸의 따옴표 없는 비밀값이 =를 포함해도 전체를 가리고, 빈 대입 뒤의 #는 주석으로 보아 값으로 삼지 않는다
  summary: 셸 값에 = 가 있을 때 뒷부분이 남던 것과 빈 대입 뒤 주석을 깨뜨리던 것을 바로잡습니다.
- sha: '496fc4c'
  at: 2026-11-05 21:10
  text: Python 함수와 lambda의 매개변수 이름이 비밀 이름이면 기본값 리터럴도 가린다(위치·키워드 전용 모두)
  summary: def connect(token="...") 같은 매개변수 기본값의 비밀값이 가려지지 않던 틈을 닫습니다.
