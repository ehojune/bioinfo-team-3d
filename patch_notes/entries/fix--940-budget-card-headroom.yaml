- sha: d5cfba7
  at: 2026-10-24 21:09
  text: 예산 카드가 승인하는 상한에 다음 작업 예약 한 건 몫을 두고(보내기 전 예약 사용 시), 비용 모름 PI 번역 task는 자기 예약 상한만 묶는다(#940).
  summary: 예산 증액을 한 번 승인하면 곧바로 두 번째 카드가 뜨지 않게 하고, 번역 작업의 비용 모름이 큰 금액을 묶지 않게 했습니다.
- sha: f123583
  at: 2026-10-24 21:40
  text: 새 테스트 파일을 Windows 검사 inventory에 등록한다(#940).
  summary: 새 테스트를 자동 검사 목록에 등록했습니다.
- sha: 6f0b71d
  at: 2026-10-24 22:00
  text: per_task_usd가 0이면 승인 상한에 다음 작업 예약 몫을 더하지 않는다(요청 상한이 예약이 되어 올릴 때마다 커지는 경우, #940 리뷰 P2).
  summary: 작업당 상한을 끈 설정에서는 증액 승인 금액이 예전과 같게 유지됩니다.
