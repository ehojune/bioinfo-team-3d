rows:
  - sha: "a3e0305"
    at: "2026-11-09 21:53"
    summary: "문헌 단계가 읽은 논문 본문·초록이 다음 단계에도 넘어갑니다. 공개되지 않도록 결과 폴더가 아닌 작업용 폴더로 복사합니다. 공개 문헌 조회에서 redirect 응답은 조회 몫을 쓰지 않고, 최종 응답을 받은 요청만 셉니다."
    text: "step_inputs._copy_literature(받아들인 앞 단계 .tmp/literature → 이 단계 .tmp/literature, 보통 파일만, max_file·누적 상한), lookup_admission 3xx를 used에서 제외(일시 오류 상한·차단기 제외), 시험 7건 (#910)"
  - sha: "fc57a6f"
    at: "2026-11-09 22:05"
    summary: "앞 단계 문헌을 넘길 때 작업용 폴더가 다른 곳을 가리키는 링크면 복사하지 않고, 파일은 다 써진 뒤에만 보이게 합니다."
    text: "_copy_literature가 plain_directory로 대상 폴더 링크·junction을 거부하고 write_owned_bytes로 원자적 쓰기, 시험 2건 (#910)"
  - sha: "df3c6e9"
    at: "2026-11-09 22:07"
    summary: "설명서에 redirect 응답이 조회 몫을 쓰지 않는다는 것과 앞 단계 문헌이 다음 단계 작업용 폴더로 넘어간다는 것을 적었습니다."
    text: "manual 09 한영: 조회 상한 문단의 redirect 계수, 차단기 문단, #910 redirect·문헌 인계 항목 (#910)"
