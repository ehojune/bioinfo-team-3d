pr: 1306
rows:
  - sha: "2ead330"
    at: "2026-11-06 21:00"
    summary: "사이트 프로필에 접속 명령이 있으면 HPC에 한 번만 접속해 셸 하나를 열어 두고, 제출·상태·큐·취소와 runner의 상태 조회가 모두 그 셸로 돕니다. 직원 도구도 직접 접속하지 않고 runner에 요청합니다. 접속이 다시 열릴 때만 로그인으로 세고, 사람이 터널을 열어야 하는 문구는 프로필이 정합니다."
    text: "Scheduler가 site_session(공유 HpcSession)으로 _run, hpc_mcp의 status·queue·cancel을 broker /jobs/submit op로 runner에 위임, runner의 _on_scheduler_op·세션 알림·needs_login, 프로필 tunnel_texts와 session_config, NeedsHuman 5분 대기 뒤 재시도, manual 09·15 한영 (#1295)"
  - sha: "abc4759"
    at: "2026-11-06 21:40"
    summary: "HPC 오류 메시지에 접속 호스트 이름과 포트, 사용자 이름이 섞여 직원 세션에 전달되던 것을 가렸습니다. 세션과 scheduler 둘 다, 직접 ssh 경로도 같습니다."
    text: "hpc_session.redaction_words/redact(접속 명령의 호스트·포트·사용자), Scheduler._run이 결과에 redact를 붙이고 _detail·cancel이 적용, 세션 오류 문장도 적용, 시험 4건 (#1295)"
  - sha: "116253c"
    at: "2026-11-06 22:10"
    summary: "접속이 끊겨 다시 여는 동안에도 도구 호출이 먼저 포기하지 않도록 기다리는 시간을 늘렸고, 제출 출력이 너무 길어 잘려도 제출됐을 수 있다고 안내합니다."
    text: "HpcSession.worst_case_s, hpc_mcp의 broker timeout에 재접속 전체 포함, 잘린 출력은 SessionLost로 올려 MAYBE_SUBMITTED 안내, 시험 2건 (#1295)"
  - sha: "ae2ce6a"
    at: "2026-11-06 22:20"
    summary: "설정 설명서에 사이트 프로필의 접속 명령이 대화형 셸을 여는 명령이어야 한다고 적었습니다."
    text: "manual 15장 한영에 connect_argv는 터널만 여는 명령이 아니라 대화형 셸을 여는 명령이며 remote_exec가 false인 사이트도 셸이 열리면 이 경로를 쓴다고 명시 (#1295)"
  - sha: "426d235"
    at: "2026-11-06 23:00"
    summary: "제출 뒤 경고가 stderr로 나와도 작업 번호로 잘못 읽지 않고, 도구 호출이 포기한 명령은 나중에 실행되지 않으며, runner 종료가 진행 중인 HPC 명령을 기다리며 멈추지 않습니다."
    text: "세션 명령을 stderr 분리 한 줄로 보내 stdout·stderr·종료 코드를 따로 받음, queue_wait로 줄서기 60초 뒤 보내지 않고 실패(SessionBusy), broker timeout에 줄서기 포함, close는 연결을 먼저 끊고 stop은 스레드로 닫음, manual 09·15, 시험 4건 (#1295)"
  - sha: "4a1e67f"
    at: "2026-11-06 23:30"
    summary: "HPC 세션을 여는 접속 프로세스도 scheduler 명령과 같은 정제된 환경변수만 받아, runner의 API 키 같은 비밀이 원격 셸로 넘어가지 않습니다."
    text: "SessionConfig.env, site_session이 command_env()를 넘김, 가짜 gateway printenv와 시험 1건 (#1295)"
  - sha: "ff09281"
    at: "2026-11-07 00:10"
    summary: "직원 CLI가 HPC 도구 호출을 기다리는 시간에도 셸 줄서기와 재접속의 최악 시간을 넣어, CLI가 먼저 포기한 뒤 제출이 실행되는 일이 없게 했습니다. 로컬 job은 HPC 셸을 열어 두는 이유에서 뺐습니다."
    text: "labhq_mcp_timeout_s가 사이트 프로필이 있으면 QUEUE_WAIT_S와 worst_case_s를 더함(hpc_session.worst_case_s 함수화), Runner._has_open_hpc_jobs가 local_jobs.is_local을 제외, 시험 2건 (#1295)"
  - sha: "1f57e49"
    at: "2026-11-07 00:50"
    summary: "runner가 멈추는 중에 HPC에 접속하고 있었다면 그 접속도 끝내고, 멈춘 뒤에는 기다리던 제출이나 취소 명령을 보내지 않습니다."
    text: "HpcSession.shutdown(진행 중 접속 종료, 이후 run·재접속 거부), close_sessions가 shutdown 호출, 시험 1건 (#1295)"
  - sha: "d37d28a"
    at: "2026-11-07 01:30"
    summary: "접속 하나를 계속 쓰는 사이트에서는 상태 확인 간격을 늘리지 않아 완료를 더 빨리 알립니다. 상태 조회가 명령 두 개일 때의 대기 시간도 도구 시간 제한에 넣었습니다."
    text: "Scheduler.polls_cost_logins로 backoff 판단, hpc_session.call_budget_s(명령 수만큼 줄서기·실행 시간)를 hpc_mcp와 labhq_mcp_timeout_s에 적용, 시험 2건 (#1295)"
