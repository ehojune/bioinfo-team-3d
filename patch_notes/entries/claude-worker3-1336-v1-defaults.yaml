- sha: ea3f327
  at: 2026-11-09 18:52
  text: 'manual 15: 큐·노드 고정이 접속 명령 없는 프로필을 포함해 모든 제출에 붙고 다른 위치 지정은 업로드·승인 전에 거절된다고 고친다 (#1338 리뷰).'
  summary: HPC 큐·노드 고정이 이제 모든 제출에 적용된다는 설정 안내로 고쳤습니다.
