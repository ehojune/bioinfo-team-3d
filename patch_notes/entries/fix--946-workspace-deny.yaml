  text: 작업 root가 symlink·junction이면 개인 경로는 실제 root이고 작업 폴더는 별칭 표기라 쓰기 holder로 못 잡던 것을, 쓰기 폴더의 원래·절대·실제 경로를 모두 대조해 고친다(#946 리뷰 P1).
  summary: 별칭으로 연결된 작업 폴더에서도 단계가 자기 outputs에 쓸 수 있습니다.
