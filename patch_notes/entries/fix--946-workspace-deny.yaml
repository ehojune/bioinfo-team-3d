  text: 작업 root가 junction·symlink일 때 읽기 전용 inputs의 Edit/Write 거부를 별칭 표기뿐 아니라 실제 경로 표기로도 붙인다(#946 리뷰 P1).
  summary: 별칭으로 연결된 작업 폴더에서도 조상 단계 입력 복사본을 단계가 고칠 수 없게 유지합니다.
- sha: edca3c0
