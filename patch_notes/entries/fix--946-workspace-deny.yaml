  text: 선행 단계 산출을 읽기 전용으로 받는 연구 단계에서 작업 root 전체에 붙던 Claude Edit/Write 거부를 작업 폴더로 가는 길에 없는 최상위 항목에만 붙여, 단계가 자기 outputs/에 쓸 수 있게 한다(#946).
  summary: 연구 단계가 자기 작업 폴더의 outputs에 파일을 쓰지 못하던 문제를 고쳤습니다.
