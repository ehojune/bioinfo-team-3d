  at: '2026-10-22 01:30'
  summary: 계획 승인 뒤 논문 스킬을 함께 준비하고 늦으면 해당 단계에서 생략하도록 바꿨습니다.
  text: '계획 승인(CP1) 전 metadata 준비는 유지하고 승인된 DAG에서 최대 두 논문을 기존 병렬 한도 안에서 준비한다. 같은 승인 descriptor는 단계들이 공유하며 task timeout 뒤의 unavailable/paper_skill_late는 단계 입력·기존 receipt에 고정한다. 승인/hash 재검사·durable runner 취소·bounded 정리·별도 비용 예약을 보존하고 변환이 작은 task cap을 덮어쓰지 않게 했다. 기존 cap 문제 2건 red→동기 source/pure 8 PASS, Python 3.10 AST/compile 6파일 및 기존 DAG/핵심 함수 AST 동일성 확인. Async fake lifecycle은 CI용으로만 추가했으며 로컬·실제 연구/빌드는 실행하지 않았다. 기본 6시간보다 짧은 전용 대기 정책과 과거 세 번째 빌드의 원인·실제 효용은 미확인이다. #671은 닫지 않고 로컬 커밋만 준비한다.'
