rows:
- sha: b574459
  at: 2026-10-22 01:30
  summary: 계획 승인 뒤 논문 스킬을 함께 준비하고 늦으면 해당 단계에서 생략하도록 바꿨습니다.
  text: '계획 승인(CP1) 전 metadata 준비는 유지하고 승인된 DAG에서 최대 두 논문을 기존 병렬 한도 안에서 준비한다. 같은 승인 descriptor는 단계들이 공유하며 task timeout 뒤의 unavailable/paper_skill_late는 단계 입력·기존 receipt에 고정한다. 승인/hash 재검사·durable runner 취소·bounded 정리·별도 비용 예약을 보존하고 변환이 작은 task cap을 덮어쓰지 않게 했다. 기존 cap 문제 2건 red→동기 source/pure 8 PASS, Python 3.10 AST/compile 6파일 및 기존 DAG/핵심 함수 AST 동일성 확인. Async fake lifecycle은 CI용으로만 추가했으며 로컬·실제 연구/빌드는 실행하지 않았다. 기본 6시간보다 짧은 전용 대기 정책과 과거 세 번째 빌드의 원인·실제 효용은 미확인이다. #671은 닫지 않고 로컬 커밋만 준비한다.'
- sha: 90dbc0c
  at: 2026-10-22 01:36
  summary: 선택적인 논문 준비가 본 작업 몫까지 예약하지 않도록 예산을 나눴습니다.
  text: 기존 per-task 예약액과 DAG 실행 슬롯 몫을 남긴 나머지만 논문 빌드에 배정한다. 모자라면 unavailable로 고정하고 금액 상향이나 자동 재시도는 하지 않는다. 동기 순수 검사 8건에 예약·실행 몫 경계를 포함하고 CI용 fake에 두 논문 동시 준비의 충분한 기존 예산, 병렬 한도 및 부족한 예산의 생략 계약을 명시했다. 로컬 async·실제 빌드·청구 검증은 하지 않았으며 금융 정책이나 승인 gate를 넓히지 않는다.
- sha: c5b1bfc
  at: 2026-10-22 02:06
  summary: 단계가 논문 스킬을 기다리지 않고 복구된 실제 작업 ID로 정리하도록 고쳤습니다.
  text: '단계 시작 때 완료된 receipt만 snapshot하고 미완료면 unavailable/paper_skill_late로 고정한다. 뒤늦은 완료는 그 단계를 바꾸지 않으며 이후 다른 단계는 사용할 수 있다. 기존 task timeout은 별도 백그라운드 빌드 수명으로 유지한다. Gateway가 recovery await 전에 알린 durable ID로 취소·예약·비용을 연결하고 모르는 비용과 중복 합산하지 않는다. 새 동기 source/pure P1 2건은 기준 5fa1844e에서 red→green, 이전 8건은 반복하지 않았다. Python 3.10 AST/compile 8파일·핵심 14함수 및 identity callback을 뺀 gateway dispatch 본문의 동일성을 확인했다. Async fake는 CI용으로만 추가·조정했으며 실제 빌드/원격 종료/시간·금액/UI/역사적 세 번째 빌드는 미검증이다. 계획당 최대 두 편·승인/hash·호출 증거는 유지하고 #671은 닫지 않는다.'
- sha: ee8646d
  at: 2026-10-22 02:31
  summary: 논문 스킬 검사가 Windows에서도 빠짐없이 실행되도록 검사 목록을 보완했습니다.
  text: 새 검사3파일을 inventory에 등록하고 비동기 수명·복구ID의2모듈을 Windows 경계에 포함한다. 기존 validate_profile의 등록 누락 거부를 재현한 뒤 같은 정적 검사 PASS를 확인했다. Mandatory26·mixed hash·선택 코드·10분 상한은 보존했으며 새head CI 확인이 남는다.
- sha: c54e6b6
  at: 2026-10-22 02:44
  summary: 논문 스킬 검사가 올바른 계획과 승인 뒤 준비 시간을 사용하도록 고쳤습니다.
  text: '첫 CI의 waiting/recovery 17건은 필수 plan·step 필드 누락으로 동작 검증 전에 실패했다. 공유 순수 fixture로 strict ResearchPlan을 채우고, attachment 1건은 승인된 upstream 단계가 준비 시간을 제공한 뒤 실제 DAG의 변환 1회·장착·격리·bundle을 검증하도록 맞췄다. 선언 산출물과 정상 작업 몫을 포함한 승인 예산도 보존한다. 원 fixture 16/24/32 schema 오류 재현→4형태 검증·hash 일치, 새 동기 순수 2 PASS, Python 3.10 AST/compile 4파일 및 공개·기록 검사 통과. 제품 코드·validator·무대기 snapshot·Root의 CI config는 그대로이며 async 18건의 green과 실제 빌드·비용/효용·원격 종료는 새 CI/실제 증거가 필요하다. #671은 열어 둔다.'
