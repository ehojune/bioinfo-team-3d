  summary: 같은 원출처의 모든 인용 행을 검증해 추가 URI·artifact 미확인이 통과되지 않게 합니다.
  text: P1 4362739079의 URI·artifact 미확인 회귀 2건을 수정 전 재현했다. original_evidence_ids는 병합 component의 모든 확인된 원출처 행을 보존하고 source_keys·independence_groups만 중복 제거한다. 성공 대조군을 포함한 관련 pytest 307 passed, Windows inventory·public 검사 PASS. Refs #905.
- sha: 2b4bfd5
  at: '2026-10-24 03:04'
  summary: 계보 회귀 검사를 기존 evidence test 모듈에 포함해 Windows inventory를 유지합니다.
  text: 새 파일을 요구하는 Windows selection 거부를 확인하고 모든 계보 검사와 assertion을 기존 test_research_evidence.py에 옮겼다. validate_profile PASS, 관련 pytest 303 passed. workflow·inventory 정책은 변경하지 않았다. Refs #905.
- sha: d4375c9
  at: '2026-10-24 02:58'
  summary: 원문 접근 범위와 최초 실증 출처를 구분하고 순환 인용을 독립 근거에서 제외합니다.
  text: SourceRef의 optional 접근·Methods/QC·보충자료 metadata와 Evidence.lineage를 추가했다. 순수 assess_lineage가 확인된 원출처의 source identity와 group을 병합하며 순환·누락·미확인은 context로 보존한다. legacy round-trip과 관련 test 303 passed. Refs #905; report·manual 통합은 #907.
