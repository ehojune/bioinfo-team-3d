pr: 1322
rows:
- sha: 'e2a3614'
  at: 2026-11-07 06:00
  text: codex-worker1이 남긴 wiki 증거 초안(wiki_summary 접근 수준 검사, wiki 감사 기록 소비자, 합성 시험)을 인계받아 둔다. 이 초안은 엔진 결과 계약의 스키마 hash를 바꾸므로 이 PR 안에서 되돌리고 브랜치에 남긴다
  summary: 이전 담당이 남긴 wiki 증거 초안을 그대로 이어받습니다.
- sha: '9fdf6ca'
  at: 2026-11-07 08:10
  text: 요청 기록에 wiki 노출 이력(wiki_exposure)을 적는다. 새 요청은 none으로 시작하고, wiki 도구를 줄 수 있는 직원에게 task를 보내는 순간(dispatch, 전달 전) possible로 올라 내려가지 않는다. task에는 roster로 정한 허가(meta wiki_tools)를 싣고 runner는 그 허가가 있는 dispatch에만 labhq_wiki를 붙인다. 이력이 없거나 읽을 수 없으면 unknown이다. none이 아니면 단계별 GitHub 진행 게시를 막는다. 보고서·업로드·라운드 게시와 CP2는 아직 막지 않는다
  summary: 이력이 없거나 노출될 수 있던 요청의 단계별 공개 진행 게시를 막고, 도구 구성을 task에 묶습니다.
- sha: '2d34522'
  at: 2026-11-07 09:00
  text: 새 규칙에 맞춰 기존 시험의 fixture를 고친다. 진행 게시 시험의 요청은 기록된 none으로 시작하고, wiki 시험은 task에 묶인 dispatch에서만 도구가 붙는다고 확인하며 묶이지 않으면 붙지 않는 단언을 더한다. 게시 시험은 이력 없음·possible·unknown·빈 값·문자열 아님 모두 올리지 않고 recorded none은 올리는 양성 대조를 둔다
  summary: 단언을 약하게 하지 않고 새 규칙에 맞게 시험 fixture를 바로잡습니다.
- sha: '23c5906'
  at: 2026-11-07 10:10
  text: 엔진 결과 계약의 스키마 hash를 바꾸는 wiki_summary 증거 수준 초안(claims.py, report_check.py, wiki_contract.py, 시험)을 이 PR에서 되돌린다. 게이트웨이가 task의 wiki 허가를 정할 때 원시 roster가 아니라 effective roster(hosts)에서 그 runner의 항목을 읽게 하고, runner는 허가가 있을 때만 wiki_bound 인자를 넘겨 기존 호출 형태를 유지한다
  summary: CI에서 드러난 스키마 hash·roster 규칙·호출 형태 충돌을 풀어 첫 단위를 진행 게시 차단으로 좁힙니다.
- sha: '0542a94'
  at: 2026-11-07 10:50
  text: 단계별 진행 게시가 파일마다 GitHub에 쓰기 직전에 wiki 노출을 다시 확인한다. 게시 중에 dispatch가 노출을 possible로 올리면 남은 파일을 보내지 않고 진행 게시를 끈다. 확인과 전송 사이에 await가 없다. 고치기 전 코드에서 실패하는 시험을 더했다
  summary: 게시 도중 올라간 노출이 이미 시작한 업로드를 막지 못하던 경쟁을 닫습니다.
- sha: '714391d'
  at: 2026-11-07 10:55
  text: wiki 노출 참고 문서에 진행 게시 안의 경쟁을 파일마다 쓰기 직전에 다시 확인해 막는다고 적고 다른 게시 경로의 경쟁은 아직 아니라고 구분한다
  summary: 참고 문서를 방금 넣은 경쟁 차단에 맞춥니다.
