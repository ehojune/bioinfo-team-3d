pr: 1301
rows:
- sha: '5be97ae'
  at: 2026-11-06 18:20
  text: manual 08장과 11장 한영에 HPC 범용 정책을 적는다. 기본은 직원 agent와 runner가 HPC 밖(사용자 PC)이고 클러스터 안 runner는 사이트 프로필이 허용할 때만 쓰는 예외로 낮춘다. 로그인은 기관에 기록이 남으니 적게 하며 요청당·하루 상한은 처음 설정할 때 사용자가 정한다. 접속 방식·scheduler·사이트 규칙은 저장소 밖 사이트 프로필에 두고 처음 쓸 때 묻는다. 세션 관리자와 사이트 프로필은 개발 중이라 들어오지 않았다고 밝힌다
  summary: 회사 HPC에서 agent를 쓰지 못한다는 조건에 맞춰 권장 구성을 agent가 HPC 밖인 쪽으로 바꾸고 범용 정책을 문서에 남깁니다.
- sha: '18208e0'
  at: 2026-11-06 18:50
  text: manual 08장에서 처음 쓸 때 접속 방식을 묻는 것은 사이트 프로필이 들어온 뒤의 동작이고 지금 labhq init은 로그인 상한만 묻는다고 밝히고, 잡 제출 승인은 hpc_core_hours_threshold 설정을 따른다고 고쳐 적는다
  summary: 아직 없는 질문과 항상 승인한다는 단정을 문서에서 바로잡습니다.
- sha: '6007296'
  at: 2026-11-06 19:20
  text: manual 영문 8·11장의 새 링크를 영문 장으로 연결하고, 기관 접속 정보를 지금은 커밋하지 않는 config/labhq.yaml(hpc.ssh_host·hpc.user)이나 개인 skill에 두고 사이트 프로필이 들어오면 옮긴다고 적는다
  summary: 영어 독자가 한국어 장으로 가던 링크와, 지금 설정할 수 없는 것처럼 읽히던 안내를 바로잡습니다.
- sha: 'd7f6e1b'
  at: 2026-11-06 19:50
  text: manual 08·11장에서 기관이 모든 연결을 로그인으로 기록한다는 단정을 고친다. 연결·채널·세션 중 무엇을 세는지는 사이트마다 달라 확인하지 못했고 labhq는 보수적으로 연결마다 센다고 구분해 적는다
  summary: 구현 사실(연결마다 셈)과 기관의 기록 방식(미확인)을 문서에서 분리합니다.
- sha: '4340d48'
  at: 2026-11-06 20:20
  text: manual 08장에 hpc.ssh_host 구성이 PC와 로그인 노드의 runner.workspace_root 공유를 전제하고 파일 전송은 아직 없다는 조건을 적고, 11장에서 기관 접속 정보를 직원 세션이 읽을 수 있는 개인 skill에 넣지 않는다고 바로잡는다
  summary: 지금 구현의 전제 조건과 접속 정보를 둘 곳의 안전 조건을 문서에 정확히 남깁니다.
