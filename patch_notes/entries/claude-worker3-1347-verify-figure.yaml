  text: 'verify의 보고서 그림 링크 검사에서 단계의 원격 목록에 기록된 그림은 원격 보관 경고로 돌리고, 기록이 없는 그림 링크만 문제로 센다 (#1347).'
  summary: HPC에만 둔 큰 그림 때문에 검증이 실패하지 않습니다.
- sha: 'b955c5d'
  at: 2026-11-11 01:41
  text: '크기 0인 원격 그림은 계속 문제로 세고, verify 요약 줄에 원격 보관 그림 수를 따로 보인다 (#1372 리뷰).'
  summary: 빈 그림은 여전히 실패하고, 원격에 둔 그림은 요약에 따로 표시합니다.
