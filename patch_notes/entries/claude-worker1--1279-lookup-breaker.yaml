    summary: "공개 문헌 서버가 오류(5xx)나 요청 제한(429)을 연달아 돌려주면 그 서버로는 잠시 보내지 않고, 다른 출처에 조회 횟수를 씁니다."
    text: "조회 호스트별 차단기: 5xx 3회·429/5xx 5회 연속이면 300초 보내지 않음. 조회 몫 계산은 그대로 (#1279)"
