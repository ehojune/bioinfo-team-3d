- sha: 27e2f44
  at: 2026-10-24 23:11
  text: 요청 예산이 있으면 CP1 뒤 집행 상한은 요청 예산 (#944)
  summary: PI가 요청에 예산을 적었으면 CP1을 승인해도 상한이 계획 추정으로 내려가지 않고, 계획 추정은 카드에 참고로만 보입니다. 작업 예약 몇 건만으로 예산 카드가 거듭 뜨던 문제를 막습니다.
- sha: d8cadc2
  at: 2026-10-24 23:40
  text: 예산 카드로 올린 한도는 요청 예산이 아니라 정책 한도로 취급 (#944 리뷰 P1)
  summary: --budget 없이 시작해 CP1 전에 카드로 한도를 올린 요청은 계속 계획 합으로 상한을 잡고, 요청에 적은 예산만 그대로 상한이 됩니다.
