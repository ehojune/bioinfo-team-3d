pr: null
rows:
  - sha: 'b718b5e'
    at: '2026-11-25 02:57'
    summary: 보고서에서 숫자와 기호가 든 주어와 결과 링크를 남깁니다.
    text: CD4+ T 세포 같은 주어와 로컬 경로 뒤의 상대 링크를 검증했습니다.
  - sha: 'ea6ba1b'
    at: '2026-11-25 02:50'
    summary: 보고서에서 부정문과 수식의 원래 표현을 보존합니다.
    text: 경로 뒤에 조동사가 붙은 결론과 수식 안의 연속 TeX 명령을 검증했습니다.
  - sha: '07f9fe3'
    at: '2026-11-25 02:42'
    summary: 독자용 보고서에서 소문자 복합 주어와 수식 명령을 보존합니다.
    text: 경로와 결론의 경계를 보완하고 TeX 명령을 Windows 현재 드라이브 절대경로와 구분합니다.
  - sha: '04fd495'
    at: '2026-11-25 02:34'
    summary: 연구 보고서에서 작업 경로를 가리고 결론과 근거를 남깁니다.
    text: 정상 완료·재개·취소 보고서에 적용합니다. 공백이 든 경로와 Windows 현재 드라이브 절대경로를 가리고 경로 뒤 영문 결론을 보존합니다.
  - sha: '134aae0'
    at: '2026-11-25 00:58'
    summary: 강조한 HGNC 라벨과 기호를 읽고 기존 실행 기록은 조회에서 뺍니다.
    text: 식별자 조회에도 설정한 연락처를 쓰고 조회기 내부 오류는 미확인으로 기록합니다.
  - sha: '8d2a588'
    at: '2026-11-25 00:35'
    summary: 대체 좌위의 HGNC 기호도 보고서에서 검사합니다.
    text: 근거 출처와 식별자 조회에 같은 시간 한도를 적용합니다. 남은 시간이 없으면 미확인으로 기록합니다.
  - sha: 'ad2f424'
    at: '2026-11-25 00:28'
    summary: 쉼표로 나열한 HGNC 기호도 하나씩 조회합니다.
    text: 목록 뒤쪽의 미등록 기호도 보고서 검사에 기록합니다.
  - sha: 'f6a7db9'
    at: '2026-11-25 00:19'
    summary: 연구 보고서의 유전자 기호와 GO ID, DOI가 등록되어 있는지 확인합니다.
    text: 실시간 출처 확인을 켠 labhq verify에서 등록 기관이 확인한 미등록과 조회 실패를 구분하고 감사 번들에 결과를 담습니다.
