rows:
  - sha: '5eb9bbe'
    at: '2026-11-25 00:02'
    summary: 확장자가 없고 공백이 있는 로컬 폴더명도 끝까지 가립니다.
    text: 근거 표식과 구분 기호 뒤의 문장은 남깁니다.
  - sha: '0657c5f'
    at: '2026-11-24 23:54'
    summary: 보고서 링크에 들어간 PC 절대경로는 가리고 표시 문구를 남깁니다.
    text: 상대경로로 연결한 산출물은 계속 열립니다. 경로 안의 아포스트로피·쉼표·괄호도 가립니다.
  - sha: 'b387c98'
    at: '2026-11-24 23:41'
    summary: 파일명이나 폴더명에 공백이 있는 PC 경로도 한 번에 가립니다.
    text: 새 보고서에서 경로를 가린 뒤의 문장과 근거 표식을 남깁니다. 재현 묶음의 상대경로 변환은 그대로 적용합니다.
  - sha: '271c012'
    at: '2026-11-24 23:32'
    summary: 링크로 저장된 DOI도 검사하고 경로에 붙은 근거 표시를 유지합니다.
    text: 원장의 DOI URL에서 식별자를 읽습니다. 보고서의 로컬 경로만 가리고 바로 뒤의 근거 표식은 남깁니다.
  - sha: '9c44c97'
    at: '2026-11-24 23:22'
    summary: 연구 보고서에 나온 유전자 기호와 GO ID, DOI가 등록되어 있는지 확인합니다.
    text: 실시간 출처 확인을 켠 labhq verify에서 미등록과 조회 실패를 구분합니다. 독자용 보고서는 로컬 경로를 가리고 산출물 등록 경고를 한글로 표시합니다.
