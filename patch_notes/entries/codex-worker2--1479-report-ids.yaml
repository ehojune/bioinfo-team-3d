pr: null
rows:
  - sha: '52ac820'
    at: '2026-11-25 05:21'
    summary: 로컬 경로를 가리고 통계 약어와 단위를 보존합니다.
    text: 구두점이 든 디렉터리를 가리고 log2FC·TPM과 R·F·t·z의 수치를 남깁니다.
  - sha: '046d476'
    at: '2026-11-25 03:40'
    summary: 작업 경로 뒤의 통계 비교식을 보고서에 남깁니다.
    text: 완료·취소 보고서에서 위험비와 p값의 항과 비교 기호를 보존합니다.
  - sha: 'dc8e3ad'
    at: '2026-11-25 03:33'
    summary: 근거 표식이 없는 보고서에서도 작업 경로 뒤 결론을 남깁니다.
    text: 완료 보고서의 요약과 취소 보고서의 부분 결과를 검증했습니다.
  - sha: 'd227408'
    at: '2026-11-25 03:29'
    summary: 슬래시 왼쪽에만 공백을 둔 세포 비율을 보존합니다.
    text: 보고서 본문과 앞쪽 요약에서 CD4+ /CD8+를 확인했습니다.
  - sha: '670d7b1'
    at: '2026-11-25 03:23'
    summary: 보고서에서 콜론에 붙은 작업 경로를 가리고 공백이 든 비율을 보존합니다.
    text: POSIX·Windows 경로를 가리고 HTTPS·FTP URL과 CD4+ / CD8+ 표기를 남깁니다.
  - sha: '226061c'
    at: '2026-11-25 03:21'
    summary: 연구 보고서에서 작업 경로를 가리고 결론과 근거를 남깁니다.
    text: 정상 완료·재개·취소 보고서에 적용합니다. 경로 뒤 결론과 수식, 상대 링크를 보존합니다.
  - sha: '134aae0'
    at: '2026-11-25 00:58'
    summary: 강조한 HGNC 라벨과 기호를 읽고 기존 실행 기록은 조회에서 뺍니다.
    text: 식별자 조회에도 설정한 연락처를 쓰고 조회기 내부 오류는 미확인으로 기록합니다.
  - sha: '8d2a588'
    at: '2026-11-25 00:35'
    summary: 대체 좌위의 HGNC 기호도 보고서에서 검사합니다.
    text: 근거 출처와 식별자 조회에 같은 시간 한도를 적용합니다. 남은 시간이 없으면 미확인으로 기록합니다.
  - sha: 'ad2f424'
    at: '2026-11-25 00:28'
    summary: 쉼표로 나열한 HGNC 기호도 하나씩 조회합니다.
    text: 목록 뒤쪽의 미등록 기호도 보고서 검사에 기록합니다.
  - sha: 'f6a7db9'
    at: '2026-11-25 00:19'
    summary: 연구 보고서의 유전자 기호와 GO ID, DOI가 등록되어 있는지 확인합니다.
    text: 실시간 출처 확인을 켠 labhq verify에서 등록 기관이 확인한 미등록과 조회 실패를 구분하고 감사 번들에 결과를 담습니다.
