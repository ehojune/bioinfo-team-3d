    text: "편집자(비버)가 파견직 배지·연구 구역 대신 운영과 파견직 구역의 펜과 종이 소품으로 보이게 하고, 핵심 직원이 소품·구역 표에 모두 있는지 확인하는 test를 더했다(#546)."
  - sha: "a943e3d"
    at: "2026-10-15 01:20"
    text: "데모 화면을 데스크톱·폰 headless Chrome으로 열어 네 장면의 레이아웃을 JSON 기준선과 비교하는 test를 넣었다. 기준선은 scripts/update_visual_baseline.cjs로 일부러 바꾼다(#546)."
  - sha: "be638a0"
    at: "2026-10-15 01:20"
    text: "README 데모 움짤을 새 디자인으로 다시 녹화했다(960px, 약 13초). 표준 라이브러리만 쓰는 GIF 인코더와 녹화 스크립트를 함께 넣었다(#546)."
