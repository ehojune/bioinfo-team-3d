- sha: '91e7cc0'
  at: 2026-11-06 18:28
  text: manual 04장 한·영에 HPC 사이트 프로필 사용법을 적는다. init이 묻는 항목과 모르면 비워 두는 규칙, 접속 명령에 비밀번호·토큰 거부, 저장 위치(~/.labhq/sites, LABHQ_SITES_DIR)와 저장소 안 거부·기존 프로필 보존, hpc.site_profile, 프로필을 저장소에 넣지 말라는 것과 공개 검사가 막는 범위, 이미 만든 설정에서는 묻지 않는다는 한계
  summary: 사이트 프로필을 언제 어떻게 만들고 어디에 두는지 manual이 설명합니다.
- sha: '768ef09'
  at: 2026-11-06 18:41
  text: 리뷰 지적 반영. 같은 이름 프로필은 빈 상태로 덮어쓰지 않지만 바꾼 답은 그 파일에 저장된다고 바르게 적고, 프로필을 세션 관리자·labhq_hpc 도구가 아직 읽지 않는다는 것(연결은 #1295 C단계)을 한·영에 적는다
  summary: manual이 없는 보장을 말하거나 아직 없는 연결을 안내하지 않습니다.
