  text: 기존 clean-install 절차 뒤 실제 gateway와 runner를 사용한다. 두 run의 state·task·artifact identity를 분리하고 개별 receipt와 비교 JSON, 별도 stdout/stderr를 남긴다. 누락·상한 위반·산출 재사용은 실패하며 실제 과금·독립 hard-stop 집행 증거로 확대하지 않는다. Refs #923.
