  - sha: "8d1a238"
    at: "2026-11-01 01:10"
    summary: "CI에서 멈춘 시험의 이름을 미리 알리는 타이머가 시험에 붙은 timeout 표시와 환경 변수를 따르고, Windows critical 단계에서는 시험 상한이 단계 상한보다 먼저 와 멈춘 시험이 이름과 함께 실패합니다."
    text: "CI: stall 예고가 시험의 실제 상한(marker·--timeout·환경 변수·ini)을 따르고, Windows critical 단계의 시험 상한을 단계보다 짧게 둔다 (#1198)"
