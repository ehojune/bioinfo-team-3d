pr: 1109
rows:
- sha: '402d718'
  at: 2026-10-31 03:20
  text: 시험용 MiniWebSocket이 업그레이드 전에 close()하거나 연결에 실패해도 onclose를 정확히 한 번 내게 하고(요청을 destroy), 데모 정리 진단(demo cleanup:)에 node_version과 ws_kind를 더한다. 시험 4건 추가
  summary: Windows CI의 데모 정리가 websocket 닫힘을 영원히 기다리다 5초를 채우던 결함을 막고, 다음 사례에서 어느 WebSocket 구현인지 로그로 알 수 있습니다.
- sha: 'ab26dc0'
  at: 2026-10-31 04:20
  text: MiniWebSocket이 업그레이드 전 close·연결 실패의 onclose를 close() 호출 안이 아니라 요청의 close 이벤트(전송이 실제로 끝난 뒤)에서 낸다(리뷰 P2) + 시험이 그 순서를 확인
  summary: 정리가 websocket이 닫혔다고 판단하는 시점이 실제 연결 종료와 같아집니다.
- sha: '4f6d036'
  at: 2026-10-31 04:50
  text: 서버가 upgrade 대신 일반 HTTP 응답을 돌려주면 MiniWebSocket이 응답을 버리고 요청을 끝내 onerror 한 번, onclose 한 번을 내게 한다(리뷰 P2) + 시험
  summary: 업그레이드를 거절당한 연결도 실제로 끝나고 정리가 그것을 알 수 있습니다.
- sha: 'eaca28f'
  at: 2026-10-31 05:00
  text: 업그레이드 전에 끝나는 네 경로(close, 연결 실패, 일반 HTTP 거절, 잘못된 accept 키)가 모두 onerror·onclose 한 번씩임을 시험으로 고정한다
  summary: 업그레이드 전 종료 경로 전체를 시험이 지킵니다.
