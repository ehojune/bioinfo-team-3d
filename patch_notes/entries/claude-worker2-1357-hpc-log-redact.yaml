  - sha: "29903e3"
    at: "2026-11-10 07:40"
    summary: "HPC 잡 로그와 잡이 남긴 .log·.out·.err 파일을 이 PC로 가져올 때, 쓰기 전에 원격 경로·계정·사이트 이름을 가립니다. 가리기 전 원본은 클러스터에만 남고 표 같은 데이터 파일은 바꾸지 않습니다."
    text: "hpc_transfer에 Transfer.hide_log·fetch_log, fetch_results가 잡 로그와 로그 확장자 결과를 fetch_log로 받고 fetch.json에 redacted·remote_sha256 기록, manual 09 한영, 시험 4건 (#1357)"
  - sha: "f729d20"
    at: "2026-11-10 08:40"
    summary: "잡 로그 가림이 세미콜론이나 색 코드 뒤에 붙은 경로, 한 단계짜리 절대 경로까지 가립니다. 공개 URL과 작업 폴더 안 상대 경로는 그대로 읽힙니다."
    text: "hide_log가 ANSI·OSC 제어열 제거, 앞 글자 목록 대신 단어·상대 경로에 붙지 않은 모든 / 시작 토큰을 가림, URL·<workdir> 꼬리 보존, 시험 8건 (#1357 후속, PR #1361 리뷰 P1)"
