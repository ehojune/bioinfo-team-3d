rows:
- sha: 'c71461a'
  at: 2026-10-30 17:36
  text: 폴더를 선언하지 않은 단계의 hard link 검사를 선택·미보고 산출까지 수집된 모든 산출에 적용한다
  summary: 선택 산출에 hard link가 있어도 성공으로 통과해 하류가 상류 전체를 잃는 일이 없습니다.
- sha: 'dfdf942'
  at: 2026-10-30 17:25
  text: 폴더 없이 파일만 선언한 단계의 hard link도 producer가 거절하고, 선언한 outputs 루트의 재스캔을 깊이 0에서 시작한다
  summary: hard link 거절이 폴더를 선언하지 않은 단계에도 적용되고 루트 폴더가 잘못 불완전으로 판정되지 않습니다.
- sha: '2846339'
  at: 2026-10-30 17:14
  text: 하류 staging이 누적 입력 예산 부족을 이름으로 밝혀 그 상류만 거절하고 거절한 상류가 쓴 byte를 돌려주며, 선언 폴더의 hard link를 producer가 거절하고, 선언 폴더의 스캔 완전성을 그 폴더만 따로 판정한다
  summary: 여러 상류의 입력 합이 넘어도 앞 상류가 뒤 상류를 가리지 않고, hard link와 무관한 하위 폴더 때문에 단계가 실패하지 않습니다.
