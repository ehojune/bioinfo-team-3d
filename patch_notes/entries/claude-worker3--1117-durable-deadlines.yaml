  text: 취소 뒤 publication 완료와 다음 publish 대기 6곳을 다시 1초로 되돌린다. 이 대기는 취소된 publication이 event_lock을 빨리 놓는다는 동작 단언이라 네트워크 timeout(10초)보다 짧아야 한다. 시작·도착 대기 12곳은 10초로 둔다
  summary: 리뷰 P1 반영, 취소 전파 회귀를 가리지 않게 합니다.
