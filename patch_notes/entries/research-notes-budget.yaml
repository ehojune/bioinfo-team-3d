rows:
  - sha: "f33d40a"
    at: "2026-10-08 10:53"
    text: "연구 카드 메모가 다음 일을 하는 prompt로 간다(CP1 → 단계, CP2 → 리뷰·보고서, 이어 가기 → 새 계획). 계획의 숫자 budget_usd가 CP1 승인 때 요청 집행 상한이 되어 넘으면 예산 카드가 뜨고, CP1 카드에 그 상한을 보인다(PI 점검 R11 R17)."
  - sha: "3f6d449"
    at: "2026-10-08 11:11"
    text: "CP1 직후 새 집행 상한으로 지금까지 쓴 비용을 판정해 단계 없이 끝나는 요청도 예산 카드를 받는다. budget_usd true/false는 검증 오류, 단계·리뷰 prompt에 실제 집행 상한, 앞 차수 CP2 메모는 감사 부록에 차수와 함께(#499 리뷰)."
