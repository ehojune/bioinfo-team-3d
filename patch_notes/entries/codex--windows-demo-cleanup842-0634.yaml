rows:
  - sha: 95346f0
    at: "2026-10-22 06:39"
    summary: "Windows 웹 검사의 브라우저 정리가 늦을 때 무엇이 언제 끝났는지 기록을 남깁니다."
    text: "#841 Windows의 demo cleanup incomplete(Browser.close 5초 뒤 Chrome exit·stdio close 미관측, 이후 30초 상한)의 원인이 미확인이라 수정 대신 근거를 남긴다. 마감 시점에 미도착인 소유 Chrome exit·stdio close·CDP socket close를 fallback kill 전에 관측해 지연 ms를 stderr에 쓰고, focus fixture가 두 demo의 시작 단계 시각을 남긴다. 5초 실패·30초·profile 보존·closed 미표시는 그대로다."
  - sha: 21afaa2
    at: "2026-10-22 06:55"
    summary: "Windows 웹 검사가 브라우저를 정상 종료하지 못하면 같은 5초 안에서 강제로 닫고, 실제로 닫힌 것을 확인해야만 통과합니다."
    text: "총 5초 cleanup 마감을 유지하고 graceful Browser.close가 3초 안에 끝나지 않으면 소유 ChildProcess·CDP socket만 한 번 닫은 뒤 남은 시간에 실제 stdio·socket·server close가 모두 와야 완료한다. kill 반환값·killed·예외로 성공하지 않고 exit만 오는 #832 형태는 실패이며 정상 graceful의 kill은 0회다. fake·정적 계약과 실제 Chrome 강제 정리 회귀 1개를 더했다. Chrome 내부 지연 원인은 미확인이다."
  - sha: 3dd6180
    at: "2026-10-22 07:02"
    summary: "브라우저 강제 정리 검사를 시간 여유가 큰 검사 파일로 옮겨 기존 화면 검사의 시간 상한을 지킵니다."
    text: "새 실Chrome 강제 정리 회귀를 Windows 실측 6.6~12초·상한 30초인 focus layout 파일에서 driver 실Chrome 검사가 이미 있는 web_visual_tooling.cjs(실측 3.3~5.6초·상한 170초)로 옮겼다. focus 파일은 두 demo와 기능 단언 그대로이고 5초 cleanup·3초 graceful·상한·Windows 선택은 바뀌지 않았다."
  - sha: 06a8a22
    at: "2026-10-22 07:20"
    summary: "Windows 자동 검사에서 브라우저 정리 검사가 몰래 건너뛰어진 채 통과하지 않게 합니다."
    text: "hosted Windows(os.name nt, GITHUB_ACTIONS true)에서 web_office_focus_layout.cjs와 web_visual_tooling.cjs만 TAP '# skipped 0'을 추가로 요구해 내부 skip이 부모 PASS로 숨지 않게 했다. 기존 returncode·fail 0·기능 단언·node id·상한과 Linux·로컬의 선택적 Chrome은 그대로이고 test_web_3d.py의 Windows mixed digest만 갱신했다."
  - sha: c7a18c6
    at: "2026-10-22 07:30"
    summary: "브라우저를 띄우기 전에 실패한 검사 정리가 쓸데없는 대기 timer 때문에 다른 오류로 바뀌지 않게 합니다."
    text: "PR843 첫 CI의 3플랫폼 공통 실패(web_visual_tooling startup fake 5·6·7이 원래 오류 대신 demo startup and cleanup failed)는 Chrome이 없는 부분 시작에서도 3초 강제 단계 timer를 만들어 5초 deadline만 허용하는 sandbox 계약을 깬 회귀였다. 소유 Chrome을 획득했을 때만 그 timer를 만든다. 5초·3초·실제 close 판정은 그대로다."
  - sha: 1193f98
    at: "2026-10-22 07:44"
    summary: "Windows 웹 검사가 띄운 브라우저와 그 하위 프로세스를 한 묶음으로 관리해, 검사가 끝나면 함께 정리되게 합니다."
    text: "Windows에서만 demo Chrome을 제품의 labhq/runner/memory_limit.py --windows-job(KILL_ON_CLOSE Job) wrapper 아래에서 띄운다. 소유 child는 wrapper이고 forced 정리는 그 wrapper만 끝내 Job close로 Chrome과 하위를 정리한다. interpreter는 test_web_3d.py가 넘긴 LABHQ_TEST_PYTHON(sys.executable)만 쓰고 PATH나 Store alias로 대체하지 않는다. 실제 exit·stdio close·socket·server·profile 정리, 정상 kill 0, 5/30/170초, 필수 26, Linux 경로는 그대로다."
  - sha: c8751ad
    at: "2026-10-22 07:45"
    summary: "서버 감독 프로세스 시작 검사가 실패하면 원인을 볼 수 있는 로그 끝부분을 함께 남깁니다."
    text: "test_a_real_gateway_runs_as_its_supervisors_child_and_down_ends_both의 시작이 실패하면 이 test 자신의 supervisor 로그와 진단 기록 마지막 16KiB를 token을 가리고 제어문자를 바꿔 출력한 뒤 원래 예외를 그대로 다시 던진다. 90초 health와 정리는 그대로이며 process 없는 순수 검사를 더했다."
  - sha: 87146f4
    at: "2026-10-22 07:54"
    summary: "Windows 웹 검사에서 브라우저 오류 출력이 검사 도구까지 그대로 전달되게 합니다."
    text: "제품 Windows Job wrapper는 child를 표준 handle 없이 시작해 Chrome stderr가 Node driver에 오지 않고 stdio close가 wrapper 종료만 뜻했다. 제품 코드는 그대로 두고 test 전용 stdlib adapter가 제품 _WindowsJob을 재사용하며 child에 자기 stdin/stdout/stderr만 명시해 넘긴다. 인자 검사·오류 줄·종료 코드·KILL_ON_CLOSE·메모리 상한·비상속 Job handle과 Job 준비 실패 시 child 미생성은 같다."
