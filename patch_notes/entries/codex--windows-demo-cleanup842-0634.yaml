rows:
  - sha: 95346f0
    at: "2026-10-22 06:39"
    summary: "Windows 웹 검사의 브라우저 정리가 늦을 때 무엇이 언제 끝났는지 기록을 남깁니다."
    text: "#841 Windows의 demo cleanup incomplete(Browser.close 5초 뒤 Chrome exit·stdio close 미관측, 이후 30초 상한)의 원인이 미확인이라 수정 대신 근거를 남긴다. 마감 시점에 미도착인 소유 Chrome exit·stdio close·CDP socket close를 fallback kill 전에 관측해 지연 ms를 stderr에 쓰고, focus fixture가 두 demo의 시작 단계 시각을 남긴다. 5초 실패·30초·profile 보존·closed 미표시는 그대로다."
  - sha: 21afaa2
    at: "2026-10-22 06:55"
    summary: "Windows 웹 검사가 브라우저를 정상 종료하지 못하면 같은 5초 안에서 강제로 닫고, 실제로 닫힌 것을 확인해야만 통과합니다."
    text: "총 5초 cleanup 마감을 유지하고 graceful Browser.close가 3초 안에 끝나지 않으면 소유 ChildProcess·CDP socket만 한 번 닫은 뒤 남은 시간에 실제 stdio·socket·server close가 모두 와야 완료한다. kill 반환값·killed·예외로 성공하지 않고 exit만 오는 #832 형태는 실패이며 정상 graceful의 kill은 0회다. fake·정적 계약과 실제 Chrome 강제 정리 회귀 1개를 더했다. Chrome 내부 지연 원인은 미확인이다."
  - sha: 3dd6180
    at: "2026-10-22 07:02"
    summary: "브라우저 강제 정리 검사를 시간 여유가 큰 검사 파일로 옮겨 기존 화면 검사의 시간 상한을 지킵니다."
    text: "새 실Chrome 강제 정리 회귀를 Windows 실측 6.6~12초·상한 30초인 focus layout 파일에서 driver 실Chrome 검사가 이미 있는 web_visual_tooling.cjs(실측 3.3~5.6초·상한 170초)로 옮겼다. focus 파일은 두 demo와 기능 단언 그대로이고 5초 cleanup·3초 graceful·상한·Windows 선택은 바뀌지 않았다."
  - sha: 06a8a22
    at: "2026-10-22 07:20"
    summary: "Windows 자동 검사에서 브라우저 정리 검사가 몰래 건너뛰어진 채 통과하지 않게 합니다."
    text: "hosted Windows(os.name nt, GITHUB_ACTIONS true)에서 web_office_focus_layout.cjs와 web_visual_tooling.cjs만 TAP '# skipped 0'을 추가로 요구해 내부 skip이 부모 PASS로 숨지 않게 했다. 기존 returncode·fail 0·기능 단언·node id·상한과 Linux·로컬의 선택적 Chrome은 그대로이고 test_web_3d.py의 Windows mixed digest만 갱신했다."
