    text: "예산 카드 요약에 승인하면 올라갈 상한과 거절 결과를 적고, 웹은 금액을 $0.00으로 한국어 이름과 함께 보인다. 직원 실행 환경에 PYTHONDONTWRITEBYTECODE=1을 넣어 __pycache__ 삭제 권한 카드가 뜨지 않게 한다."
