rows:
- sha: 13ac0f9
  at: '2026-10-21 14:09'
  summary: Windows 시작 진단에서 입력 읽기 완료와 JSON 변환 완료를 구분합니다.
  text: 'ReadToEnd 뒤 input_read를 추가하고 input_accepted는 JSON 변환 뒤 유지한다. 고정 5단계와 결과 포함 6frame parser·fixture allowlist를 맞췄으며 8192bytes·기존 timing/timeout·PID/code·nonce/envhash/Job/ACK/정리 계약은 유지했다. 수정 전 4건 실패 후 명시한 fake/string 34건·3.10 AST 3파일·진단 외 source/native assertions 대조·public/diff/기록 검사 통과. 새 lookup reference 1060자·status 884자. 실제 WMI 원인 수정/성공 증거는 아니며 native CI와 C3 통합 검증은 미확인, 로컬 커밋만 준비했다.'
- sha: 423befe
  at: '2026-10-21 15:22'
  summary: Windows 시작 입력을 길이로 구분해 EOF 대기 의존성을 줄이는 대안을 준비했습니다.
  text: '4-byte little-endian 길이와 ensure_ascii UTF-8 JSON을 익명 stdin으로만 전송한다. 입력 예산1 MiB는 출력8192bytes와 별개이며 초과는 request_too_large로 거부한다. Raw stream의 정확한 header/payload 읽기·strict UTF-8/JSON/구조 검사와 고정7단계 진단을 추가했다. 수정 전3건 실패 후 wire/model20·관련 fake50건 PASS; 최종 stress/source/call 계약 재확인, 3.10 AST5파일·보안/정리/native assertions 동일 대조·public/diff/기록 검사 통과. Reference1060→1484자. 원인 수정이나 native 성공의 증거는 아니며 Popen 수명주기·timeout10/TIMEOUT20·단일시도·nonce/envhash/identity/Job/ACK/정리는 유지했다. 로컬 커밋만 준비.'
