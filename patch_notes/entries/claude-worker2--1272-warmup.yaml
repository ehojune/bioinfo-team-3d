- sha: 'e5bfc73'
  at: 2026-11-07 00:46
  text: Windows CI의 직렬 단계 앞에 Node와 PowerShell을 두 번씩 불러 첫(cold)·둘째(warm) 시작 시간을 로그 한 줄(ci warmup)로 남기는 단계를 더한다. 새 runner에서 각 프로그램의 첫 프로세스만 비싸다는 가설(#1272, #1076 H1)을 검증하고, 그 비용을 시험 밖으로 옮긴다. 시간 한계·시험·재시도는 그대로다
  summary: 새 runner의 차가운 첫 프로세스 비용을 시험 앞 단계에서 치르고 시간을 재서, 간헐 실패가 여기서 오는지 확인합니다.
