  text: 실행 중 취소돼 결과가 비었어도 단계·단독 task가 보내졌던 요청은 묶음을 시도한다.
  summary: 실행 중 취소돼 결과가 없어도 실제 작업이 보내진 요청은 결과 묶음을 만들려 시도합니다.
