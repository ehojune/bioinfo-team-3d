  text: 단계를 하나도 돌리지 않고 끝난 요청(CP1 수정 요청, 작업 전 거절·취소)은 요청 묶음 경고를 남기지 않는다.
  summary: 실제 단계를 돌리기 전에 거절·취소된 요청에는 결과 묶음 누락 경고를 내지 않습니다.
- sha: 74b8b40
