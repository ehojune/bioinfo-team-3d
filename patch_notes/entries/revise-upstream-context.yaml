  text: 일반 보고서는 heading 앞의 답을 지우지 않도록 군말 떼기를 빼고 프롬프트 지시만 남긴다.
  summary: 일반 보고서에서 제목 앞에 쓴 실제 답변이 지워지지 않게 했습니다.
