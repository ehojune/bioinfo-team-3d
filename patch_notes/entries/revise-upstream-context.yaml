  text: 리뷰 수정 라운드에서 다시 계산된 위 단계 결과를 지적받은 아래 단계에도 넘기고, 수정 답은 전체 결과로 받으며, 일반 보고서 앞 군말을 뗀다.
  summary: 앞 단계 수정 결과를 뒤 단계에 전달하고 수정 답변도 전체 결과로 받습니다.
- sha: 4a91448
