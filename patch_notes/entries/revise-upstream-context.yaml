  text: 일반 보고서는 '---'로 닫힌 서두만 떼고 첫 heading 앞의 짧은 답은 남긴다.
  summary: 보고서의 짧은 첫 답변을 남기고 구분선으로 끝난 서두만 덜어냅니다.
- sha: 07b9964
  at: 2026-10-04 02:09
  text: 라운드 중 재시작 뒤에도 이어 가는 수정 단계가 현재 upstream 결과를 받는다.
  summary: 수정 작업 중 재시작해도 앞 단계의 최신 결과를 받아 이어갑니다.
- sha: b7c803b
