rows:
  - sha: "1c05217"
    at: "2026-11-12 12:08"
    summary: "보이지 않는 표 초안은 보고서 검사에서 제외합니다."
    text: "HTML 주석 안의 표 데이터 행은 claim 표식 누락으로 취급하지 않는다."
  - sha: "c5d0c54"
    at: "2026-11-12 12:02"
    summary: "표시된 주장과 정확히 일치하는 리뷰 지적을 먼저 보여 줍니다."
    text: "같은 단계의 다른 지적이 앞에 있어도 정확한 claim 일치를 우선한다."
  - sha: "db7aaba"
    at: "2026-11-12 11:52"
    summary: "기각하지 못한 판정도 결과 요약에서 찾을 수 있습니다."
    text: "기각 불가·실패·판정 표현을 인식하고 기각 여부만 검토한 문장은 제외한다."
  - sha: "801bc45"
    at: "2026-11-12 11:30"
    summary: "보고서의 답과 검토가 필요한 옛 주장을 더 분명히 구분합니다."
    text: "판정 없는 요약을 답으로 쓰지 않고 리뷰 지적과 표 행·결론 후보의 근거 표식 누락을 알린다."
