rows:
  - sha: "db7aaba"
    at: "2026-11-12 11:52"
    summary: "기각하지 못한 판정도 결과 요약에서 찾을 수 있습니다."
    text: "기각 불가·실패·판정 표현을 인식하고 기각 여부만 검토한 문장은 제외한다."
  - sha: "801bc45"
    at: "2026-11-12 11:30"
    summary: "보고서의 답과 검토가 필요한 옛 주장을 더 분명히 구분합니다."
    text: "판정 없는 요약을 답으로 쓰지 않고 리뷰 지적과 표 행·결론 후보의 근거 표식 누락을 알린다."
