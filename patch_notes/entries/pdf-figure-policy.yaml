  text: 보고서 PDF의 그림은 크기 제한 없이 요청 묶음의 원본을 쓰고(정리본 PDF도 같음), PDF는 50 MB(github.edition_pdf_max_mb,
    최대 75) 안으로 그림을 빼지 않고 해상도를 단계적으로 줄여 맞춘다. 그림은 11장까지이고 한 장은 graphical abstract이며,
    보고서에 없으면 labhq가 계획·입력 출처·결론으로 흐름도를 그려 PDF와 정리본의 첫 그림으로 넣는다(#608).
