- sha: 0537a3c
  at: 2026-10-23 07:21
  summary: 채용과 논문 스킬을 쓰지 않는 사무실은 기능을 명시적으로 끄고 준비·실행 경로도 차단합니다.
  text: 'recruit.enabled는 strict boolean이며 기본 true다. false면 직접 채용·Paper2Agent 설치·계획/지연 준비·복구 task·논문 스킬 부착과 계약 활성화·연장·재고용을 거부하고 해제는 허용한다. doctor는 꺼진 Paper2Agent만 skip하며 --fix도 설치하지 않는다. 기본 recruiter 누락과 다른 인증·runtime 검사는 유지하고 이미 발생한 변환 비용은 보존한다. 실제 함수를 추출한 fake/static 14건과 기존 정적 9건만 로컬 검증했으며 실제 runtime·모델 실행은 미확인이다. #869.'
- sha: c814c78
  at: 2026-10-23 07:39
  summary: 새 기능 중지 검사도 Windows의 기본 검사에 포함합니다.
  text: 'test_recruit_disabled_static.py를 windows-boundary-v6의 known_tests와 전용 boundary cohort에 등록했다. 14건은 설정의 엄격한 타입, 준비·복구·부착 전 거부와 비용 보존을 검사하므로 변경이 없어도 기본 Windows 검사에 남긴다. validate_profile과 14node 정적 선택을 확인했다. 제품 코드·기존 mixed digest·timeout·skip은 그대로이며 검사 범위를 일괄 확대하지 않았다. 첫 CI는 pytest 시작 전 미등록 inventory를 거부하고 종료됐다.'
