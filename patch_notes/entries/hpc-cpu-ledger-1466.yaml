    summary: Slurm이 제출을 명시적으로 거절하면 예약한 CPU를 반환합니다.
    text: 접수 불명 응답의 예약은 유지하고 큐에서 빠진 시작·노드 구성 실패 잡의 예약을 해제한다.
  - sha: 'd93594d'
