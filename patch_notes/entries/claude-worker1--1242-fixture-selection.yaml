    summary: "시험용 보조 파일만 바뀐 변경도, 그 파일을 쓰는 Windows 시험이 자동 검사에 포함됩니다."
    text: "Windows 시험 선택: 바뀐 fixture를 이름으로 적은 시험을 고르고, 아무도 안 적었으면 routine 전체를 고른다 (#1242)"
  - sha: "ba376a0"
    at: "2026-11-01 21:00"
    summary: "시험용 보조 파일을 폴더째 가져다 쓰는 시험도 그 파일이 바뀌면 자동 검사에 포함되고, 어디에나 있는 파일 이름 때문에 상관없는 시험이 끌려오지 않습니다."
    text: "Windows 시험 선택: 흔한 파일 이름은 경로로만 맞추고 폴더째 쓰는 시험을 폴더 이름으로 잡는다 (#1245 리뷰 P2)"
  - sha: "338aa5f"
    at: "2026-11-01 22:00"
    summary: "시험용 보조 파일을 많이 바꾼 변경에서도 자동 검사가 어떤 시험을 돌릴지 고르는 데 시간이 오래 걸리지 않습니다."
    text: "Windows 시험 선택: 바뀐 fixture 수만큼 쓰는 무제한 cache로 시험 수만큼 다시 훑지 않는다 (#1245 리뷰 P2)"
  - sha: "d3f8f13"
