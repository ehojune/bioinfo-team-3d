    summary: "시험용 보조 파일이 바뀌어도 이름이 흔한 단어와 같다는 이유로 상관없는 시험이 수십 개씩 검사에 끌려오지 않습니다."
    text: "Windows 시험 선택: 데이터 fixture는 이름 전체나 경로로만 맞추고 모듈 이름은 .py에만 쓴다 (#1245 리뷰 P2)"
  - sha: "8e60b3d"
