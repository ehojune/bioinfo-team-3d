pr: 1133
rows:
  - sha: "52d1683"
    at: "2026-10-31 05:54"
    summary: "Windows CI가 첫 브라우저 시험 전에 Chrome을 한 번 띄워 처음 시작하는 데 드는 시간을 따로 재고 보여 줍니다. 시험의 30초 시작 상한은 그대로입니다."
    text: "ci: Windows job가 브라우저 시험 전에 Chrome을 한 번 띄워 cold start를 별도 step에서 잰다 (#1107)"
  - sha: "ba29d5a"
    at: "2026-10-31 06:20"
    summary: "첫 Chrome이 60초 안에 시작하는지는 예열 단계가 확인하고, 브라우저 시험은 데워진 Chrome의 30초 시작을 확인하도록 정책 문서와 상한을 맞췄습니다."
    text: "ci: cold start 검증을 예열 step(상한 60초)으로 옮기고 정책 문서를 고친다 (#1107)"
  - sha: "58b75b2"
    at: "2026-10-31 06:31"
    summary: "예열 단계는 첫 페이지가 60초 상한을 넘겨 나타나면 통과시키지 않고 실패로 끝냅니다."
    text: "ci: 예열 상한(60초) 뒤에 나타난 page target은 통과시키지 않는다 (#1107)"
  - sha: "1ac47b9"
    at: "2026-10-31 06:42"
    summary: "예열 단계가 Chrome 프로세스를 만드는 데 걸린 시간도 첫 시작 시간에 포함합니다."
    text: "ci: 예열의 cold start 시간을 프로세스 생성 전부터 잰다 (#1107)"
