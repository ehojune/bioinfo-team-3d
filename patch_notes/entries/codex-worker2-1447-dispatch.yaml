rows:
- sha: '5f1062a'
  at: 2026-11-25 12:53
  summary: HPC에 보낼 참고 파일의 한도를 선택된 runner에 맞춰 표시합니다.
  text: 계획 승인과 재개 카드 모두 runner의 사이트별 업로드 한도를 쓴다. 한도를 보고받지 못하면 기본값을 참고로 표시한다.
- sha: '9d7e882'
  at: 2026-11-25 11:54
  summary: 혼합 실행의 초안을 PC에서 쓸 수 있는지 계획 승인 전에 확인합니다.
  text: 초안 작성 단계를 HPC 생산 단계와 같은 runner의 PC로 배정하도록 교정한다. 조건에 어긋난 저장 계획은 재개 카드에서 함께 승인하지 않는다.
- sha: '74afcab'
  at: 2026-11-25 11:46
  summary: 혼합 실행의 보고서 초안과 감사 수정에서도 HPC 수신 기록을 확인합니다.
  text: CP1에서 승인한 PC 분석 runner에 작업을 배정한다. HPC 생산 단계의 revision과 수신 체크섬이 맞아야 복사한다.
- sha: '76bc1ef'
  at: 2026-11-25 11:36
  summary: 혼합 실행 브랜치를 최신 연구 검토 코드에 맞췄습니다.
  text: 이어가기의 단계별 입력 확인과 PC 부분 결과의 HPC 수신 검사를 유지하고, CP2에 최신 감사 상세를 표시한다.
- sha: '094fe4b'
  at: 2026-11-22 01:01
  summary: HPC에 보낼 참고 파일이 기본 전송 한도를 넘으면 계획 승인 전에 알려 줍니다.
  text: CP1과 CP1을 겸하는 재개 카드에 파일 크기와 초과량을 표시하고, 분할 전송이나 HPC에서 직접 받는 방법을 안내한다.
- sha: 'e08fd2a'
  at: 2026-11-21 07:32
  summary: PC에서만 읽는 파일이 바뀌어도 입력과 산출을 확인한 HPC 단계는 이어서 쓸 수 있습니다.
  text: continuation에서 HPC 단계와 PC 단계의 입력 증명을 각각 대조한다. 근거가 빠지거나 확인할 수 없는 입력은 재사용을 보류한다.
- sha: '094a4ef'
  at: 2026-11-21 07:25
  summary: 혼합 실행 중에도 승인된 작업 폴더 정리와 PC 단계의 부분 결과 저장을 이어갑니다.
  text: 혼합 단계의 facilities_fix를 허용하고 PC wrap_up에 동일한 HPC 수신 증명 검사를 적용한다.
- sha: 'b47dcbe'
  at: 2026-11-21 07:16
  summary: 연구 계획에서 무거운 단계는 HPC로 보내고 그 결과를 이 PC의 다음 단계로 넘길 수 있습니다.
  text: CP1에서 승인한 버전 1 계획에 따라 단계를 배분한다. PC 단계만 참고 폴더를 열고 HPC 산출은 같은 runner에서 수신 기록과 체크섬을 확인한 뒤 복사한다.
