  at: 2026-11-22 01:01
  summary: HPC에 보낼 참고 파일이 기본 전송 한도를 넘으면 계획 승인 전에 알려 줍니다.
  text: CP1과 CP1을 겸하는 재개 카드에 파일 크기와 초과량을 표시하고, 분할 전송이나 HPC에서 직접 받는 방법을 안내한다.
- sha: 'e08fd2a'
  at: 2026-11-21 07:32
  summary: PC에서만 읽는 파일이 바뀌어도 입력과 산출을 확인한 HPC 단계는 이어서 쓸 수 있습니다.
  text: continuation에서 HPC 단계와 PC 단계의 입력 증명을 각각 대조한다. 근거가 빠지거나 확인할 수 없는 입력은 재사용을 보류한다.
- sha: '094a4ef'
  at: 2026-11-21 07:25
  summary: 혼합 실행 중에도 승인된 작업 폴더 정리와 PC 단계의 부분 결과 저장을 이어갑니다.
  text: 혼합 단계의 facilities_fix를 허용하고 PC wrap_up에 동일한 HPC 수신 증명 검사를 적용한다.
- sha: 'b47dcbe'
  at: 2026-11-21 07:16
  summary: 연구 계획에서 무거운 단계는 HPC로 보내고 그 결과를 이 PC의 다음 단계로 넘길 수 있습니다.
  text: CP1에서 승인한 버전 1 계획에 따라 단계를 배분한다. PC 단계만 참고 폴더를 열고 HPC 산출은 같은 runner에서 수신 기록과 체크섬을 확인한 뒤 복사한다.
