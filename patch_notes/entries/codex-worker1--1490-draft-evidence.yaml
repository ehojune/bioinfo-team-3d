    summary: 후속 초안에 주장 표식과 근거 위치를 함께 전달합니다.
    text: 긴 원장의 일부가 잘려도 초안 작성자가 제시된 표식의 파일과 위치를 찾도록 한 줄로 묶었다.
  - sha: '0ccf362'
    at: '2026-11-25 10:29'
    summary: 분석 보고서의 수치와 결론을 수집한 근거 파일에 연결합니다.
    text: 간소화 연구 계획에 요약 파일과 주장 ID를 선언하고, 분석 원장에 값이 있는 위치를 적어 초안 문장과 표 행에 연결하도록 안내한다. 후속 초안에는 인용 가능한 원장 표식을 제공한다.
