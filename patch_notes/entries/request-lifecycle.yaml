pr: 502
rows:
- sha: 65d0927
  at: 2026-10-08 09:56
  text: 결정 카드(확인 질문·예산·범위·CP1·CP2·이어 가기·재개)가 1시간에 요청을 끝내지 않고 7일(policy.approvals.pi_decision_timeout_s) 동안 waiting_pi로 기다리며, 기한을 넘기면 거절이 아닌 *_timed_out으로 끝난다(PI 점검 R5).
  summary: 책임자 결정을 일주일간 기다리고 기한이 지나면 거절과 구분해 시간 초과로 끝냅니다.
- sha: cf15502
  at: 2026-10-08 09:56
  text: 요청 취소를 넣었다. POST /api/requests/{id}/cancel과 labhq cancel이 도는 task·한도/로그인 대기·카드를 정리하고 cancelled와 부분 결과 보고서를 남긴다(PI 점검 R13).
  summary: 실행·로그인·한도 대기를 정리하는 요청 취소 기능과 부분 결과 보고서를 더했습니다.
- sha: 0a22498
  at: 2026-10-08 09:56
  text: 러너가 없을 때 새 요청이 바로 실패하지 않고 waiting_for_runner로 기다렸다가 러너가 붙으면 진행하며, 24시간을 넘기면 한국어 이유로 끝난다. /api/health에 runner_online(PI 점검 R15).
  summary: 실행기가 없으면 바로 실패하지 않고 연결을 기다리며 너무 오래 기다리면 이유를 알립니다.
- sha: fc3b306
  at: 2026-10-08 09:56
  text: 러너가 다시 시작되거나 직원이 다른 러너로 옮기면 이전 프로세스의 도구 권한 카드를 러너 등록 때 닫고, 재개 카드에 요청 문장·접수 시각·남은 단계를 적는다(PI 점검 R2).
  summary: 실행기가 바뀌면 오래된 권한 화면을 닫고 재개 화면에 요청과 남은 단계를 적습니다.
- sha: 3ceeffb
  at: 2026-10-08 09:56
  text: gateway가 재시작·재개로 요청 상태를 바꾸면 request.status event를 내고, snapshot에 quota 최대 기한을 넣어 열린 웹이 새로고침 없이 안다(#494 후속).
  summary: 서버 재시작·재개로 바뀐 상태와 한도 기한을 새로고침 없이 웹에 전달합니다.
- sha: 80304bd
  at: 2026-10-08 09:56
  text: CP1 거절 종료 문구를 한국어로 바꾸고 거절 메모를 "PI 메모"로 붙인다.
  summary: 계획 거절 종료 안내를 한국어로 바꾸고 거절 때 남긴 책임자 메모를 함께 보여 줍니다.
- sha: 52161dc
  at: 2026-10-08 09:57
  text: 웹에 러너 꺼짐 띠·요청 취소 버튼·PI 결정 대기 상태를 넣고, 2시간이 넘는 카드 대기·남은 시간은 시간·일로 적는다(PI 점검 R5 R13 R15).
  summary: 웹에 실행기 꺼짐과 취소 버튼·결정 대기를 표시하고 긴 대기 시간을 읽기 쉽게 보입니다.
- sha: 20a0296
  at: 2026-10-08 09:57
  text: '리뷰 반영: 러너를 기다린 뒤 계획이 roster를 읽고, 취소가 병렬 단계·늦게 온 카드·비용(보고 없는 turn은 미집계)까지 정리한다.'
  summary: 실행기 연결 후 계획이 명단을 읽고 취소 시 병렬 작업·늦은 승인 화면·비용을 정리합니다.
- sha: 669ef03
  at: 2026-10-08 09:57
  text: '#493 병합 뒤 러너 안내를 labhq up으로 맞추고 영문 README에 같은 안내를 넣었다.'
  summary: 실행기를 켜는 명령 안내를 한영 소개 문서에서 같게 맞췄습니다.
- sha: 78b8ec7
  at: 2026-10-08 10:30
  text: 'main 병합(#498 #503): manual 연구 절 충돌을 풀어 단순 작업 판정 문장과 이어 가기 카드 7일 기한을 함께 남겼다.'
  summary: 단순 작업 판정과 이어 가기 선택 기한 설명을 모두 살려 매뉴얼 충돌을 풀었습니다.
- sha: 506830b
  at: 2026-10-08 10:32
  text: direct 요청은 연결된 runner·저장된 roster·agents_dir에 있는 직원이면 받아서 러너를 기다리고(없는 이름만 404), 재개 카드도 웹에 남은 시간을 보인다(#502 리뷰).
  summary: 알려진 직원의 직접 요청은 실행기 연결을 기다리고 재개 선택의 남은 시간을 보여 줍니다.
- sha: d66947f
  at: 2026-10-08 10:43
  text: 'main 병합(#504): manual 연구 절을 나눈 판을 두고 이어 가기 카드 7일 기한 문장만 반영했다.'
  summary: 나눈 연구 매뉴얼 구조를 유지하고 이어 가기 화면의 선택 기한을 반영했습니다.
