- sha: '98510b9'
  at: 2026-11-06 23:30
  text: manual 08·11장 한영을 #1306 병합 상태에 맞춘다. 사이트 프로필에 접속 명령이 있으면 runner와 labhq_hpc 도구가 셸 하나로 제출·상태·큐·취소와 상태 조회를 처리하고, 프로필이 없으면 ssh_host로 명령마다 ssh를 열며, 읽을 수 없는 프로필은 ssh_host로 돌아가지 않고 실패한다고 적는다. scheduler와 세션의 오류 메시지에서 호스트·포트·사용자 이름이 가려진다고 고치고, 세션으로 파일 올리기·회수는 #1308에서 진행 중이라고 구분한다
  summary: 연결 전이라고 적었던 문서를 병합된 동작에 맞추고, 후속이라고 적었던 호스트 이름 가림을 사실로 고칩니다.
