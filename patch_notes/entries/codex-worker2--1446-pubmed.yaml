pr: 1451
rows:
  - sha: "5f9b0ca"
    at: "2026-11-17 15:40"
    summary: "PubMed 수집 상한을 보수적으로 9,999건에 맞춥니다."
    text: "최대 인자·직원 안내·한영 매뉴얼을 맞춘다. 정확한 9,999건 완료, 초과 건수의 부분 상태와 최대 두 검색의 19,998건 전달을 포함한 회귀 215 passed, 3 skipped; 실제 API 검색은 미검증 (#1446)."
  - sha: "d2104ac"
    at: "2026-11-17 15:32"
    summary: "PubMed 결과 파일의 교체를 inode 재사용 때도 확인합니다."
    text: "Linux CI의 교체 거부 실패 뒤 파일 신원에 ctime을 포함하고 append 후 값을 보존한다. assertion 유지, 배포 venv 관련 회귀 213 passed, 3 skipped (#1446)."
  - sha: "b5d01d5"
    at: "2026-11-17 15:22"
    summary: "반복 문헌 검색도 단계 전체 파일 한도 안에서 보존합니다."
    text: "기존 산출·manifest·로그를 포함한 200파일 예산을 공유한다. file_limit은 부분 manifest를 남기고 새 슬롯이 없으면 HTTP 전에 거절한다. 보존 파일 전부의 전달·SHA를 포함한 회귀 213 passed, 3 skipped (#1446)."
  - sha: "a3c6e27"
    at: "2026-11-17 15:13"
    summary: "다른 문헌 도구의 정상적인 없음 결과를 보존합니다."
    text: "HTTP 오류 receipt override를 PubMed에 한정한다. Crossref의 found=false·404 ok와 PubMed 오류 failed를 실제 ledger에서 구분한 회귀 212 passed, 3 skipped (#1446)."
  - sha: "9bee4e7"
    at: "2026-11-17 15:08"
    summary: "문헌 서버의 HTTP 오류도 실패 기록으로 남깁니다."
    text: "부분 manifest를 반환한 HTTP 400 receipt도 failed로 마감하고 앞선 정상 응답은 유지한다. 관련 회귀 211 passed, 3 skipped (#1446)."
  - sha: "4790ce7"
    at: "2026-11-17 15:02"
    summary: "문헌 조회 시간 초과 전에 받은 성공 응답은 그대로 남깁니다."
    text: "부분 저장 뒤 공유 timeout이 나도 응답 없는 send만 timeout으로 마감한다. 첫 요청·두 번째 페이지 대기와 앞선 ok receipt 보존을 포함한 회귀 211 passed, 3 skipped (#1446)."
  - sha: "aa87662"
    at: "2026-11-17 14:56"
    summary: "부분 문헌 결과의 시간 초과 기록을 일치시킵니다."
    text: "공유 deadline 뒤에도 부분 manifest를 반환하며 admission·lookup 상태 모두 timeout을 보존한다. 응답 대기와 실제 ledger를 포함한 회귀 210 passed, 3 skipped (#1446)."
  - sha: "cf45e91"
    at: "2026-11-17 14:49"
    summary: "부분 문헌 조회의 실패도 품질 기록에 남깁니다."
    text: "부분 manifest를 유지하면서 공유 lookup에 실패를 기록한다. 명시한 건수·용량 상한과 HTTP·transport·admission·응답 오류를 구분한 회귀 209 passed, 3 skipped (#1446)."
  - sha: "149d305"
    at: "2026-11-17 14:41"
    summary: "PubMed 결과 파일을 요청 묶음에도 담도록 크기를 나눕니다."
    text: "JSONL을 8MiB 이하로 나눠 기본 요청 bundle의 50MiB 파일 상한 아래에 둔다. 분할·중간 실패의 페이지 범위·SHA 전달을 포함한 회귀 205 passed, 3 skipped (#1446)."
  - sha: "bb46a09"
    at: "2026-11-17 14:35"
    summary: "부분 문헌 결과에서도 조회 실패 기록을 보존합니다."
    text: "응답 없는 send를 failed로 마감해 장애 host의 후속 조회를 차단한다. ESearch·중간 EFetch 실패에도 부분 manifest를 유지하며 실제 admission ledger를 포함한 회귀 203 passed, 3 skipped (#1446)."
  - sha: "584079f"
    at: "2026-11-17 14:28"
    summary: "여러 PubMed 검색의 결과도 적은 파일로 전달합니다."
    text: "페이지를 검색별 JSONL에 묶고 byte 범위·페이지/전체 SHA를 기록한다. 10,000건 검색 두 번을 203→5파일로 줄여 다음 단계에 20,000건을 보존했다. 변조 거부를 포함한 회귀 201 passed, 3 skipped (#1446)."
  - sha: "236c8dd"
    at: "2026-11-17 14:09"
    summary: "PubMed도 공통 문헌 조회 경로를 따릅니다."
    text: "기존 구조 검사를 유지하고 공통 runner의 admission·20분 상한 아래에서 부분 manifest를 보존한다. structure·외부 대기·PubMed·문헌 회귀 243 passed, 1 skipped (#1446)."
  - sha: "b84deda"
    at: "2026-11-17 13:55"
    summary: "새 PubMed 도구에 맞춰 목록 회귀를 갱신합니다."
    text: "두 MCP 도구 목록에 pubmed_search를 추가하고 키 설정 시험의 Windows ACL probe를 격리했다. assertion을 유지한 관련 회귀는 179 passed, 4 skipped다 (#1446)."
  - sha: "0cb1657"
    at: "2026-11-17 13:47"
    summary: "많은 PubMed 검색 결과를 페이지 파일로 보존합니다."
    text: "pubmed_search가 서지·초록과 검색식·건수·페이지 SHA를 저장하고 경로·상태만 반환한다. 가짜 631건·2MB 초과·한글의 다음 단계 전달과 중복·실패·상한을 검증했다. 실제 검색은 미검증이다 (#1446)."
