  text: 'manual 한·영에 두 가지를 더했다. labhq_ask는 질문을 넘기는 중에 답이 먼저 오면 pending으로 두지 않고 바로 돌려준다(PR 1231의 남은 지적). dash용 키 입력 예시는 trap으로 감싸 입력 중 Ctrl-C로 끊어도 화면 입력 표시가 돌아온다(PR 1236의 남은 지적) (#1168)'
  summary: 매뉴얼에 질문 전달 중 온 답의 동작과 키 입력 예시의 Ctrl-C 처리를 적었습니다.
