rows:
- sha: '718f823'
  at: 2026-10-31 15:10
  text: _set_status가 되살리는 값(running, waiting_for_runner)을 요청이 cancelled이거나 cancelling(취소 기록이 아직 커밋 중)이면 쓰지 않는다. resume_when_ready는 agents를 기다린 뒤에도 취소를 다시 확인한다. run_request의 except Exception은 취소됐거나 취소 중이면 failed 기록을 만들지 않는다. failed 요청을 같은 id로 다시 이어 가는 모델 거절 재시도는 그대로 통과한다
  summary: 취소가 끼어든 뒤 늦게 도착한 resume이나 오류가 취소된 요청을 되살리거나 실패로 덮던 틈을 닫습니다.
- sha: '77df9fa'
  at: 2026-10-31 15:40
  text: 취소 판정 helper(_ended_by_cancel)를 Hub 메서드에서 server.py의 모듈 함수로 옮긴다. test_resume_receipt_clock처럼 Hub.resume_when_ready만 떼어 쓰는 가짜 hub에 메서드가 없어 시험 3건이 죽었다. 취소·재개·모델 거절·quota·재시작·facilities 계열 1549건이 통과한다
  summary: 가짜 hub로 resume_when_ready를 돌리는 시험이 깨지지 않게 합니다.
- sha: '9405e08'
  at: 2026-10-31 16:20
  text: _set_status가 되살리지 못하고 건너뛰면 False를 돌려주고, 저장 뒤에 취소가 끼었으면 request.status도 보내지 않는다. resume_when_ready는 상태를 쓴 뒤, 두 번째 agents 조회 뒤, request.resumed 발행 뒤에 취소를 다시 보고 그때마다 돌아와 run_request를 시작하지 않는다. 세 지점에서 취소가 끼어드는 시험을 더한다
  summary: 리뷰 P1(복구된 카드 경로에서 재개 오케스트레이션을 시작하기 직전 취소 재확인)을 고칩니다.
