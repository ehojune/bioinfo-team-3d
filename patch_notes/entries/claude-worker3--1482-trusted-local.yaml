    text: policy.approvals.trusted_local(기본 꺼짐)을 켜면 runner가 Claude 직원의 도구 카드를 사람에게 보내지 않고 approval_grants.classify 결과로 허용하거나 사유를 붙여 거부한다. 거부는 진짜 개인 경로·credential·제한 구역·허용 폴더 밖 쓰기와 삭제·관리자 권한·스케줄러 직접 호출·디스크 부족 내려받기만이고, 내부 자료 구역 읽기는 요청마다 한 번 묻는다. 기록 재생에서 #1445 205장은 허용 183·카드 22(내부 자료 읽기)·거부 0, 요청 A 98장은 허용 98, B 33장은 허용 31·거부 2
    summary: PI 인스턴스에서 trusted_local을 켜면 도구 카드 대부분이 사람 손 없이 허용되고 위험한 것만 이유와 함께 거부됩니다.
