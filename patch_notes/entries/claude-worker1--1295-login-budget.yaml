pr: 1298
rows:
  - sha: "6a47c16"
    at: "2026-11-06 16:30"
    summary: "HPC에 접속할 때마다 로그인 수를 세고, 사용자가 정한 요청당·하루 상한에 닿으면 새 접속을 하지 않습니다. 상한 값은 저장소에 없고 사용자가 정합니다."
    text: "hpc_login_budget(SQLite 카운터, request_scope, LoginLimitReached), HpcSettings 로그인 상한 두 개(기본 비움), Scheduler._run이 ssh 전에 admit, labhq hpc-logins (#1295)"
  - sha: "85ec5c5"
    at: "2026-11-06 17:30"
    summary: "설정할 때 HPC 로그인 상한을 묻고, 요청마다 로그인을 따로 세며, 상한에 닿은 요청은 상태 확인을 멈추고 경고로 알립니다."
    text: "init이 상한을 묻고(터미널·실제 scheduler일 때만), runner가 제출·상태 조회를 request_scope로 감싸 요청별로 세며, 상한 도달 시 그 요청 조회를 멈추고 agent.log 경고 한 번, 제출은 승인 전에 막음 (#1295)"
  - sha: "793849c"
    at: "2026-11-06 18:00"
    summary: "HPC 로그인 상한에 닿았다는 알림이 웹 피드에 경고로 뜨고 토스트도 나옵니다. 전에는 에이전트 카드 줄에만 남았습니다."
    text: "_notify_login_limit의 agent.log level을 warn에서 alert로 바꿔 state.js가 피드와 toast로 올리게 함, manual과 시험 갱신 (#1295)"
  - sha: "255733c"
    at: "2026-11-06 18:40"
    summary: "예전에 만든 설정이나 --yes로 만든 설정에서도 터미널에서 init을 다시 돌리면 HPC 로그인 상한을 한 번 묻습니다. 카운터 파일 위치는 설정 파일 기준이고, 올린 상한이 다시 차면 다시 알립니다."
    text: "init_wizard가 미정인 기존 설정에서 세 키만 저장(주석 보존), Settings.load 뒤 ledger 재바인딩, 알림 중복 키에 limit 포함, manual 04 한영 (#1295)"
