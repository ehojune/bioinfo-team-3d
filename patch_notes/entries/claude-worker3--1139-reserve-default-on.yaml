pr: 1192
rows:
- sha: '87bcdb7'
  at: 2026-10-31 21:40
  text: policy.budget.reserve_before_dispatch의 기본값을 false에서 true로 바꾼다. 모델 호출마다 보내기 전에 그 호출의 상한을 요청 예산에서 미리 잡으므로 병렬 단계가 각자 상한을 쓰고도 요청 상한을 넘지 못한다. 예시 설정 두 사본도 true로 맞추고, 켜진 기본값과 예시 설정, 꺼도 되는 것, 병렬 두 단계가 요청 상한을 넘지 못하는 것과 꺼 두면 두 단계 모두 시작하는 것을 tests/test_reserve_default_on.py로 고정한다
  summary: 병렬 단계가 요청 예산을 넘겨 쓰던 틈을 기본으로 막습니다. false로 끄면 이전처럼 이미 쓴 비용만 봅니다.
- sha: '07955fd'
  at: 2026-10-31 22:30
  text: 기본값이 켜지면서 깨진 tests/test_cso.py의 시험 11건을 고친다. FakeHub가 옛 검사(이미 쓴 비용만 봄)를 명시하게 하고 예약은 자체 hub와 새 시험 파일에서 따로 시험한다. 기본값을 확인하던 시험은 꺼 둔 경우의 시험으로 바꾼다. manual 한영의 보내기 전 예약 설명과 비용 표를 기본 켬으로 고치고 새 시험 파일을 Windows inventory known_tests에 넣는다
  summary: 기본값 변경으로 깨진 시험과 설명을 맞춥니다.
- sha: '2f5d663'
  at: 2026-10-31 23:10
  text: tests/test_recruit_plan_review3.py의 복구 뒤 변환 비용 시험이 hub를 옛 검사로 고정한 FakeHub와 예약이 켜진 runner를 섞어 변환이 ValueError로 시작도 못 하던 것을 고친다. 두 쪽을 같은 값으로 맞춘다. 제품 결함은 아니고 hub와 runner 중 한쪽만 false인 설정에서 계획 전 채용이 failed로 끝나는 것을 manual 한영에 적는다
  summary: 게이트웨이와 runner의 예약 설정이 다르면 채용이 실패한다는 점을 manual에 적었습니다.
- sha: '325ce9a'
  at: 2026-11-01 03:00
  text: 보내기 전 예약이 호출 하나가 잡는 금액을 그 호출의 상한과 요청에 남은 예산 중 작은 값으로 한다. 요청 예산이 호출 상한 기본값 5달러보다 작아도 첫 호출부터 예산 카드가 뜨지 않고 호출은 남은 예산으로 상한이 낮춰져 나가며, 병렬 호출의 보류액 합이 요청 상한을 넘지 못한다는 보장은 그대로다. 1센트 미만이 남았으면 자르지 않고 카드로 묻고, 카드가 올릴 상한은 호출 상한 전체를 담도록 정한다. 예약을 켜서 깨진 시험을 고친다. 요청 레코드 없이 상담을 돌리던 시험은 레코드를 만들고, 예산이 주제가 아닌 시험은 병렬 보류액이 들어갈 예산을 주고, 카드가 뜨던 시험은 새 동작을 기대하게 하며, 새 시험은 클리핑과 한도를 고정한다. manual 한영에 적는다
  summary: 요청 예산이 작아도 첫 호출에 카드가 뜨지 않고, 병렬 호출의 합이 요청 상한을 넘지 못하는 보장은 유지됩니다.
