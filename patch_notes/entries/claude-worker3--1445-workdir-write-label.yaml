pr: 1462
rows:
  - sha: '9c007c4'
    at: 2026-11-18 01:50
    text: 작업 root가 개인 경로로 닫힌 상태에서도 작업 폴더 안으로 확인된 쓰기(mkdir, New-Item, 출력 파일)는 작업 폴더 부류로 판정하고, 카드는 "작업 폴더 안에서 파일을 만들거나 고칩니다"와 위험 중간으로 보인다. 정책 판정은 바꾸지 않았다. 작업 폴더 안에 따로 등록된 개인 경로(inputs/)에 쓰거나 열린 읽기 밖을 읽는 명령은 개별 카드로 남긴다
    summary: 작업 폴더 안에서 폴더·파일을 만드는 카드에 "위험 높음"과 "다른 개인 경로" 문구가 붙지 않습니다.
  - sha: 'e9f639b'
    at: 2026-11-18 02:10
    text: 이 요청에서 경로 미확정 부류가 허용돼 있으면 작업 폴더 부류 카드도 그 허용으로 자동 승인한다. 작업 폴더 허용은 경로 미확정을 덮지 않는다. 요청 재생 사람 카드 A 12, B 21 유지
    summary: 경로 미확정을 한 번 허용하면 작업 폴더 안 쓰기 카드도 다시 묻지 않습니다.
  - sha: '8614e63'
    at: 2026-11-18 02:40
    text: 리뷰 P1 수정. 작업 폴더 증명에서 --output=FILE 같은 옵션 값은 피연산자로 검사하고, -o/tmp/out처럼 붙은 값은 증명하지 않는다. 작업 폴더 카드는 쓰기가 보일 때만 "작업 폴더 안에서 파일을 만들거나 고칩니다"라고 쓰고, 읽기는 "작업 폴더 안의 파일을 다룹니다"로 쓴다
    summary: 옵션에 밖의 경로를 담은 명령은 작업 폴더 묶음에 들어가지 않습니다.
  - sha: '1aa6362'
    at: 2026-11-18 03:10
    text: 리뷰 P1 수정. 작업 폴더 증명은 긴 옵션(--output=F, --files0-from=F 등)을 통째로 받지 않고, sed 스크립트 파일(-f)도 받지 않는다. 그런 명령은 경로 미확정 부류로 남는다
    summary: 파일 목록이나 스크립트 파일로 경로를 감출 수 있는 명령은 작업 폴더 묶음에 들어가지 않습니다.
