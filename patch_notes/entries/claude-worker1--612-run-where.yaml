pr: 1189
rows:
  - sha: "fd770f9"
    at: "2026-10-31 19:00"
    summary: "요청을 보낼 때 이 PC의 WSL에서 분석하도록 고를 수 있고(labhq send --wsl, 웹의 WSL에서 체크), WSL이 준비되지 않았으면 계획을 세우기 전에 셋업 카드가 먼저 뜹니다."
    text: "요청에 run_where(auto|wsl)를 더해 WSL을 고르면 계획 전에 셋업 카드를 연다 (#612)"
  - sha: "f970f84"
    at: "2026-10-31 22:00"
    summary: "WSL에서 실행하도록 고른 요청은 같은 직원을 가진 Windows runner가 있어도 WSL 셋업 카드를 열고, WSL runner가 직원을 맡으면 그 요청의 분석을 WSL runner에 고정합니다."
    text: "run_where=wsl: native runner가 같이 호스트해도 카드를 열고, WSL runner가 직원을 맡으면 요청의 bioinfo-agent를 WSL runner에 고정한다 (#612 리뷰 P1)"
  - sha: "25acb01"
    at: "2026-10-31 22:30"
    summary: "웹에서 WSL에서 체크는 요청을 보낸 뒤 풀리고, 메모를 보내는 중에는 보이지 않아 다음 요청이 WSL로 가는 일이 없습니다."
    text: "웹: 요청을 보낸 뒤 WSL에서 체크를 풀고 메모 모드에서는 숨긴다 (#612 리뷰 P1)"
  - sha: "1e689bc"
    at: "2026-10-31 23:00"
    summary: "WSL 설정이 없는 설치에서 WSL을 골라도 하루를 기다리지 않고 안내를 남긴 뒤 진행하며, bioinfo-agent가 아닌 직원을 직접 고르고 WSL을 붙인 요청은 거부됩니다."
    text: "run_where=wsl: 설정 없으면 기다리지 않고 안내하고, bioinfo-agent 아닌 직접 요청은 거부한다 (#612 리뷰 P1)"
  - sha: "4bd0d32"
    at: "2026-10-31 23:40"
    summary: "WSL을 고른 요청은 설정 없음·점검 실패·거절·시간 초과를 모두 같은 안내 하나로 남기고 기다리지 않으며, CP1 수정 요청도 같은 실행 위치를 이어받고 잘못된 조합은 400으로 거부됩니다."
    text: "WSL 준비 결과를 '준비됨/이유' 둘로 모으고(점검 예외 포함), 비동기 수정 요청에도 run_where를 잇고, 잘못된 조합은 400으로 돌려준다 (#612 리뷰)"
  - sha: "55de127"
    at: "2026-10-31 23:50"
    summary: "manual에 이 PC의 WSL에서 실행하기(--wsl, 웹 체크, run_where)의 동작, 고정, 기다리는 시간, 안 될 때의 처리, 거부되는 조합을 적었습니다."
    text: "문서: 이 PC의 WSL에서 실행하기(run_where) (#612)"
  - sha: "c50aa3d"
    at: "2026-11-01 00:10"
    summary: "WSL에서 실행하도록 골랐는데 WSL을 얻지 못하면 그 이유가 요청 기록뿐 아니라 화면 피드와 CLI에도 경고로 나타납니다."
    text: "WSL를 못 얻은 이유를 feed에 경고로 발행한다 (#612 리뷰 P1)"
  - sha: "d3defd2"
    at: "2026-11-01 00:40"
    summary: "WSL 선택 때문에 dispatch에 넣은 호출을 paper skill 복구 시험의 gateway 대역이 몰라 시험이 멈추던 것을 고쳤습니다."
    text: "시험: paper skill 복구 시험의 Hub 대역에 _pin_wsl_request를 넣는다 (#612)"
  - sha: "0a6c561"
    at: "2026-11-01 01:10"
    summary: "WSL을 고른 요청이 다른 요청의 native 작업이 끝나지 않았어도 5분 기다리거나 native로 가지 않고 바로 WSL runner를 얻습니다. 보내기·다시 보내기·재시작 뒤 이어받기도 그 runner로만 갑니다."
    text: "요청의 WSL 고정을 직원 owner가 아니라 WSL runner 자체로 따른다 (#1204, #612 리뷰 P1)"
  - sha: "92c6cee"
    at: "2026-11-01 01:50"
    summary: "WSL을 고른 요청의 계획이 WSL runner의 scheduler·capability를 보고, 첫 runner 대기·login 안내·환경 binding·재개 판정도 같은 WSL runner를 기준으로 합니다."
    text: "요청의 WSL 고정을 runner·roster·capability를 고르는 모든 곳에 한 helper로 건다 (#1204, #612 리뷰 P1)"
  - sha: "bb30dd4"
    at: "2026-11-01 02:20"
    summary: "WSL을 고른 요청은 WSL runner가 잠시 끊겨도 계획과 login 안내가 WSL 기준으로 남고, native runner의 scheduler로 계획이 짜이지 않습니다."
    text: "고정은 요청이 고른 것이지 지금 연결된 것이 아니다 (#1204, #612 리뷰 P1)"
