  text: Windows 종료(adapter 취소·버전 조사 시간 초과·down)가 taskkill /T 대신 생성 시각을 검증하는 helper를
    써서, 재사용된 부모 PID 때문에 PI의 gateway·runner가 함께 죽던 문제를 막는다(#589).
- sha: d13de19
  at: 2026-10-14 18:02
  text: status·doctor가 venv launcher의 자식이 쓴 heartbeat를 읽어 살아 있는 gateway를 '기록 없음'으로
    보이지 않게 한다(#589).
- sha: fc10f13
  at: 2026-10-14 18:39
  text: down이 launcher 밑 자식 프로세스의 종료 실패도 실패로 알리고 PID 기록을 남겨, runner가 살아남은 채 성공으로 끝나지
    않게 한다(#589 봇 P1).
- sha: '1593224'
  at: 2026-10-14 19:19
  text: tree-kill이 후보 handle을 열어 PID를 고정하고 두 번째 표로 부모 PID를 다시 확인한 뒤 그 handle로 종료하며,
    실패한 프로세스의 조상 전체를 남겨 재시도가 닿게 한다(#589 봇 P1 2건).
