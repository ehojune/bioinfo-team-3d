- sha: e3fc6b0
  at: 2026-10-15 11:26
  text: 설정이 다른 labhq가 같은 state 폴더·포트를 쓰거나 이 PC의 주 설정과 다르면 doctor와 up이 쉬운 한국어로 알리고 고치는 명령(labhq -c <그 설정> open 등)을 보여 준다(#613).
  summary: 다른 설정이 같은 상태 폴더나 포트를 쓰면 이유와 고치는 명령을 쉬운 한국어로 알립니다.
- sha: fad7274
  at: 2026-10-15 11:27
  text: labhq init이 PI가 시험한 설정(연구 모드·분야 팩·의미 모델 ab·산출물 종류 선언)으로 새 설정을 만들고, bioinfo-agent 위치를 찾거나 묻고 못 찾으면 연결 안 됨을 알리며, dev_log.repo를 묻는다(#613).
  summary: 검증에 쓴 연구 설정으로 초기화하고 생물정보 직원 연결과 개발 기록 위치를 안내합니다.
- sha: 778edff
  at: 2026-10-15 11:31
  text: 격리 설치 검사(scripts/clean_install_check.py)의 init 입력을 질문 수에 매이지 않게 해, init이 묻는 질문이 늘어도 EOF로 멈추지 않는다(#613).
  summary: 초기 설정 질문이 늘어도 격리 설치 검사가 입력 부족으로 멈추지 않게 했습니다.
- sha: 5ef1ee2
  at: 2026-10-15 12:05
  text: 예시 설정이 semantics ab·actions confirm을 켜도 action layer만 지우는 검사(test_semantics_shadow_remove)가 통과하도록 의미 모델 설정 test를 고친다(#613).
  summary: 선택 의미 기능의 일부만 제거해도 검사할 수 있도록 설정 검사를 고쳤습니다.
- sha: 583a8c6
  at: 2026-10-15 12:43
  text: 실행 중인 gateway·runner가 정체(설정 파일과 state·runner state·runner id·포트 지문)를 적고, up과 doctor가 그 정체로 같은 state·runner state·포트를 쥔 다른 설정을 막으며 gateway는 /api/health의 identity로 정체를 알려 준다(#613).
  summary: 실행 중인 인스턴스의 신원을 기록해 다른 설정이 같은 폴더나 포트를 쓰지 못하게 합니다.
- sha: 0a584d9
  at: 2026-10-15 12:43
  text: init이 bioinfo-agent 폴더를 상대 경로로 받아도 절대 경로로 저장하고, doctor는 상대 경로로 적힌 설정을 warn한다(#613).
  summary: 초기 설정의 생물정보 직원 경로를 절대 경로로 저장하고 상대 경로 설정은 경고합니다.
