    summary: 간소화 연구 보고서의 참고문헌 식별자를 승인된 근거와 대조합니다.
    text: DOI·PMID·GEO 식별자는 연결된 근거로 확인하며, 조립한 보고서를 저장하기 전에 다시 검사합니다.
  - sha: 'e3b1b98'
