    summary: 간소화 연구 보고서의 참고문헌 줄마다 근거 표식을 달도록 안내합니다.
    text: 원장에 근거가 담긴 출처만 참고 목록에 적고, 출처에 대한 판정과 비교는 표식과 함께 본문에 씁니다.
