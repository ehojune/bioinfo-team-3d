    summary: 승인된 반대 근거도 참고문헌에 인용할 수 있게 했습니다.
    text: 주장의 인용 가능성 검사와 별도로, 서지 식별자는 그 주장에 연결된 승인 근거 전체와 대조합니다.
  - sha: '0085a38'
    at: '2026-11-25 22:50'
    summary: 간소화 연구 보고서의 참고문헌 식별자를 승인된 근거와 대조합니다.
    text: DOI·PMID·GEO 식별자는 연결된 근거로 확인하며, 조립한 보고서를 저장하기 전에 다시 검사합니다.
  - sha: 'e3b1b98'
    at: '2026-11-25 11:22'
    summary: 간소화 연구 보고서의 참고문헌 줄마다 근거 표식을 달도록 안내합니다.
    text: 원장에 근거가 담긴 출처만 참고 목록에 적고, 출처에 대한 판정과 비교는 표식과 함께 본문에 씁니다.
