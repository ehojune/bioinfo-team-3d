  text: 2026-11-07 issue 정리 B의 판단과 근거를 docs/reference/issue-hygiene-20261107-b.md에 남긴다. #1283·#1300·#1259·#1079는 완료 조건이 충족돼 닫았고 #1285·#1047·#1048·#1049·#1037은 열어 두며 남은 일과 재개 조건을 적는다. #1037은 막혔던 producer가 병합돼 풀렸다
