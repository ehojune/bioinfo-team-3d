- sha: 'c743c8b'
  at: 2026-11-07 07:10
  text: manual 17장 한영의 알려진 한계에 Windows 첫 detached launch가 드물게 WMI provider_timeout으로 실패한다는 항목을 더한다. 막 켜진 PC나 러너의 첫 PowerShell 실행이 평소보다 10~26배 느린 것과 맞고 원인은 확정하지 못했으며 journal의 run_ms·launch_ordinal·os_uptime_s와 CI 워밍업(1316)을 안내한다
  summary: 간헐 실패를 사용자 문서의 알려진 한계에 올립니다.
- sha: '70f86c8'
  at: 2026-11-07 07:40
  text: manual 17장 한영의 WMI provider_timeout 항목을 2026-11-06 GitHub CI Windows runner에서 관측된 세 건과 가설로 좁힌다. 로컬 재현과 runner 사양 확인이 없어 일반 PC의 원인으로 단정하지 않고 재실행으로 통과한 것은 한 건만 확인했다고 적는다
  summary: 실측하지 않은 조건으로 일반화하던 문장을 관측 범위로 좁힙니다.
