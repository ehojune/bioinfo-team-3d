- sha: '19530b2'
  at: 2026-11-05 15:40
  text: doctor의 Claude login 행이 claude auth status가 통과해도 직원 폴더 .credentials.json의 날짜를 읽는다. 갱신 토큰이 만료됐거나, 갱신 토큰 없이 접근 토큰이 만료됐으면 fail로 바꾸고 다시 로그인하라고 안내한다. 토큰 값은 쓰지 않고 호출도 하지 않는다. 서버에서 취소된 토큰과 OS 키체인 로그인은 알 수 없다는 한계를 04장 한영에 적는다
  summary: 8차 시운전에서 doctor가 ok라 했는데 첫 직원 turn이 로그인 만료로 멈춘 문제를 doctor가 미리 알립니다.
- sha: '19eab4d'
  at: 2026-11-05 15:52
  text: 리뷰 지적 반영. claude auth status의 authMethod가 claude.ai가 아니면(API 키·토큰·Bedrock/Vertex) 옛 .credentials.json의 만료를 보지 않는다. 출력을 읽을 수 없으면 파일 확인을 유지한다
  summary: 다른 방식으로 로그인한 직원이 옛 OAuth 파일 때문에 fail로 보이지 않게 합니다.
