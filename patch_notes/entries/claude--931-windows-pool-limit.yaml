rows:
- sha: 'e414872'
  at: 2026-10-24 11:10
  summary: Windows 검사가 느린 날 무관한 변경을 시간 초과로 막지 않도록 제한을 늘렸습니다.
  text: '최근 99개 Windows run을 재측정했다. 병렬 단계는 성공 74회 중앙값 264초·p90 319초·최댓값 350초이고 6분 제한(360초)에 8번 걸렸다. 병렬 단계 제한을 6분에서 9분(최댓값의 1.5배 이상), Windows job 제한을 10분에서 14분으로 올렸다. 병렬 단계 시작과 소요를 job summary에 항상 남겨 다음 조정의 근거로 삼는다. 테스트 자체의 assert·timeout은 바꾸지 않았다. 10분 목표는 summary.json의 over_ten_minutes로 계속 잰다. 제한을 올린 효과는 앞으로의 run으로 확인해야 한다.'
