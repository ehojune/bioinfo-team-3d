  summary: 모델 거부 뒤 새로 계획한 요청도 bench case 같은 원래 요청의 출처 정보를 이어받습니다.
  text: 'Hub._model_refusal_request가 새 요청에 원 요청 meta를 복사한다. CP1 계보 키 revised_from은 빼고, 연결은 기존 model_refusal_from으로 남긴다. revised_from은 CP1 수정 요청 찾기와 저장 부모 연결이 읽는 유일한 제어 키이고, case_id 등 나머지는 rounds 기록이 그대로 남기는 출처 값이다. meta는 dict[str, str]이며 RequestIn이 새 dict로 검증하므로 원 요청과 값을 공유해 바뀌지 않는다. 기존 test_model_refusal_682.py에 순수 검사 1건과 승인 route 검사 1건을 더했다. fastapi가 없어 순수 검사만 AST 추출로 in-process 실행했고 HEAD에서 FAIL, 수정 후 PASS였다. route 검사와 전체 파일은 CI에 맡긴다. 거부·취소·예산 귀속과 #780(continuation 거부 카드)은 바꾸지 않았다.'
