rows:
  - sha: "196ac54"
    at: "2026-11-01 12:00"
    summary: "AlphaGenome 키를 설정한 PC에서 조회 도구를 쓰는 직원의 실행이 시작 전에 거절되던 문제를 고쳤습니다. 키 파일의 위치만 있어도 키를 덮어쓴 것으로 오해하던 점검이 이제 실제로 키를 덮어쓴 경우만 막습니다."
    text: "Atlas 시작 점검: 키 파일 경로가 아니라 환경 변수 이름과 값으로 판정한다 (#1225)"
  - sha: "8405949"
    at: "2026-11-01 13:00"
    summary: "키를 덮어쓰는 설정은 어떤 모양이든 막고, 키 파일의 설정된 위치만 예외로 둡니다. PowerShell 방식으로 키를 덮어쓰려는 설정도 막힙니다."
    text: "Atlas 점검의 예외를 설정된 키 파일 경로와 labhq가 그 경로로 만든 규칙으로 좁힌다 (#1225 리뷰 P1)"
  - sha: "d9546e8"
    at: "2026-11-01 14:00"
    summary: "키 파일 위치를 파일 이름만으로 적어 두어도 키를 덮어쓰는 설정은 그대로 막힙니다."
    text: "Atlas 점검 예외: 구분자 있는 절대 경로와 ~ 형태만 두고 규칙 생성 실패는 규칙을 빼 더 엄격하게 한다 (#1225 리뷰)"
  - sha: "c266979"
    at: "2026-11-01 15:00"
    summary: "키 파일 위치를 확인하는 단계가 테스트 환경의 보호 때문에 멈추지 않고, 확인하지 못한 형태만 예외에서 빠집니다."
    text: "Atlas 점검: 테스트 가드가 settings.path를 거절해도 그 형태만 예외에서 뺀다 (#1225 CI)"
