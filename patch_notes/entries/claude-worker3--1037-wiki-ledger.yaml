pr: 1329
rows:
- sha: '2c4e8be'
  at: 2026-11-07 23:00
  text: 단계 결과를 받을 때 wiki를 인용한 근거 행을 그 단계 workdir의 outputs/wiki_queries.jsonl과 대조한다. 기록에 없는 locator, 신선도나 출처가 다른 행, 기록이 없거나 읽을 수 없거나 한 줄이라도 깨진 경우의 모든 wiki 행을 CP2에서 거부 행으로 올리고, 거기서 파생된 행과 그 행에만 기대는 claim도 뺀다. 단계 prompt에 wiki hit을 어떻게 인용할지 규칙을 더했다. 감사 기록은 직원 작업 폴더의 파일이라 독립 출처 인증은 아니다
  summary: 모델이 적은 wiki 위치·신선도가 도구 기록과 다르면 그 근거를 CP2에서 거부합니다.
- sha: '9cfe857'
  at: 2026-11-08 00:00
  text: wiki 도구는 감사 기록을 dispatch 뒤에 쓰고 runner는 선언된 산출만 수집하므로 단계 결과를 받을 때 labhq가 outputs/wiki_queries.jsonl을 수집 산출에 올리고 hash를 단다. 그렇지 않으면 맞게 적은 wiki 행도 미수집 산출 인용으로 거부됐다. 행이 적은 출처(id와 uri)는 모두 hit의 기록과 같아야 하고, 기록된 출처가 있으면 행이 그것을 적어야 한다
  summary: wiki 근거 행이 도구 기록의 출처를 정확히 적어야 하고 감사 기록은 자동으로 수집됩니다.
