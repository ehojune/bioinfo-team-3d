  text: 'runner가 환경 binding이 붙은 소비 단계를 시작하기 전에 자기 run 기록의 성공 여부, 수집된 runner-manifest.json의 hash·내용과 binding 일치, interpreter 존재를 검증하고 통과해도 보호된 별칭이 없어 계속 거부하며 사유로 구분한다. manual 영·한 반영'
  summary: 환경 단계가 실제로 성공했는지 먼저 확인하고, 보호된 별칭이 생기기 전까지는 소비 단계를 계속 막되 이유를 구분해 알려 줍니다.
