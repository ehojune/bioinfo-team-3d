  summary: 전기능 B의 NO-GO와 현재 시운전·CI 차단 조건을 개발 인수인계 첫머리에 반영했습니다.
  text: HANDOFF의 지난 A 우선 준비 안내를 B 격리 설치·doctor PASS·요청 0건과 #877 요청 전체 90분 독립 hard-stop 차단 조건으로 바꿨다. #876의 Windows 필수 CI 실패와 #833 원인 미확정을 구분했다. 옛 근거는 기존 docs/reference 링크로 연결하고 문서 길이는 3508자에서 3481자로 줄였다. 제품 코드·설정·연구 요청은 건드리지 않았다.
