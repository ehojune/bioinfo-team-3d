  text: runner별로 늘어난 환경 clone 단계는 max_steps에 세지 않고, dispatch 직전에 runner가 지금 알리는 runtime이 저장된 binding과 다르거나 알리지 않으면 보내기 전에 거부한다 (#674 후속 3·4).
  summary: 환경 단계가 늘어도 단계 수 한도에 걸려 실패하지 않고, 실행기 종류가 바뀐 상태로는 환경이 쓰이지 않게 막습니다.
- sha: 017cb56
  at: 2026-10-29 16:44
  text: runner runtime 재대조를 steer 첨부 await 뒤, 작업을 기록·전송하기 직전에 한 번 더 한다 (#674 후속 4, 봇 P2).
  summary: 전송 직전에 실행기 종류를 한 번 더 확인해 그 사이에 바뀐 실행기에 옛 환경이 가지 않게 했습니다.
- sha: ea22033
  at: 2026-10-29 16:55
  text: 분기 연구 계획에서 runner 환경 clone 여유분을 clone이 속한 가지에만 더하고 전체 clone 수를 모든 가지에 더하지 않는다 (#674 후속 3, 봇 P2).
  summary: 분기 연구 계획의 단계 수 한도 완화를 환경 단계가 있는 가지에만 적용합니다.
