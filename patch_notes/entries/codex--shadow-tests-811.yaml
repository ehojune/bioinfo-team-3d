- sha: 3d7571f
  at: 2026-10-20 18:53
  text: 'Shadow 비교 검사에서 같은 기준 실행의 반복을 줄였습니다. 기술: off 결과를 불변 JSON으로 공유해 네 비교의 lab 호출을
    8→5로 줄이고 on·fresh-process·fail-open·개인정보/읽기 경계를 보존했다. 제거 검사는 전체 수집과 compile/잔여
    참조/상태/핵심 E2E를 유지하면서 child node를 좁혔다. 4건 red 뒤 mock/static 79건 통과, CI 시간 절감과 실제
    제거/E2E는 미검증이다.'
- sha: 1b343b0
  at: 2026-10-20 19:52
  text: 'queued halt 검사가 Windows worker 대기에 흔들리지 않도록 분리했습니다. 기술: halt 판정 뒤 t3 input
    scan executor 대기의 TimeoutError를 모의 재현하고, 해당 테스트만 offload/write job을 직접 실행한다. fsync·SQLite
    write와 기존 assertion 6개/deadline 5개를 보존하고 순서 assertion 2개를 추가했다. 관련 mock/static
    11건 통과, 제품 control 변경·실제 process/thread 실행은 없다.'
