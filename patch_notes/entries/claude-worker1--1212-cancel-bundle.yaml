rows:
  - sha: "69494b9"
    at: "2026-11-01 04:00"
    summary: "첫 작업 폴더가 생기기 전에 취소한 요청에 '요청 묶음을 만들지 못했습니다' 경고가 오류처럼 뜨지 않습니다. 다른 실패의 경고는 그대로입니다."
    text: "취소로 끝났고 작업 폴더가 없는 요청은 묶음 경고를 내지 않는다 (#1212)"
  - sha: "758b0a3"
    at: "2026-11-01 05:00"
    summary: "취소해도 기록된 작업 폴더가 사라졌다면 묶음 경고가 그대로 뜹니다. manual에 정상 취소 예외를 적었습니다."
    text: "기록된 작업 폴더가 사라진 취소 요청은 경고를 유지하고 manual에 예외를 적는다 (#1212 리뷰 P1)"
