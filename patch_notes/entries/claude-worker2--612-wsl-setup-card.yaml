- sha: a865763
  at: 2026-10-30 03:06
  text: bioinfo-agent 작업이 갈 곳이 없고 runner.wsl이 설정돼 있으면 요청마다 한 번 WSL 셋업 카드를 띄워, 승인하면 gateway가 setup을 thread에서 돌리고 남은 관리자 명령은 보여 준 뒤 요청은 기다리지 않고 멈춘다 (#612 2단계).
  summary: 분석 전용 WSL이 준비되지 않았을 때 오래 기다리는 대신 "셋업할까요?"를 한 번 묻고, 승인하면 준비를 해 줍니다.
- sha: 3cf96bc
  at: 2026-10-30 03:20
  text: WSL 셋업 카드를 native runner가 맡은 직원에는 띄우지 않고, 시간 초과 뒤에도 도는 셋업이 끝날 때까지 새 셋업을 막으며, 관리자 명령을 항목 key로 가려 동적 안내도 담는다 (#1038 리뷰 P1·P2).
  summary: 잠시 끊긴 일반 실행기를 WSL 문제로 오해하지 않게 하고, 셋업이 겹쳐 돌지 않게 했습니다.
