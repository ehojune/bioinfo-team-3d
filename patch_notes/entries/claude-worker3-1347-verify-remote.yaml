pr: 1370
rows:
- sha: '7d147f6'
  at: 2026-11-11 00:34
  text: 'labhq verify가 요청 전체 HPC 단계의 원격 목록(hpc_remote_outputs)에 기록된 산출을 원격 보관(크기 기록)으로 세고 문제로 보지 않는다. 어디에도 없는 산출은 그대로 없음 (#1347).'
  summary: HPC에 일부러 남긴 큰 결과 파일 때문에 검증이 실패하지 않습니다.
- sha: '001fada'
  at: 2026-11-11 00:48
  text: 'verify의 원격 근거를 결과 task_id의 성공한 실행 기록(같은 요청·단계)에서만 읽고, manifest.json은 링크를 따르지 않는 held 폴더로 연다 (#1370 리뷰).'
  summary: 앞 턴의 기록이나 바꿔치기한 파일이 원격 보관 판정을 속이지 못합니다.
- sha: 'f056c1e'
  at: 2026-11-11 01:05
  text: 'verify가 step_id 없는 direct HPC 실행의 원격 기록도 direct 단계로 읽는다 (#1370 리뷰).'
  summary: 단독 요청의 HPC 원격 결과도 원격 보관으로 셉니다.
