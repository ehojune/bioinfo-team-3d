  text: CP1 수정 요청과 모델 거부 뒤 다시 시작한 요청이 부모의 wiki 노출 수준으로 시작한다. 부모가 possible이거나 기록이 없으면 새 요청도 게시가 막힌다. 재시작 뒤에도 기록이 유지되고 wiki_tools 키가 없는 구형 runner에 보낸 요청은 possible이 되는 것과 결과 올리기의 새 저장소 생성 직전 재확인을 시험으로 고정했다. manual 12장과 참고 문서를 맞췄다
  summary: 수정 요청이나 다시 시작으로 연 요청도 원래 요청의 wiki 노출 때문에 게시가 막힙니다.
