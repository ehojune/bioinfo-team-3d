- sha: '331a036'
  at: 2026-11-01 06:40
  text: 허용 목록에 AlphaGenome 도구를 넣은 직원도 키 파일이나 클라이언트가 없으면 서버가 그 도구를 등록하지 않는데, 직원 명단은 늘 그 도구를 가진 것으로 적어 CSO가 쓸 수 없는 도구를 전제로 계획할 수 있었다. 명단 함수가 AlphaGenome 사용 가능 여부를 받아, 불가능하면 허용 목록에서 두 도구를 빼고 남는 것이 없으면 조회 도구 항목 자체를 적지 않는다. 가능 여부는 오케스트레이터가 키 파일과 클라이언트 설치로 판단하고 계획 prompt 세 곳에 넘긴다
  summary: 키가 없으면 비서실장 같은 직원의 명단에 AlphaGenome이 올라가지 않아 CSO가 쓸 수 없는 도구를 전제로 하지 않습니다.
