  - sha: 384db0c
    at: "2026-10-22 08:26"
    summary: "점검 명령이 서버 상태 저장 드라이브가 따로 있을 때 그 드라이브의 남은 공간도 확인합니다."
    text: "doctor disk 행이 작업·임시·직원 홈에 더해 gateway.state_dir(SQLite·이벤트)의 볼륨이 이미 보인 볼륨과 다르면 같은 읽기 전용 경고 행을 더한다. 볼륨은 가장 가까운 기존 부모로 판정하고 폴더를 만들지 않으며, 같은 볼륨이면 반복하지 않고 구분할 수 없으면 행을 남긴다. #678의 다운로드 차단·fail 단계·큰 원자료 위치는 남아 있다."
  - sha: dea14b8
    at: "2026-10-22 08:35"
    summary: "네트워크 공유처럼 드라이브 번호를 알 수 없는 저장소도 공간 부족 경고에서 빠지지 않게 합니다."
    text: "doctor _volume이 st_dev 0(UNC·특수 볼륨)을 같은 볼륨으로 보지 않고 판정 불가(OSError)로 알려 gateway 상태 드라이브 행을 남긴다. 정상 볼륨의 중복 억제·경고 기준·폴더 무생성은 그대로이며 모든 경로가 0일 때 상태 드라이브 부족이 경고되는 순수 회귀를 더했다."
  - sha: 8105613
    at: "2026-10-22 08:56"
    summary: "매뉴얼의 논문 스킬 설명에서 이미 반영된 기능을 미반영이라 한 문장과, 효용을 확인할 수 있는 것처럼 읽히던 문장을 고쳤습니다."
    text: "docs/manual.md 논문 스킬 절에서 main에 병합된 #830 receipt 보호를 미반영이라 한 문장을 지우고, labhq talent 기록이 효용을 보여 준다고 읽히던 문장을 어느 단계에 붙고 결과에서 참조됐는지로 정정했다. 제품·검사 코드는 바뀌지 않았다."
