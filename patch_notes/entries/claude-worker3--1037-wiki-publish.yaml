rows:
- sha: 'f50e110'
  at: 2026-11-07 12:00
  text: wiki 노출이 none이 아닌 요청이 GitHub에 쓰는 모든 경로를 막는다. ProjectReporter(프로젝트 issue·댓글·보고서·부록·종료, pipeline 기여는 승인 카드 전과 branch·파일·PR 직전), RoundRecorder(라운드 issue), ResultStorage.upload(연구 결과 파일마다)가 쓰기 직전에 다시 확인하고 막히면 다시 시도하지 않는다. CP2 근거 카드는 막지 않고 wiki 노출 경고 한 줄을 더한다. 막힌 요청의 결과를 올리는 길은 아직 없고 wiki 본문 마스크와 독립 출처 인증은 후속이다
  summary: 노출됐거나 이력이 없는 요청의 보고서·라운드·결과 올리기·pipeline 기여가 GitHub에 나가지 않게 막습니다.
- sha: '9ca4647'
  at: 2026-11-07 13:00
  text: wiki 노출 기록이 없는 요청은 created_at이 labhq_wiki 출시(2026-10-29 21:01:56Z) 이전일 때만 none으로 본다. 출시 이후이거나 created_at을 읽을 수 없으면 계속 막는다. 출시 전 요청도 wiki 직원에게 task가 가면 possible이 된다. 요청을 손으로 만드는 기존 시험 fixture에 none을 기록했다
  summary: 출시 전에 만든 옛 요청은 게시할 수 있고 그 뒤 기록 없는 요청은 막힙니다.
- sha: 'cf60712'
  at: 2026-11-07 15:00
  text: 쓰기 전에 await가 끼는 세 곳에서 wiki 노출을 다시 확인한다. 라운드 issue는 repo 조회 뒤, 프로젝트 issue 닫기는 닫기 직전, 결과 올리기의 새 저장소 생성은 생성 직전이다. 앞의 두 곳은 노출이 도중에 올라가는 시험을 더했고 세 번째는 시험하지 않았다
  summary: 게시 도중 wiki 노출이 올라가면 라운드 issue·issue 닫기·새 저장소 생성도 멈춥니다.
- sha: '1e37266'
  at: 2026-11-07 16:00
  text: 늦게 고르는 결과 저장소 시험의 요청 fixture에 wiki 노출 none을 기록했다. 시험 코드만 바꿨다
  summary: 시험 fixture만 고쳤고 사용자에게 보이는 변화는 없습니다.
- sha: '36ed7f3'
  at: 2026-11-07 17:00
  text: wiki 노출 기록이 없는 요청을 none으로 보는 조건에 마지막 갱신 시각(updated_at)도 출시 전이어야 한다는 것을 더했다. 출시 전에 만들었어도 그 뒤 resume된 요청은 도구를 썼을 수 있어 unknown으로 남고 게시가 막힌다. manual 12장과 참고 문서를 맞췄다
  summary: 출시 전에 만들었어도 그 뒤 이어서 실행한 요청은 기록이 없으면 게시가 막힙니다.
- sha: '2b4ceb6'
  at: 2026-11-07 17:40
  text: 라운드 기록 시험의 요청 fixture가 created_at이 작다는 우연에 기대고 있어 wiki 노출 none을 명시했다. 시험 코드만 바꿨다
  summary: 시험 fixture만 고쳤고 사용자에게 보이는 변화는 없습니다.
