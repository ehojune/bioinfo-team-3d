    summary: "HPC에 접속하는 방식과 로그인이 얼마나 쌓이는지, 줄이는 방법을 코드만 읽어 정리한 문서를 추가했습니다. 동작은 바뀌지 않습니다."
    text: "docs/reference/hpc-login-survey-1295.md 추가 (조사 전용, 코드 변경 없음) (#1295)"
  - sha: "6c8b77a"
    at: "2026-11-06 12:00"
    summary: "조사 문서에서 마스터 연결이 없을 때 새 로그인을 막는 방법과, 작업 출력 줄을 끝남 표지로 믿지 않는다는 점을 바로잡았습니다."
    text: "ControlMaster fail-closed(ProxyCommand=false, 로컬 확인)와 분리된 상태 파일(D) 설계로 문서 수정 (#1295)"
  - sha: "a34dc18"
    at: "2026-11-06 12:40"
    summary: "끝남 확인을 한 번으로 끝내지 않고 간격을 늘려 가며 다시 확인하는 방식과 그 로그인 수를 문서에 더했습니다."
    text: "완료 확인을 제한된 backoff 재확인(잡당 상한 12회)으로 바꾸고 로그인 추정에 반영 (#1295)"
