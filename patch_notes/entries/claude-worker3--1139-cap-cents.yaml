rows:
- sha: '51b2f03'
  at: 2026-11-01 05:00
  text: 남은 예산으로 잘라낸 보류액만 센트로 내리던 것을 모든 호출 상한으로 넓힌다. 호출 상한이 작업이나 직원이나 per_task_usd 어디서 왔든 센트로 내려서 0.015달러 같은 값이 CLI에서 0.02달러로 나가 보류액을 넘겨 쓰는 틈을 없앤다. 센트로 내리면 1센트보다 작아지는 호출 상한은 보내지 않고 거절하며, 설정은 예약이 켜져 있을 때 0보다 크고 0.01달러보다 작은 per_task_usd를 로드 때 거절한다. 매우 큰 금액은 내리지 않고 그대로 두어 Decimal 정밀도 오버플로를 막는다
  summary: 호출 상한이 센트 단위가 아니어도 보류액을 넘겨 쓰지 않고, 1센트 미만 상한은 보내지 않습니다.
