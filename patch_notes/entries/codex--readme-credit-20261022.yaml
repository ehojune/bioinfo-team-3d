  summary: README에 연구팀 설계의 출발점과 논문 1,286편의 근거 목록을 알리고, 3D 디자인 참고 출처를 더했습니다.
  text: 소개에 The Virtual Biotech 연구팀 구조를 벤치마킹해 시작했다고 적고, References에 한컴 노마디안의 공간 구성·디자인을
    참고했다고 명시했다. 점검표 설명에는 분야별 논문 근거 목록 1,286편을 덧붙였다. TSV의 고유 PMID 1,286개와 설정의45분야·135항목을
    대조했으며 한영 README와 References를 함께 맞췄다. 모든 논문 전문의 독해·검증이나 새 기능·실운전 성공을 주장하지 않는다.
