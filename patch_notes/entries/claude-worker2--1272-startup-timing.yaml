- sha: '9e62f82'
  at: 2026-11-06 23:15
  text: "#1272 web_resizable_panels 실패 분석을 집계 문서(ci-1076-flake-tally.md)에 더한다. 60초가 어디에 쓰였는지(Node 시작 19.3초, Chrome 첫 /json 응답 17.6초 등), 같은 시각 WMI도 느렸다는 점, 원인 후보 네 가지와 고칠 범위"
  summary: 실패한 web 시험의 시간이 어디서 사라졌는지 문서로 남깁니다.
- sha: 'c0c2369'
  at: 2026-11-06 23:15
  text: web_resizable_panels 시험이 호출마다 Node 시작·모듈 읽기·openDemo 시점의 남은 시간을 성공해도 한 줄(resizable startup)로 남긴다. 시간 한계와 단언은 바꾸지 않는다. pytest의 warnings 요약(직렬·병렬 모두 CI 로그)에 나오고, 값 계산은 시험 두 개가 확인한다
  summary: 느린 runner의 징후를 실패하기 전에 로그에서 볼 수 있습니다.
- sha: '9b76cb7'
  at: 2026-11-06 23:30
  text: CI 수정. 시작 시간 줄을 fixture 없이 warning으로 남기고(직렬·병렬 모두 CI 로그의 warnings 요약에 보임), test_ci_windows10m이 이 함수만 떼어 돌리는 축소된 namespace에서는 보고를 건너뛴다
  summary: 계약 시험을 깨지 않고 평소 값을 로그에 남깁니다.
- sha: '73a9674'
  at: 2026-11-06 23:47
  text: CI 수정. config/ci/windows-boundary-v1.json의 tests/test_web_3d.py digest를 시작 시간 줄을 더한 파일에 맞춘다
  summary: 고친 시험 파일이 Windows 경계 목록의 검토 기준과 어긋나지 않게 합니다.
- sha: 'e0962e6'
  at: 2026-11-07 00:09
  text: 리뷰 지적 반영. 집계 문서와 status가 시작 시간 줄을 warnings 요약에 남기는 최종 방식(직렬·xdist 모두 CI 로그에서 보임)대로 설명한다
  summary: 평소 값을 어디서 찾는지 문서가 사실대로 말합니다.
- sha: 'f44d6bb'
  at: 2026-11-07 00:30
  text: 집계 문서에 새로 넣은 시작 시간 줄의 첫 CI 값을 적는다. 같은 단계에서 desktop(첫 Node)은 node_start_ms 5521, 바로 뒤 phone은 24라서, 차가운 첫 프로세스만 느린 패턴으로 읽힌다
  summary: 느려지는 곳이 첫 프로세스 기동이라는 첫 증거를 문서에 남깁니다.
