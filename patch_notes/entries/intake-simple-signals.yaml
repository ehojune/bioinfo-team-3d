pr: 498
rows:
  - sha: "b2bf903"
    at: "2026-10-08 09:30"
    text: "메타데이터 표·목록 정리·추출·다운로드는 단순 작업, 분석이 들어가면 연구로 분류하고 직원 직접 지정은 연구 lane 밖으로(PI 점검 R16)."
  - sha: "0f44bbc"
    at: "2026-10-08 09:35"
    text: "예측·관계·비교 같은 추론 표현은 다운로드·메타데이터 요청과 함께여도 연구로, \"분석 없이\"는 연구 신호에서 뺀다(#498 리뷰)."
  - sha: "d4629a6"
    at: "2026-10-08 09:39"
    text: "계산을 시키는 동사(run·돌려·수행·계산·정규화·군집 등)와 DE 약어도 연구 신호로 두어, 다운로드·메타데이터와 함께여도 분석 요청은 연구로 간다(#498 재리뷰)."
