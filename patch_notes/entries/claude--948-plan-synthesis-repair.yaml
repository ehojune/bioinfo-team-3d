rows:
- sha: '9e23f17'
  at: 2026-10-25 03:20
  summary: 계획 검사에서 모델이 한 번 틀려도 요청 전체가 끝나지 않도록 고쳤습니다.
  text: '12차 실제 연구가 CP1 전에 끝난 원인을 고쳤다. (1) synthesis 단계가 있는데 갈래 마지막 단계를 depends_on으로 받지 않으면 검사 전에 labhq가 첫 synthesis 단계에 채우고 계획 warnings에 남긴다(synthesis 단계가 없거나 순환이 되면 고치지 않는다). (2) CSO가 synthesis라는 이름의 갈래를 따로 선언해도 synthesis는 예약 lane이라 그 갈래를 읽어야 할 대상·갈래 밖 의존 금지 대상으로 세지 않는다. 이 선언만으로도 올바른 계획이 거절되던 두 경로를 닫았다. (3) 계획 교정 기회를 1회에서 3회로 늘리고 매 회 남은 문제 원문을 준다(보고 문구도 실제 횟수). 새 테스트 8건과 관련 묶음 979건 통과. 실제 모델이 새 경로로 CP1까지 가는지는 확인하지 않았다.'
