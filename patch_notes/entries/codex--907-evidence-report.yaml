pr: 919
rows:
- sha: db0f1d1
  at: '2026-10-24 07:15'
  summary: 독립적인 승인 근거가 남은 claim에서도 거부 계보의 재인용은 논문 수에서 제외합니다.
  text: report와 결론 논문 집계가 같은 근거별 lookup·CP2·lineage 판정을 공유한다. 승인 근거는 claim을 유지하고 거부 재인용은 집계하지 않는다. 2편 오집계 재현 뒤 1편을 확인했고 관련 pytest 142 passed. Refs #907.
- sha: 49fa428
  at: '2026-10-24 07:10'
  summary: CP2에서 거부한 원출처의 재인용을 결론 근거 논문 수에서 제외합니다.
  text: 결론 논문 수를 계산하는 소비 경로도 claim_rows에 거부 목록을 전달한다. list·generator 입력과 결론 원장 분모를 확인했고 오집계 1 failed 재현 뒤 관련 pytest 78 passed. Refs #907.
- sha: 726b4d0
  at: '2026-10-24 07:02'
  summary: 정리본의 원문 근거에서 내부 자료 단계의 metadata를 제외합니다.
  text: internal/restricted 단계와 하위 단계의 원문 표·각주·근거 링크에 기존 공개 범위를 적용하고 귀속 불명확 시 요청 전체를 제외한다. report에 붙은 기존 표도 다시 만들며 로컬 원본 ledger는 보존한다. 합성 노출 회귀 8 failed→8 passed, 관련 report·portfolio·PDF 107 passed. Refs #907.
- sha: 70ad6c0
  at: '2026-10-24 06:18'
  summary: 예전 형식의 문헌 요약에서 논문 수가 0으로 사라지지 않도록 고쳤습니다.
  text: status가 생략된 source-only 요약을 조회 실패로 처리하지 않는다. 명시한 결과 승인(CP2) 거부·실패 상태·미확정 계보는 계속 차단한다. CI 실패 5건을 로컬에서 재현했고 최신 main의 소비 경로를 포함해 관련 pytest 414 passed로 확인했다. Refs #907.
- sha: 13b2388
  at: '2026-10-24 06:03'
  summary: 근거 표가 보고서와 정리본에 한 번씩 표시되는지 확인합니다.
  text: 논문 형식의 단일 fake 요청에서 논의 아래 하위 heading으로 이동한 원문 근거 표가 원본·정리본·근거 문서에 한 번만 나오는지 검사한다. production 변경 없이 관련 pytest 358 passed로 확인했다. Refs #907.
- sha: f534cdd
  at: '2026-10-24 04:37'
  summary: 보고서에서 주장의 원문 위치와 읽은 범위, 최초 출처를 확인합니다.
  text: 기존 주장·근거 연결과 출처 계보 판정을 재사용해 미해결 주장, 원문 미확보, 재인용과 순환, 보충자료 누락 및 Methods/QC 위치를 표시한다. 결과 승인(CP2)이 거부한 원출처의 재인용은 synthesis와 anchor에서도 차단한다. 단일 fake 요청의 report→portfolio 포함 관련 pytest 358 passed이며 실제 원문 독해 품질은 미검증이다. Refs #907.
