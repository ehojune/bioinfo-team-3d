pr: 1498
rows:
  - sha: 'ef32872'
    at: '2026-11-25 06:16'
    summary: 공유 폴더 없이 간소화 연구 보고서를 조립합니다.
    text: Gateway가 작업 배정과 SHA-256을 대조해 초안과 결과표를 비공개 저장하고 작업 ID로 읽는다. 재개한 세션에 검사한 입력을 넘기고 이전 단계 그림은 본문에서 생략한다.
  - sha: '9d4c75b'
    at: '2026-11-25 03:36'
    summary: 보고서 초안과 결과표를 다른 PC에서도 대조할 수 있게 준비했습니다.
    text: runner가 수집한 UTF-8 파일을 내부 결과에 담기 전에 검사하고, 보고서를 조립할 때 같은 SHA-256을 다시 대조한다.
  - sha: '96c86d0'
    at: '2026-11-25 03:14'
    summary: 재시작 뒤에도 검사한 보고서 초안을 다시 씁니다.
    text: 후속 초안의 해시와 세션을 리뷰 전에 저장하고, 결과 링크를 묶음 경로로 통일한다.
  - sha: '51694f1'
    at: '2026-11-25 03:06'
    summary: 후속 검증과 병렬 분석 결과까지 초안에 반영할 수 있게 했습니다.
    text: 모든 결과가 모인 뒤 원래 분석 세션을 재개하고 승인된 근거를 넘긴다.
  - sha: '8aede87'
    at: '2026-11-25 02:58'
    summary: 초안 회귀시험을 기존 결과 승인 시험 파일로 옮겼습니다.
    text: Windows CI 인벤토리에 등록된 CP2 시험과 함께 실행한다.
  - sha: '6fa58e5'
    at: '2026-11-25 02:53'
    summary: 간소화 연구에서는 분석 세션이 보고서 초안을 씁니다.
    text: 수집한 Markdown의 해시를 대조하고 근거와 결과표를 검사해 보고서를 조립한다. 검사에서 문제가 발견되면 완료로 표시하지 않는다.
