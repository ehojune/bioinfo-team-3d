  at: 2026-10-23 05:27
  summary: 경로 검사 속도 시험이 느린 CI 기계에서 잘못 실패하지 않도록, 절대 시간 대신 입력 크기에 따른 비용 비율로 확인합니다.
  text: 'tests/test_policy.py의 경로 검사 CPU 시험이 PR866 CI(run 39845342493)에서 바뀌지 않은 스캐너로 2.046·2.267초를 써서 2초 예산을 넘겼다. 이제 호출 스레드 CPU(thread_time)로 기존 전체 입력과 같은 구성의 1/4 입력을 각각 0.2초가 쌓일 때까지 측정한다(반복 상한 16·4회). 전체 평균이 1/4 평균의 8배와 시계 한 tick을 넘으면 실패한다. 선형이면 약 4배, 구분자 run마다 다시 훑는 이차 스캔이면 약 16배다. run 뒤 /restricted 경로·file URI 검출과 공개 꼬리 미검출 시험을 더했고, Windows inventory는 test_policy digest와 새 노드만 갱신했다. 정책 코드는 그대로다. 이 비율 계약은 해당 입력에 대한 것이며 모든 입력의 선형성 증명이 아니다.'
