pr: 1152
rows:
- sha: 'f3f63c7'
  at: 2026-10-31 10:40
  text: test_policy의 경로 스캔 선형성 시험이 4배 거리의 두 점이 아니라 세 점(1/4, 1/2, 전체)을 재서 2배 증가마다 비용이 3.2배 이하인지 본다. 선형은 증가마다 약 2배, 제곱은 약 4배라 제곱 비용은 계속 거절된다. 두 점 4배 상한은 Linux 러너에서 8~10배로 반복 실패했다. 시계를 흉내 내는 시험과 inventory의 sha256도 맞췄다
  summary: Linux CI에서 반복되던 test_policy 선형성 시험의 간헐 실패를 줄입니다. 제곱 비용을 잡는 힘은 유지합니다.
- sha: '2af76b1'
  at: 2026-10-31 11:10
  text: 선형성 시험이 4배 구간 전체(1/4에서 전체까지)에도 시계 여유를 한 번만 더해 3.2의 제곱 이하인지 본다. 단계마다 여유를 더하면 4, 16, 64 ms로 제곱해 가는 비용이 통과했다. 그 예시가 거절되고 단계당 3배는 통과하는 시험을 더하고 inventory sha256을 맞췄다
  summary: 리뷰 P1 반영으로 단계마다 시계 여유가 쌓여 제곱 비용이 통과하던 틈을 닫습니다.
