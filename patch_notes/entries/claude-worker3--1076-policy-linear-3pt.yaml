rows:
- sha: 'f3f63c7'
  at: 2026-10-31 10:40
  text: test_policy의 경로 스캔 선형성 시험이 4배 거리의 두 점이 아니라 세 점(1/4, 1/2, 전체)을 재서 2배 증가마다 비용이 3.2배 이하인지 본다. 선형은 증가마다 약 2배, 제곱은 약 4배라 제곱 비용은 계속 거절된다. 두 점 4배 상한은 Linux 러너에서 8~10배로 반복 실패했다. 시계를 흉내 내는 시험과 inventory의 sha256도 맞췄다
  summary: Linux CI에서 반복되던 test_policy 선형성 시험의 간헐 실패를 줄입니다. 제곱 비용을 잡는 힘은 유지합니다.
