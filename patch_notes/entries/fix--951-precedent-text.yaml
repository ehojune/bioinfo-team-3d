rows:
- sha: 608d819
  at: 2026-10-25 04:10
  text: 선행 조사가 저장한 본문(fulltext receipt)을 hash·receipt 검사 뒤 연구 단계의 읽기 전용 inputs/precedent/로 복사하고, 단계에는 조회 전에 먼저 읽으라고 안내하며, 보고서 작성자에게는 요청 전체의 저장 본문 목록을 주어 단계 수준 공백과 요청 전체 자료 없음을 구분하게 한다(#951).
  summary: 선행 조사가 저장한 논문 본문을 연구 단계가 바로 열어 읽을 수 있게 하고, 한 단계가 못 읽은 것을 요청 전체에 자료가 없다고 쓰지 않게 했습니다.
