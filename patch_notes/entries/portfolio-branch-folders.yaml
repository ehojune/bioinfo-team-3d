pr: 705
rows:
- sha: b5b0351
  at: 2026-10-17 02:28
  text: 갈래 계획의 단계 산출물을 갈래별 폴더로 분리하고 실패 갈래도 정리본 목차에 남겼다
  summary: 갈래별 결과물을 폴더로 나누고 실패한 갈래도 정리본 목차에 표시합니다.
- sha: 2bae4fa
  at: 2026-10-17 03:25
  text: 모든 갈래를 읽는 최종 종합 단계 중 의존 순서상 마지막 원고를 과학 보고서로 골랐다
  summary: 모든 연구 갈래를 읽은 마지막 종합 원고를 최종 과학 보고서로 고릅니다.
- sha: 7ae9cab
  at: 2026-10-17 03:32
  text: terminal별 성공 여부로 갈래 상태를 나누고 부분 성공의 결과와 실패 이유를 함께 남겼다
  summary: 일부 갈래만 성공해도 그 결과와 실패 이유를 함께 보여 줍니다.
- sha: ce6247d
  at: 2026-10-17 03:44
  text: 검토 완료 원고를 우선하고 선언된 갈래 보고서와 갈래 상태를 정리본에 보존
  summary: 검토가 끝난 원고를 우선 쓰고 각 연구 갈래의 보고서와 상태를 정리본에 남깁니다.
