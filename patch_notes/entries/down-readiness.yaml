  - sha: "52e2970"
    at: "2026-10-12 01:27"
    text: "labhq down이 끝난 요청의 이어 묻기나 진행 중인 채용이 있으면 --force 없이 종료하지 않는다(gateway /api/shutdown-readiness, #500)."
  - sha: "6c0035f"
    at: "2026-10-12 01:27"
    text: "manual의 down 거부 조건에 이어 묻기·채용을 넣었다."
  - sha: "f8d35c1"
    at: "2026-10-12 01:34"
    text: "labhq down이 readiness 조회 실패(404 외)에는 종료를 거부하고, readiness 응답의 요청도 판정에 넣으며, 채용 수를 runner에 보내기 전에 센다(#515 리뷰)."
  - sha: "6d6eb37"
    at: "2026-10-12 01:38"
    text: "채용 수를 runner 프로세스 단위로 세어 같은 프로세스의 재연결에는 지우지 않고, 보내기 실패에도 되돌리지 않는다(#515 리뷰)."
