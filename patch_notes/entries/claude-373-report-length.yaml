- sha: 0b4bfab
  at: 2026-10-06 11:19
  text: 보고서 본문의 리뷰 참고가 제목 수준과 상관없이 한 번만 나오고 P3는 건수만 적는다. 보고서 프롬프트에 분량 기준(본문 약 4,000자, 수치는 결과에 한 번)을 넣었다.
  summary: 보고서의 검토 참고 중복을 없애고 본문 분량과 결과 수치 반복을 줄이는 기준을 넣었습니다.
- sha: 6e88a89
  at: 2026-10-06 11:24
  text: 연구 lane 보고서도 남은 P2·P3 지적 원문을 실행 기록에 두고, "수치는 한 번"을 결과 통계로 한정했다(seed·버전은 방법 요약에 그대로, 리뷰 반영).
  summary: 남은 검토 지적 원문은 실행 기록에 두고 방법의 실행 조건·판본 정보는 계속 적게 했습니다.
