mock_answer: |
  # KRAS G12C
  PDB 6OIM과 sotorasib CHEMBL4535757를 확인했다. 비교군은 adagrasib CHEMBL4594350,
  olomorasib CHEMBL6068410이다. assay 조건과 단위가 다르면 IC50를 직접 비교하지 않는다.
