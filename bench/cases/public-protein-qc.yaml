order: 4
id: public-protein-qc
title: 소형 공개 UniProt manifest QC
request: >-
  제공한 공개 단백질 manifest를 QC하라. 행 수, unique accession 수, 중복 accession,
  길이의 양수 여부를 보고하고 외부 다운로드는 하지 않는다.
references:
  - label: UniProt manifest excerpt
    path: references/protein-manifest.tsv
    source: https://www.uniprot.org/
scripted_pi_answers:
  - question_contains: 중복
    answer: 중복은 제거하지 말고 원본 4행과 unique 3개를 함께 보고한다.
check:
  script: checks/contains_terms.py
  args:
    - 'num:4:(?<![\w.,+-])(?:(?:행\s*수|rows?(?:\s*count)?)[^\d\n.;]{0,20}(?=[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)|(?=[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?\s*(?:행|rows?|records?)))(?<![A-Za-z0-9_.,+-])(?P<value>[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)(?!\d|[.,]\d)\s*(?:행|rows?|records?)?'
    - 'num:3:(?<![\w.,+-])(?:(?:unique(?:\s*accessions?)?|고유(?:\s*accession)?)[^\d\n.;]{0,20}(?=[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)|(?=[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?\s*(?:(?:개\s*)?(?:unique\s*accessions?|고유\s*accession))))(?<![A-Za-z0-9_.,+-])(?P<value>[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)(?!\d|[.,]\d)\s*(?:(?:개\s*)?(?:unique\s*accessions?|고유\s*accession))?'
    - 're:(?<![A-Za-z0-9_])P01116(?![A-Za-z0-9_])[^\n.;]{0,25}(?:중복|duplicat)|(?:중복|duplicat)[^\n.;]{0,25}(?<![A-Za-z0-9_])P01116(?![A-Za-z0-9_])'
    - 'num:1863:(?:BRCA1(?:_HUMAN)?|(?:최대|가장\s*긴|maximum|max|longest))[^\d\n.;]{0,25}(?<![A-Za-z0-9_.,+-])(?P<value>[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)(?!\d|[.,]\d)\s*(?:aa|amino\s*acids?)?'
    - 're:(?:모든\s*길이|길이(?:는|가)?\s*모두)[^\n.;]{0,15}(?:양수|0\s*초과)|(?:all\s*(?:declared\s*)?lengths?\s*(?:are\s*)?(?:positive|>\s*0))'
budget_usd: 0.5
mock_answer: |
  # 공개 단백질 manifest QC
  원본은 4행이고 unique 3 accession이다. P01116이 중복이며 모든 길이는 양수다.
  가장 긴 선언값은 BRCA1_HUMAN의 1863 aa다.
