order: 2
id: plastome-structure
title: 엽록체 RefSeq 구조 검증 계획
request: >-
  고정 RefSeq 표를 이용해 Brassicaceae plastome 비교를 설계하라. accession·길이·종 이름을 보존하고,
  quadripartite 구조와 IR 경계 검증 방법 및 예상 범위를 적어라. 실제 조립은 실행하지 않는다.
references:
  - label: RefSeq plastome snapshot
    path: references/plastome.tsv
    source: https://www.ncbi.nlm.nih.gov/nuccore/NC_000932.1
scripted_pi_answers:
  - question_contains: 조립
    answer: 새 조립은 하지 말고 RefSeq 비교와 검증 계획까지만 작성한다.
check:
  script: checks/contains_terms.py
  args: [NC_000932.1, "154478", NC_040849.1, "153483", "25–27 kb", "17–18 kb"]
budget_usd: 1.5
mock_answer: |
  # Plastome 비교
  NC_000932.1은 154478 bp, NC_040849.1은 153483 bp다. accession과 종 이름을 먼저 대조한다.
  quadripartite 구조에서 IR은 25–27 kb, SSC는 17–18 kb 범위를 예상하고 경계를 별도 계산한다.
