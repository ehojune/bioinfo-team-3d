queries:
  # ---------- 재사용 소비자 (1–6, 13) ----------
  q01:
    ask: "raw_counts.tsv 확보 기록을 D 판본별로"
    rules: [scope, hash]
    call: {consumer: find_reusable, key: outputs/raw_counts.tsv}
    answer:
      selected: [*A1, *A6]          # A1은 D1(r1), A6은 D2(r2)에서. 같은 hash(h1)여도 둘 다 낸다
      excluded_unknown: []
      candidates:
        *A1 : {match: {key: "yes"}, recommend: true}
        *A6 : {match: {key: "yes"}, recommend: true}
  q02:
    ask: "Q2가 재사용한 artifact와 생성 run"
    rules: [reuse, gen, cite]
    call: {consumer: find_reusable, used_by_request: req_q2}
    answer:
      selected: [*A2]               # R3가 declared로 쓴 다른 요청 산출물. 생성 R2w(req_q1). A3는 인용(e23)이라 use가 아니다. A5→R3f는 같은 요청
      excluded_unknown: []
      candidates:
        *A2 : {match: {used_by_request: "yes"}, recommend: true}
  q03:
    ask: "A6은 A1의 재사용인가 (raw_counts.tsv 중 D1에서 나온 것)"
    rules: [hash, reuse]
    call: {consumer: find_reusable, key: outputs/raw_counts.tsv, derived_from: *D1}
    answer:
      selected: [*A1]               # A6은 R4가 D2만 선언해 no. 같은 내용은 same_content_as 단서뿐이고 A1의 use에 R4는 없다
      excluded_unknown: []
      candidates:
        *A1 : {match: {key: "yes", derived_from: "yes"}, recommend: true}
  q04:
    ask: "single_cell_de@2로 D1(r1)에서 낸 결과"
    rules: [method, unknown]
    call: {consumer: find_reusable, method: single_cell_de@2, derived_from: *D1}
    answer:
      selected: [*A5, *A5f]         # A2·A3는 @1, A6·A7은 D2 계보, Q4 산출물은 pack 없음
      excluded_unknown: [*A8, *Q4qc]   # 생성 run이 unknown이라 method·계보를 판정할 수 없다
      candidates:
        *A5 : {match: {method: "yes", derived_from: "yes"}, recommend: true}
        *A5f : {match: {method: "yes", derived_from: "yes"}, recommend: true}
        *A8 : {match: {method: unknown, derived_from: unknown}, recommend: false}
        *Q4qc : {match: {method: unknown, derived_from: unknown}, recommend: false}
  q05:
    ask: "scan_extra.tsv(A8) 재사용 후보"
    rules: [unknown, gen]
    call: {consumer: find_reusable, key: outputs/scan_extra.tsv}
    answer:
      selected: [*A8]               # 후보로 내되 generated_by·sha256 unknown이라 권고하지 않는다. R5 workspace라고 R5로 채우지 않는다
      excluded_unknown: []
      candidates:
        *A8 : {match: {key: "yes"}, recommend: false}
  q06:
    ask: "A2를 raw_counts 입력으로 쓸 수 있나"
    rules: [type]
    call: {consumer: find_reusable, key: outputs/norm_counts.tsv, data_type: raw_counts}
    answer:
      selected: [*A2]               # Q1 pack count_scale=raw_counts는 계획 조건이라 A2 타입이 아니다. 판정 unknown
      excluded_unknown: []
      candidates:
        *A2 : {match: {key: "yes", data_type: unknown}, recommend: false}
  # ---------- 감사 소비자 (7–12) ----------
  q07:
    ask: "A3를 보고한 run"
    rules: [gen, resume, wake]
    call: {consumer: audit_lineage, artifact: *A3}
    answer:
      edges: [e01, e02, e03, e04, e08, e09, e10, e11, e12, e14]   # 생성 R2w. R2w는 R2를 resume·wake했지만 R2와 같은 run이 아니다
      cites: []
      gaps: []
      cautions: []
  q08:
    ask: "Q1 de step의 run 수와 재시도 수"
    rules: [retry, resume, wake, runmeta]
    call: {consumer: audit_lineage, step: req_q1/de}
    answer:
      runs: [*R2, *R2w]
      run_count: 2
      retry_count: 0                # R2w는 attempt 1의 wake다. resume·wake는 재시도가 아니다
      resumes: [e11]
      wake_of: [e12]
  q09:
    ask: "K2@1 지지 근거의 원자료"
    rules: [indep, cite, traverse]
    call: {consumer: audit_lineage, claim: *K2}
    answer:
      edges: [e01, e02, e03, e04, e08, e09, e10, e11, e12, e13, e14, e17, e18, e19, e20, e21, e22, e24, e25]
      cites: [e23]                  # R3가 A3를 인용. 계보로 따라가지 않고 여기만 싣는다
      gaps: []
      bears_on: {supports: [*E1r, *E2], contradicts: [], context: []}
      shared_ancestors:
      - {evidence: [*E1r, *E2], nodes: [*A1, *D1]}
      independent_groups: [g_q1_de, g_q2_de]   # #115 판정 그대로. 공통 조상은 검토 단서일 뿐 자동 판정이 아니다
      cautions:
      - {code: shared_ancestor_review, evidence: [*E1r, *E2], nodes: [*A1, *D1]}
  q10:
    ask: "E3가 K3를 지지하나"
    rules: [support, cite]
    call: {consumer: audit_lineage, claim: *K3}
    answer:
      edges: [e30, e31, e32, e33, e34, e35, e36, e37, e38, e39, e40, e43, e44, e45]
      cites: [e41, e42]
      gaps:
      - {node: *A8, field: generated_by, reason: no_reported_output, basis: reported}
      - {node: *A8, field: sha256, reason: not_observed, basis: reported}
      bears_on: {supports: [*E4, *E5], contradicts: [], context: [*E3]}   # E3은 context라 지지가 아니다
      shared_ancestors: []          # E4 계보가 A8에서 끊겨 있다. 빈 목록이 독립의 증거는 아니다
      independent_groups: [g_q3_extra, g_q3_scan]
      cautions: []
  q11:
    ask: "E4의 계보"
    rules: [unknown, gen]
    call: {consumer: audit_lineage, evidence: *E4}
    answer:
      edges: [e39]                  # A8을 보고한 run이 없어 여기서 멈춘다
      cites: []
      gaps:
      - {node: *A8, field: generated_by, reason: no_reported_output, basis: reported}
      - {node: *A8, field: sha256, reason: not_observed, basis: reported}
      cautions: []
  q12:
    ask: "R5 직원이 이 방법에 검증됐나"
    rules: [probe]
    call: {consumer: audit_lineage, run: *R5}
    answer:
      edges: [e30, e31, e32, e33, e34, e35, e36]
      cites: [e41, e42]
      gaps: []
      cautions: []
      agent_verification: {agent: *ag_seqtool, contract_status: active, verification_scope: connection_only,
                           method_validation: not_established}   # probe_tools는 연결 확인뿐
  # ---------- Q4 반례 (13–17) ----------
  q13:
