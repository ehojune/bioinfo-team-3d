      selected: [*Q4qc]             # 실패한 1차·재시도·wake가 모두 보고했다. 생성 run unknown, 후보 셋. hash가 하나여도 생성자를 정하지 않는다
      excluded_unknown: []
      candidates:
        *Q4qc : {match: {key: "yes"}, recommend: false}
  q14:
    ask: "task_q4qc2는 재시도인가 재개인가"
    rules: [retry, resume, runmeta]
    call: {consumer: audit_lineage, run: *Q4a2}
    answer:
      edges: [e50, e51, e52, e53]   # 둘 다다. attempt 2(SQLite)라 retry, resume_of로 Q4a1을 resume. manifest 최상위 task는 attempt 1이라 쓰면 틀린다
      cites: []
      gaps: []
      cautions: []
      agent_verification: {agent: *ag_scde, contract_status: none, verification_scope: unknown,
                           method_validation: not_established, unknown: {verification_scope: no_contract_record}}
  q15:
