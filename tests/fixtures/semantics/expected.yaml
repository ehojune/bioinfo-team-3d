# 의미 규칙. 질의마다 rules에 여기 id를 적는다. 독립 결함 유형은 이 id 단위로 센다.
rules:
  gen: "result.outputs는 reported_output이다. 같은 workspace·경로를 보고한 run이 하나면 generated_by, 둘 이상이면 unknown(multiple_reporters)+후보, 없으면 unknown(no_reported_output). daemon은 이미 있는 선언 파일도 outputs에 넣는다(labhq/runner/daemon.py)"
  reuse: "use는 plan step input_refs(declared)에서만 나온다. artifact를 보고한 요청이 사용 run과 다르면 reused_cross_request, 같으면 same_request(재사용 아님), 보고한 run이 없으면 unknown(no_reported_output)"
  resume: "resumes는 resume_of(manifest runs[t].resume_of, 없으면 payload.resume_session_id)가 같은 workspace에서 먼저 시작한(started_at: manifest runs, 없으면 result.provenance.runs) 다른 run 하나의 session_id와 같을 때만. resume은 같은 run이 아니다"
  session: "그런 run이 둘 이상이면 resumes unknown(shared_session)+후보, caution resume_parent_ambiguous"
  retry: "retry = SQLite task.attempt > 1. resume 여부와 따로 판정한다. 재시도도 이전 session을 resume한다(labhq/orchestrator/cso.py)"
  wake: "wake_of = SQLite task.parent_task, 부모 run 결과에 pending_jobs·pending_asks가 있을 때. wake task의 meta.kind는 원래 kind를 물려받아(cso.py run_step) wake를 가리키지 않는다"
  runmeta: "attempt·revision·kind·parent_task는 task_id로 SQLite task 행에서 읽는다. manifest 최상위 task는 첫 task뿐이다(labhq/runner/workspace.py). agent_spec_sha256은 manifest에만 있어 없으면 unknown(manifest_missing). session_id·resume_of는 SQLite 행(result.session_id, payload.resume_session_id)에도 있어 manifest가 없어도 읽는다"
  cite: "evidence.source → refers_to. run 결과의 evidence가 그 run이 보고하지 않은 대상을 가리키면 cites(basis cited). 계보 순회는 cites를 넘지 않는다"
  support: "bears_on 값은 links.relation 그대로다. context는 지지가 아니다"
  scope: "ID는 conventions.ids 범위를 따른다. 같은 claim id·evidence id·artifact_id·경로라도 범위가 다르면 다른 개체. 누락값끼리 같다고 하지 않는다(sha256 unknown끼리 same_content 아님)"
  hash: "observed[ws]의 철자를 normalize_artifact_path로 모아 hash가 둘 이상이면 sha256 unknown(multiple_hashes)+후보. 같은 hash는 same_content_as만 채우고 개체·run·판본을 합치지 않는다"
  unknown: "원천 칸이 없거나 풀리지 않으면 unknown+reason. 같은 폴더·가까운 run·같은 agent의 다른 기록으로 채우지 않는다"
  type: "v1에는 artifact별 자료 의미 칸이 없어 data_type unknown(no_data_type_source). pack 값(count_scale)·broader로 채우지 않는다. 변경 2 뒤에는 생성 run의 declared output_types만 쓴다. 생성 run이 unknown이면 generator_unknown, 선언이 없으면 not_declared"
  probe: "contract.verification.probe_tools는 연결 확인(connection_only)이다. method_validation은 not_established"
  method: "run의 method = research_contract.plan_sha256 # step_id, packs = plan.protocol.packs. 생성 run이 unknown이면 method도 unknown(generator_unknown)"
  traverse: "claim→bears_on→evidence→refers_to→artifact→(보고 run이 하나면) run→used→… 를 방문 집합·깊이 64로 따른다. performs·uses_method·resumes·wake_of는 edge로 싣고 넘어가지 않는다. means는 싣지 않는다. cites는 cites 칸에만 싣는다. 보고 run이 여럿이면 그 reported_output edge만 싣고 멈춘다. cycle은 caution(이 fixture엔 없음)"
  indep: "공통 조상(shared_ancestors)은 검토 단서다(caution shared_ancestor_review). 독립성 값은 #115 labhq.evidence.claims.independent_groups 결과를 그대로 싣는다"

# 설계 문서와 다르게 적은 곳. 독립 검토에서 확인할 것.
design_deviations:
  - "wake: 설계 표는 'wake=kind'. 코드에서 wake task는 meta.kind를 물려받아 kind=step이다. parent_task와 부모 결과의 pending_jobs로 판정한다(rule wake)"
  - "manifest 누락: 설계는 session·resume도 unknown이라 했다. SQLite task 행에 result.session_id·payload.resume_session_id가 있어 known으로 두고 agent_spec_sha256만 unknown이다(rule runmeta, 질의 16)"
  - "Q2: 설계의 리뷰 revision R3r→A5r 대신 같은 요청의 다음 step(filter, R3f→A5f)을 쓴다. 실제 revision은 같은 workspace에서 같은 선언 경로를 다시 보고하므로 A5r이 따로 생기지 않는다. 그 모양은 Q4 질의 13이 맡는다"
  - "input_refs의 세 꼴(conventions.input_refs)은 fixture 규약이다. 현 schema는 자유 문자열이다"
not_in_this_commit: ["reader 오류용 반례", "성능용 cycle fixture와 50× 복제", "EXPECTED_SHA256·fixture hash 상수"]

reasons:
  unknown: [multiple_reporters, no_reported_output, not_observed, multiple_hashes, manifest_missing, shared_session,
            no_data_type_source, not_declared, generator_unknown, no_contract_record, unresolved_input_ref]
  cautions: [shared_ancestor_review, resume_parent_ambiguous, cycle, depth_limit]
  reuse_kind: [reused_cross_request, same_request, reused_same_request, unknown]   # reused_same_request는 변경 1 뒤에만
  basis: [reported, declared, cited, none]                                       # none: 그런 칸이 어느 원천에도 없음

interface:   # A·B가 같은 꼴로 낸다. 정답 비교는 아래 queries.answer 꼴로 정규화해서 한다
  find_reusable:
    selectors: "key(path 일치), method(pack id@version), derived_from(조상 artifact·external id), used_by_request(그 요청 run의 재사용 use)"
    selector_values: "yes|no|unknown. 모두 yes → selected, 하나라도 no → 제외, no 없이 unknown → excluded_unknown"
    check: "data_type은 걸러내지 않고 match.data_type(yes|no|unknown)만 낸다. 요청하지 않으면 match에 없다"
    derived_from: "generated_by→used를 따라 대상에 닿으면 yes. 닿지 않고 도중에 generated_by unknown·풀리지 않은 used가 있으면 unknown, 아니면 no. cites는 넘지 않는다"
    candidate: "nodes.artifacts의 그 행 + uses(nodes.uses에서 그 artifact 행) + match + recommend"
    recommend: "generated_by·sha256이 known이고 모든 selector가 yes이며 match.data_type이 없거나 yes일 때만 true"
  audit_lineage:
    roots: "claim | evidence | artifact | run | step(<request_id>/<step_id>)"
    answer: "edges(traverse로 닿은 edge id), cites, gaps(닿은 artifact의 generated_by·sha256, 닿은 run의 agent_spec_sha256·resumes), cautions, claim 루트는 bears_on·shared_ancestors·independent_groups, run 루트는 agent_verification"
    shared_ancestors: "supports·contradicts로 걸린 evidence 쌍마다 양쪽 계보에 다 있는 artifact·external_source. evidence가 하나면 []"
  agreement: "소비자 불일치는 find_reusable()(selector 없음, 12개 전부)의 후보와 audit_lineage(artifact=각각)·audit_lineage(run=각각)의 루트 칸을 nodes와 대조해 센다: generated_by(+reason), sha256(+reason), use별 reuse_kind"

