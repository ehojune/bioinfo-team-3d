# 출처·재사용 의미 모델 pilot의 기대 답 (#127). 구현보다 먼저, 아래 규칙에서 손으로 적었다.
# 모든 기록은 합성이다. 실제 요청 기록을 복사하지 않았다.
# 독립 검토 1회 뒤 EXPECTED_SHA256으로 고정한다. 그 뒤 수정은 사유를 적은 별도 커밋(보정 1회)뿐이다.
schema: semantics-expected/1
synthetic: true
issue: 127
records: records/

conventions:
  ids:
    run: "run:<workdir_id>/<task_id>"                      # workspace 하나에 run 여럿(재시도·wake)
    artifact: "art:<request_id>/<workdir_id>/<path>"       # path는 normalize_artifact_path 결과
    external_source: "ext:<scheme>:<normalize_id 값>[@<version>]"   # DOI URI는 doi:<값>
    claim: "claim:<request_id>/<claim id>@<revision>"
    evidence: "ev:<workdir_id>/<task_id>/<evidence id>"    # ResearchResult를 실은 run 범위
    method: "method:<research_contract.plan_sha256>#<step_id>"
    agent: "agent:<agent_id>"
    data_type: "type:<name>"
  sources:
    state: "records/state_rows.json. gateway SQLite state(kind, key, body) 행. test가 임시 DB로 옮겨 mode=ro로 연다"
    manifest: "records/<result.workdir>/manifest.json. 없으면 manifest_missing"
    observed: "records/observed.json. workdir_id별 경로 철자 → sha256 (verify_sources의 observed_artifacts)"
    registry: "records/agents/contract/<agent_id>.yaml (contract 직원만)"
    overlay2: "records/change2_overlay.json. 변경 2에서만 payload.meta.output_types로 합친다"
  row_notation: "state.task[<task_id>].<body 경로> · state.request[<rid>].<경로> · manifest[<workdir_id>].<경로> · observed[<workdir_id>][\"<철자>\"] · registry[<agent_id>].<경로> · overlay2[<task_id>].<경로>"
  input_refs:   # plan schema는 input_refs를 자유 문자열로 둔다. fixture가 쓰는 세 꼴만 푼다
    external: "<scheme>:<value>@<version> → external_source"
    same_request_step: "step:<step_id>/<path> → 같은 요청 그 step의 run들이 쓴 workspace가 하나일 때 그 artifact"
    artifact: "art:<request_id>/<workdir_id>/<path> → 그 요청의 run이 쓴 workspace일 때 그 artifact"
    otherwise: "used dst unknown(unresolved_input_ref). 이 fixture에는 없다"
  evidence_artifact: "artifact_refs[artifact_id].path를 기록한 run의 result.workdir 기준으로 풀어 알려진 workspace 안의 경로가 되면 그 artifact"
  ordering: "id 목록은 문자열 정렬, edge 목록은 edge id 정렬, gap은 (node, field) 정렬"
  unknown: "값 자리에 unknown, 이유는 unknown.<field>, 후보가 있으면 candidates.<field>"
  field_basis:   # 칸마다 그 사실을 어디서 아는지. unknown이어도 basis는 같다
    generated_by: reported
    sha256: reported
    resumes: reported
    wake_of: reported
    agent_spec_sha256: reported
    session_id: reported
    method: declared
    generator_inputs: declared
    reuse_kind: declared
    data_type: {base: none, change2: declared}
    verification_scope: reported

