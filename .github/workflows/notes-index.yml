name: notes-index

on:
  push:
    branches: [main]
    paths:
      - 'patch_notes/entries/**'
      - 'docs/status/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/notes_index.py --write
      - name: Commit generated indexes
        run: |
          if git diff --quiet -- STATUS.md patch_notes/README.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add STATUS.md patch_notes/README.md
          git commit -m "패치노트·STATUS 목차 갱신"
          # GITHUB_TOKEN으로 push한 커밋은 다른 workflow를 다시 실행하지 않는다.
          git push
