name: Clean install WMI diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-install-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing clean install gate with bounded failure journal
        run: python scripts/clean_install_check.py
