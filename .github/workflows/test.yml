name: test

on:
  push:
    branches: [main]  # PR branches run once, via pull_request (PI 2026-10-02: no duplicate runs)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # same-repository run, job and manifest evidence; never execute artifacts

jobs:
  changes:
    # Fail closed: prose-only documents or a complete, trusted, identical-tree PR result (#788).
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_skip.py >> "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: identity
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --durations=15  # the 15 slowest tests, to find what to speed up

  pytest-windows:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: windows-latest
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: identity
        shell: bash
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --durations=15  # the 15 slowest tests, to find what to speed up

  clean-install:
    # Separate Windows rehearsal: a fresh clone/venv, mock request, bundle, verify, and cleanup.
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: windows-latest
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - id: identity
        shell: bash
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/clean_install_check.py

  ro-crate-validator:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
    env:
      LABHQ_ROCRATE_VALIDATOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: identity
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # CI-only validator: roc-validator 0.12.2 is Apache-2.0; --offline forbids profile/context lookups.
      - run: pip install -e ".[dev]" roc-validator==0.12.2
      - run: pytest -q tests/test_request_bundle.py -k official_ro_crate_validator

  pytest-slow:
    # The real 90 s MCP call (#276) runs here, beside the suite, so a wall-clock timeout regression fails CI (#308).
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
    env:
      LABHQ_SLOW_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: identity
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_long_mcp_call.py

  readme:
    # README/document and record validators still run for documents and reused results.
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_integrations.py
      - run: python scripts/integrations.py --check
      - run: python scripts/notes_index.py --validate
      - run: bash scripts/check_public.sh

  patch-notes:
    # PI 결정(2026-10-01): 커밋마다 패치노트 한 줄, main 커밋 3개 안에 README나 docs/manual.md 갱신.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/patch_notes.py check --base origin/${{ github.base_ref }} --head HEAD
      - run: pip install pyyaml && python scripts/notes_index.py --validate  # the generator on main must not fail after merge

  validation-manifest:
    # Only a fresh full PR run can produce reusable evidence; no reuse chains.
    needs: [changes, pytest, pytest-windows, clean-install, ro-crate-validator, pytest-slow, readme, patch-notes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/ci_skip.py manifest
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-full-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-result.json
          if-no-files-found: error
          retention-days: 7
