name: test

on:
  push:
    branches: [main]  # PR branches run once, via pull_request (PI 2026-10-02: no duplicate runs)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read  # ci_skip.py reads the earlier commit's pytest results

jobs:
  changes:
    # A push that only adds patch notes or resolves STATUS/patch_notes conflicts does not rerun pytest (PI 2026-10-02).
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      readme: ${{ steps.check.outputs.readme }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base branch history decides whether a merge came from it
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_skip.py "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - if: matrix.python-version != '3.10'
        run: pytest -q --durations=15  # the 15 slowest tests, to find what to speed up
      - name: Pytest 3.10 with bounded stall diagnostics
        if: matrix.python-version == '3.10'
        timeout-minutes: 25  # Normal rerun: 13m47s; allow 11m13s headroom (Refs #786).
        run: |
          python -u - <<'PY'
          import asyncio
          import faulthandler
          import gc
          import os
          import threading
          import pytest

          class StallDiagnostics:
              def __init__(self, stream):
                  self.stream = stream
                  self.context = "collection"
                  self.stop = threading.Event()
                  self.worker = None

              def pytest_sessionstart(self):
                  self.worker = threading.Thread(target=self.watch, name="ci-stall-diagnostics", daemon=True)
                  self.worker.start()

              def pytest_runtest_logstart(self, nodeid, location):
                  self.context = f"{nodeid} [setup]"

              def pytest_runtest_logreport(self, report):
                  self.context = f"{report.nodeid} [after {report.when}]"

              def pytest_sessionfinish(self):
                  self.stop.set()
                  if self.worker is not None:
                      self.worker.join(timeout=1)

              def watch(self):
                  while not self.stop.wait(300):
                      try:
                          print(f"\nCI snapshot: {self.context}", file=self.stream, flush=True)
                          faulthandler.dump_traceback(file=self.stream, all_threads=True)
                          shown = 0
                          for value in gc.get_objects():
                              if isinstance(value, asyncio.Task) and not value.done():
                                  if shown == 50:
                                      print("Further pending tasks omitted", file=self.stream)
                                      break
                                  value.print_stack(limit=20, file=self.stream)
                                  shown += 1
                          print(f"Pending task stacks shown: {shown}", file=self.stream, flush=True)
                      except Exception as error:
                          print(f"CI snapshot failed: {type(error).__name__}", file=self.stream, flush=True)

          if __name__ == "__main__":
              # Duplicate stderr before pytest redirects fd 2: snapshots must survive a hung captured test.
              stream = os.fdopen(os.dup(2), "w", buffering=1)
              raise SystemExit(pytest.main(
                  ["-vv", "--durations=15", "-o", "faulthandler_timeout=300"],
                  plugins=[StallDiagnostics(stream)]))
          PY

  pytest-windows:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --durations=15  # the 15 slowest tests, to find what to speed up

  clean-install:
    # Separate Windows rehearsal: a fresh clone/venv, mock request, bundle, verify, and cleanup.
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/clean_install_check.py

  ro-crate-validator:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      LABHQ_ROCRATE_VALIDATOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # CI-only validator: roc-validator 0.12.2 is Apache-2.0; --offline forbids profile/context lookups.
      - run: pip install -e ".[dev]" roc-validator==0.12.2
      - run: pytest -q tests/test_request_bundle.py -k official_ro_crate_validator

  pytest-slow:
    # The real 90 s MCP call (#276) runs here, beside the suite, so a wall-clock timeout regression fails CI (#308).
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      LABHQ_SLOW_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_long_mcp_call.py

  readme:
    # Full suite skipped but README.md changed: run the one file that reads it (PI 2026-10-02).
    needs: changes
    if: needs.changes.outputs.skip == 'true' && needs.changes.outputs.readme == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_integrations.py

  patch-notes:
    # PI 결정(2026-10-01): 커밋마다 패치노트 한 줄, main 커밋 3개 안에 README나 docs/manual.md 갱신.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/patch_notes.py check --base origin/${{ github.base_ref }} --head HEAD
      - run: pip install pyyaml && python scripts/notes_index.py --validate  # the generator on main must not fail after merge
