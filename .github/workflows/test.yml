name: test

on:
  push:
    branches: [main]  # PR branches run once, via pull_request (PI 2026-10-02: no duplicate runs)
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'  # nightly full Windows; UTC

permissions:
  contents: read
  actions: read  # same-repository run, job and manifest evidence; never execute artifacts

concurrency:
  # PR heads supersede only their own workflow. Unique non-PR groups also avoid pending-run cancellation.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Fail closed: prose-only documents or a complete, trusted, identical-tree PR result (#788).
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml 'markdown-it-py>=3.0'
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_skip.py >> "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      CI_JOB_LABEL: pytest (${{ matrix.python-version }})
      PYTHONHASHSEED: '0'
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
      profile: ${{ steps.identity.outputs.profile }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Record CI setup start
        env:
          CI_ARTIFACT_ROOT: ${{ runner.temp }}/ci-linux-${{ matrix.python-version }}
        run: python -c "import os,time; print('CI_SETUP_STARTED='+str(time.time())+'\nCI_SUITE_ARTIFACT_DIR='+os.environ['CI_ARTIFACT_ROOT'], file=open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8'))"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: identity
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "profile=linux-full-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - if: matrix.python-version != '3.10'
        run: pytest -q --durations=15 -n auto --dist loadfile -p scripts.ci_suite --ci-profile linux-full-v1
      - name: Pytest 3.10 with bounded stall diagnostics
        if: matrix.python-version == '3.10'
        timeout-minutes: 25  # Normal rerun: 13m47s; allow 11m13s headroom (Refs #786).
        run: |
          python -u - <<'PY'
          import asyncio
          import faulthandler
          import gc
          import os
          import threading
          import pytest

          class StallDiagnostics:
              def __init__(self, stream):
                  self.stream = stream
                  self.context = "collection"
                  self.stop = threading.Event()
                  self.worker = None

              def pytest_sessionstart(self):
                  self.worker = threading.Thread(target=self.watch, name="ci-stall-diagnostics", daemon=True)
                  self.worker.start()

              def pytest_runtest_logstart(self, nodeid, location):
                  self.context = f"{nodeid} [setup]"

              def pytest_runtest_logreport(self, report):
                  self.context = f"{report.nodeid} [after {report.when}]"

              def pytest_sessionfinish(self):
                  self.stop.set()
                  if self.worker is not None:
                      self.worker.join(timeout=1)

              def watch(self):
                  while not self.stop.wait(300):
                      try:
                          print(f"\nCI snapshot: {self.context}", file=self.stream, flush=True)
                          faulthandler.dump_traceback(file=self.stream, all_threads=True)
                          shown = 0
                          for value in gc.get_objects():
                              if isinstance(value, asyncio.Task) and not value.done():
                                  if shown == 50:
                                      print("Further pending tasks omitted", file=self.stream)
                                      break
                                  value.print_stack(limit=20, file=self.stream)
                                  shown += 1
                          print(f"Pending task stacks shown: {shown}", file=self.stream, flush=True)
                      except Exception as error:
                          print(f"CI snapshot failed: {type(error).__name__}", file=self.stream, flush=True)

          if __name__ == "__main__":
              # Duplicate stderr before pytest redirects fd 2: snapshots must survive a hung captured test.
              stream = os.fdopen(os.dup(2), "w", buffering=1)
              raise SystemExit(pytest.main(
                  ["-vv", "--durations=15", "-o", "faulthandler_timeout=300",
                   "-n", "auto", "--dist", "loadfile", "-p", "scripts.ci_suite",
                   "--ci-profile", "linux-full-v1", "--ci-stall"],
                  plugins=[StallDiagnostics(stream)]))
          PY

      - name: Record measured coverage and timing
        if: always()
        run: python -m scripts.ci_suite report
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-linux-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_SUITE_ARTIFACT_DIR }}
          retention-days: 7

  pytest-windows:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: windows-latest
    # 18 min: setup + critical (3) + pool (13) + report/upload, with margin over the measured worst success (#931, #1076).
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 360 || 18 }}
    env:
      CI_JOB_LABEL: pytest-windows
      PYTHONHASHSEED: '0'
      CI_STALL_INTERVAL_S: '150'  # stack snapshots every 150 s of the 780 s pool step (#1076)
      CI_COVERAGE_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'windows-full-v1' || 'windows-boundary-v6' }}
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
      profile: ${{ steps.identity.outputs.profile }}
      execution: ${{ steps.coverage.outputs.execution }}
      receipt: ${{ steps.coverage.outputs.receipt }}
    steps:
      - name: Record CI setup start
        env:
          CI_ARTIFACT_ROOT: ${{ runner.temp }}/ci-windows
        run: python -c "import os,time; print('CI_SETUP_STARTED='+str(time.time())+'\nCI_SUITE_ARTIFACT_DIR='+os.environ['CI_ARTIFACT_ROOT'], file=open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8'))"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # invalid range fails before pytest; never expand routine Windows
      - id: identity
        shell: bash
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "profile=${{ env.CI_COVERAGE_PROFILE }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
        timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 360 || 2 }}
      - name: Bind changed-test range to checkout
        id: selection
        if: env.CI_COVERAGE_PROFILE != 'windows-full-v1'
        run: python -m scripts.ci_selection
      - name: Report rejected Windows selection
        if: failure() && steps.selection.outcome == 'failure'
        run: Write-Output "::error title=Windows selection rejected::ci_selection refused this checkout. See selection-error.json in the Windows artifact."
      - name: Bind Windows execution identity
        run: python -m scripts.ci_skip windows-identity
      - name: Serial critical Windows contracts
        run: pytest -q --durations=15 -n 0 -p scripts.ci_suite --ci-profile ${{ env.CI_COVERAGE_PROFILE }} --ci-phase critical tests/test_windows_job_ci.py tests/test_web_shutdown_process.py "tests/test_web_3d.py::test_office_in_node[web_resizable_panels.cjs-fail 0]"
        timeout-minutes: 3
        env:
          LABHQ_REQUIRE_RESIZABLE_BROWSER: '1'
      - name: Require every critical lifecycle PASS before opening pool
        run: python -m scripts.ci_suite critical-ready
      - name: Note pool start
        run: python -c "import os,time; print('CI_POOL_STARTED='+str(time.time()), file=open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8'))"
      - name: Remaining Windows contracts in four-worker pool
        run: pytest -q --durations=15 -n 4 --dist loadfile -p scripts.ci_suite --ci-profile ${{ env.CI_COVERAGE_PROFILE }} --ci-phase parallel --ci-stall tests
        # 13 min = 1.5x the measured worst successful pool step (499 s; was 350 s of 99 runs at the 9 min cap; #1097 once and #1111 three times hit 540 s) (#931, #1076).
        timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 360 || 13 }}

      - name: Report pool step duration
        if: always()
        run: python -c "import os,time; s=float(os.environ.get('CI_POOL_STARTED', 0)); d=round(time.time()-s) if s else -1; print('### Windows pool step\n'+str(d)+' s of the 780 s limit; retune from this line (#931).', file=open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8'))"

      - name: Record measured coverage and timing
        id: coverage
        timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 360 || 1 }}
        # Failed selection/pytest has no complete receipt; keep its original failure visible.
        if: success()
        run: python -m scripts.ci_suite report
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 360 || 1 }}
        if: always()
        with:
          name: coverage-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_SUITE_ARTIFACT_DIR }}
          retention-days: 7


  clean-install:
    # Separate Windows rehearsal: a fresh clone/venv, mock request, bundle, verify, and cleanup.
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: windows-latest
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
      profile: ${{ steps.identity.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - id: identity
        shell: bash
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "profile=clean-install-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/clean_install_check.py

  ro-crate-validator:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
      profile: ${{ steps.identity.outputs.profile }}
    env:
      LABHQ_ROCRATE_VALIDATOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: identity
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "profile=official-validator-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # CI-only validator: roc-validator 0.12.2 is Apache-2.0; --offline forbids profile/context lookups.
      - run: pip install -e ".[dev]" roc-validator==0.12.2
      - run: pytest -q tests/test_request_bundle.py -k official_ro_crate_validator

  pytest-slow:
    # The real 90 s MCP call (#276) runs here, beside the suite, so a wall-clock timeout regression fails CI (#308).
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
      profile: ${{ steps.identity.outputs.profile }}
    env:
      LABHQ_SLOW_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: identity
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "profile=long-mcp-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_long_mcp_call.py

  readme:
    # README/document and record validators still run for documents and reused results.
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_integrations.py
      - run: python scripts/integrations.py --check
      - run: python scripts/vocab_tables.py --check
      - name: Static document and safety consistency
        run: >-
          pytest -q tests/test_text_encoding.py
          tests/test_private_paths.py::test_absent_key_means_the_default_list_and_an_empty_list_turns_it_off
          tests/test_topic_checklists_precedents.py::test_every_approved_topic_has_checks_with_a_cited_basis
      - run: python scripts/notes_index.py --validate
      - run: bash scripts/check_public.sh

  patch-notes:
    # PI 결정(2026-10-01): 커밋마다 패치노트 한 줄, main 커밋 3개 안에 README나 docs/manual.md 갱신.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/patch_notes.py check --base origin/${{ github.base_ref }} --head HEAD
      - run: pip install pyyaml && python scripts/notes_index.py --validate  # the generator on main must not fail after merge

  validation-manifest:
    # Only a fresh full same-repository PR run can produce evidence; forks still run all gates.
    needs: [changes, pytest, pytest-windows, clean-install, ro-crate-validator, pytest-slow, readme, patch-notes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.skip != 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # producer verifies both synthetic merge parents locally
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - id: windows-artifact
        run: python scripts/ci_skip.py windows-artifact >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.windows-artifact.outputs.artifact-id }}
          path: windows-receipts
          merge-multiple: true
      - id: manifest
        run: python scripts/ci_skip.py manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_WINDOWS_RECEIPT_DIR: windows-receipts
          CI_WINDOWS_ARTIFACT_ID: ${{ steps.windows-artifact.outputs.artifact-id }}
      - uses: actions/upload-artifact@v4
        if: steps.manifest.outputs.reusable == 'true'
        with:
          name: ci-full-v8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-result.json
          if-no-files-found: error
          retention-days: 7
