name: test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-probe825:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Four synthetic transport cases, once each
        run: python scripts/windows_transport_probe825.py
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-probe825
          path: transport-probe825.json
          retention-days: 3

  browser-probe825:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One public demo browser case with original 30 second wrapper
        timeout-minutes: 2
        run: python scripts/windows_browser_probe825.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-probe825
          path: browser825-diagnostic.json
          retention-days: 3
