name: test

on:
  push:
    branches: [main]  # PR branches run once, via pull_request (PI 2026-10-02: no duplicate runs)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read  # ci_skip.py reads the earlier commit's pytest results

jobs:
  changes:
    # A push that only adds patch notes or resolves STATUS/patch_notes conflicts does not rerun pytest (PI 2026-10-02).
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      readme: ${{ steps.check.outputs.readme }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base branch history decides whether a merge came from it
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_skip.py "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --durations=15  # the 15 slowest tests, to find what to speed up

  pytest-windows:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --durations=15  # the 15 slowest tests, to find what to speed up

  pytest-slow:
    # The real 90 s MCP call (#276) runs here, beside the suite, so a wall-clock timeout regression fails CI (#308).
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      LABHQ_SLOW_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_long_mcp_call.py

  readme:
    # Full suite skipped but README.md changed: run the one file that reads it (PI 2026-10-02).
    needs: changes
    if: needs.changes.outputs.skip == 'true' && needs.changes.outputs.readme == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_integrations.py

  patch-notes:
    # PI 결정(2026-10-01): 커밋마다 패치노트 한 줄, main 커밋 3개 안에 README 갱신.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/patch_notes.py check --base origin/${{ github.base_ref }} --head HEAD
      - run: pip install pyyaml && python scripts/notes_index.py --validate  # the generator on main must not fail after merge
