name: diagnostic825-native

on:
  push:
    branches: [codex/wmi-browser-diagnostic825]

permissions:
  contents: read

jobs:
  native-probe825:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same declared CI dependencies
        run: pip install -e ".[dev]"
        timeout-minutes: 2
      - name: Existing owned Windows Job and gateway shutdown regressions, isolated
        run: pytest -q tests/test_windows_job_ci.py tests/test_web_shutdown_process.py --durations=10 --junitxml=native825.xml
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-probe825
          path: native825.xml
          retention-days: 3
