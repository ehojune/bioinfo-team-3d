bulk_rna_seq:
  - id: batch
    check: 처리 batch(스캔 날짜, array·lane, 기관)와 비교 집단의 교락을 확인하고 모형에 넣거나 한계로 보고한다
    why: 기술 차이를 생물학적 차이로 해석하지 않기 위해서다
  - id: pairing
    check: 같은 환자·공여자 시료는 주 모형과 유전자 세트 검정 모두에서 짝을 유지하고 짝 없는 시료를 밝힌다
    why: 개인차를 조건 효과로 잘못 세지 않기 위해서다
  - id: gene_set_test
    check: 유전자 세트 검정은 주 모형의 통계량으로 순위를 매기거나 짝 보존 방식으로 하며 짝을 무시한 재검정을 주 결과로 쓰지 않는다
    why: 주 분석의 짝과 보정을 경로 검정에서도 보존하기 위해서다
  - id: independent_validation
    check: 독립 코호트·데이터셋이 있으면 핵심 결과를 검증하고 없으면 이유를 밝힌다
    why: 한 데이터셋에만 맞는 결론인지 확인하기 위해서다

