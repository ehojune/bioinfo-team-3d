# Output data type vocabulary (#221 todo 2, #151). Local keys only: no EDAM label or id is written here.
# labhq/vocab/__init__.py loads this file with the duplicate-key-rejecting loader of labhq.util.
# The CSO sees the key names only. EDAM ids, when present, come from an optional
# generated edam_subset.yaml; nobody types an id by hand.
#
# Per key: branch (data | format | operation | topic), definition (labhq's own words), extensions (format only,
# lower case, a single trailing .gz is peeled off first), ok / not (examples), review (PI reviewed every key
# on 2026-10-04).
# Branch caps: data 36, format 32, operation 24, topic 24. Adding a key requires its own review.
version: 1

terms:
  raw_counts:
    branch: data
    definition: "read or fragment counts per gene or transcript and sample before normalization or transformation"
    ok: ["gene x sample integer count matrix from featureCounts or STAR"]
    not: ["TPM or CPM table", "DESeq2 normalized counts", "VST or log-transformed expression matrix"]
    review: "PI 2026-10-04"
  normalized_counts:
    branch: data
    definition: "counts per gene or transcript and sample adjusted for library size or other normalization factors, on an untransformed count scale"
    ok: ["DESeq2 size-factor-normalized counts"]
    not: ["raw counts", "TPM or CPM table", "VST or log-transformed expression matrix", "a table of fold changes"]
    review: "PI 2026-10-04"
  normalized_expression:
    branch: data
    definition: "expression values per gene or transcript and sample expressed in normalized units such as CPM or TPM, before log or variance-stabilizing transformation"
    ok: ["CPM expression matrix", "TPM expression matrix"]
    not: ["raw counts", "DESeq2 normalized counts", "VST or log-transformed expression matrix", "a table of fold changes"]
    review: "PI 2026-10-04"
  transformed_expression:
    branch: data
    definition: "expression values per gene or transcript and sample after a log or variance-stabilizing transformation"
    ok: ["DESeq2 VST or rlog matrix", "log2-CPM matrix", "log-normalized expression matrix"]
    not: ["raw counts", "untransformed normalized counts", "untransformed TPM or CPM table", "a table of fold changes"]
    review: "PI 2026-10-04"
  de_table:
    branch: data
    definition: "differential expression results per gene or transcript and tested contrast, including an expression effect estimate and statistical significance results"
    ok: ["DESeq2 or limma results with gene identifiers, log2FC, p-values and adjusted p-values"]
    not: ["an expression matrix", "a list of gene names without statistics", "a functional enrichment result table"]
    review: "PI 2026-10-04"
  enrichment_table:
    branch: data
    definition: "enrichment results per gene set, biological function or pathway and tested comparison, including method-specific enrichment measures, p-values and multiple-testing-adjusted significance where available"
    ok: ["GSEA results with gene set identifiers, ES or NES and adjusted significance", "ORA results with term identifiers, overlap counts and adjusted p-values"]
    not: ["a differential expression table", "a gene set definition file", "a gene-to-function annotation table without enrichment tests"]
    review: "PI 2026-10-04"
  network:
    branch: data
    definition: "nodes and edges between biological entities, such as interactions or pathways"
    ok: ["STRING interaction edge list", "pathway graph export"]
    not: ["a correlation matrix without edges chosen", "a plot of a network"]
    review: "PI 2026-10-04"
  sample_metadata:
    branch: data
    definition: "one row per sample with its design variables and annotations"
    ok: ["samplesheet with condition, batch and pairing columns"]
    not: ["a list of downloaded files", "per-gene annotation"]
    review: "PI 2026-10-04"
  data_manifest:
    branch: data
    definition: "a list of data files or accessions with where they came from and how they were checked"
    ok: ["accession list with source, checksum and download date"]
    not: ["sample design table", "an analysis report"]
    review: "PI 2026-10-04"
  qc_report:
    branch: data
    definition: "a report of quality checks on data or results, with pass, warn or fail per check"
    ok: ["MultiQC summary", "QC review notes per step"]
    not: ["the final analysis report", "raw QC metric dumps without judgement"]
    review: "PI 2026-10-04"
  report:
    branch: data
    definition: "a human-readable write-up of what was done, found and left open"
    ok: ["RESULT.md style step report", "final answer document"]
    not: ["a QC checklist", "a data table"]
    review: "PI 2026-10-04"
  sequence_reads:
    branch: data
    definition: "unaligned reads as they come from a sequencer, with or without qualities"
    ok: ["paired FASTQ files of a sequencing run"]
    not: ["an assembled contig", "aligned reads"]
    review: "PI 2026-10-04"
  sequence:
    branch: data
    definition: "one or more biological sequences that are not raw reads"
    ok: ["protein sequences of a gene family", "a reference contig"]
    not: ["sequencing reads", "an alignment"]
    review: "PI 2026-10-04"
  alignment:
    branch: data
    definition: "sequences or reads placed against each other or against a reference"
    ok: ["read alignments to a genome", "a multiple sequence alignment"]
    not: ["unaligned reads", "a variant list"]
    review: "PI 2026-10-04"
  variants:
    branch: data
    definition: "positions where samples differ from a reference, with alleles and calls"
    ok: ["germline SNV and indel calls"]
    not: ["read alignments", "gene annotation"]
    review: "PI 2026-10-04"
  assembly:
    branch: data
    definition: "contigs or scaffolds built from reads"
    ok: ["de novo plastome assembly"]
    not: ["a reference download", "read alignments"]
    review: "PI 2026-10-04"
  genomic_features:
    branch: data
    definition: "genomic intervals representing genes, transcripts, exons or called peaks"
    ok: ["gene models in GFF3 or GTF", "called peaks in BED"]
    not: ["the sequence itself", "variant calls", "variant consequence annotations"]
    review: "PI 2026-10-04"
  variant_annotations:
    branch: data
    definition: "annotations linked to variants, such as overlapping genes, predicted consequences or known clinical interpretations"
    ok: ["VEP or SnpEff consequence annotations", "variant annotation table with gene and consequence columns"]
    not: ["variant calls without annotations", "gene models in GFF3 or GTF"]
    review: "PI 2026-10-04"
  protein_structure:
    branch: data
    definition: "three-dimensional coordinates of a protein or complex"
    ok: ["PDB entry or predicted model coordinates"]
    not: ["a protein sequence", "a picture of a structure"]
    review: "PI 2026-10-04"
  plot:
    branch: data
    definition: "a figure made from data for people to look at"
    ok: ["volcano plot", "QC histogram"]
    not: ["the table behind the figure"]
    review: "PI 2026-10-04"
  table:
    branch: data
    definition: "tabular data that fits none of the more specific data keys"
    ok: ["summary statistics table of a small dataset"]
    not: ["a count matrix", "a DE result table"]
    review: "PI 2026-10-04"

  fastq:
    branch: format
    definition: "FASTQ text with sequence and quality lines"
    extensions: [".fastq", ".fq"]
    review: "PI 2026-10-04"
  fasta:
    branch: format
    definition: "FASTA text with header and sequence lines"
    extensions: [".fasta", ".fa", ".fna", ".faa"]
    review: "PI 2026-10-04"
  bam:
    branch: format
    definition: "binary SAM alignment file"
    extensions: [".bam"]
    review: "PI 2026-10-04"
  vcf:
    branch: format
    definition: "variant call format text"
    extensions: [".vcf"]
    review: "PI 2026-10-04"
  bed:
    branch: format
    definition: "BED interval text"
    extensions: [".bed"]
    review: "PI 2026-10-04"
  gff3:
    branch: format
    definition: "GFF version 3 feature text; a bare .gff is not inferred because it may be GFF2"
    extensions: [".gff3"]
    review: "PI 2026-10-04"
  genbank:
    branch: format
    definition: "GenBank flat file"
    extensions: [".gb", ".gbk"]
    review: "PI 2026-10-04"
  tsv:
    branch: format
    definition: "tab-separated values"
    extensions: [".tsv"]
    review: "PI 2026-10-04"
  csv:
    branch: format
    definition: "comma-separated values"
    extensions: [".csv"]
    review: "PI 2026-10-04"
  json:
    branch: format
    definition: "JSON text"
    extensions: [".json"]
    review: "PI 2026-10-04"
  markdown:
    branch: format
    definition: "Markdown text"
    extensions: [".md"]
    review: "PI 2026-10-04"
  pdf:
    branch: format
    definition: "PDF document"
    extensions: [".pdf"]
    review: "PI 2026-10-04"
  png:
    branch: format
    definition: "PNG image"
    extensions: [".png"]
    review: "PI 2026-10-04"
  h5ad:
    branch: format
    definition: "AnnData HDF5 file"
    extensions: [".h5ad"]
    review: "PI 2026-10-04"

  statistical_analysis:
    branch: operation
    definition: "a statistical test or model fit on data"
    review: "PI 2026-10-04"
  de_analysis:
    branch: operation
    definition: "estimating and statistically testing expression differences for genes or transcripts across specified conditions or contrasts"
    ok: ["gene-level differential expression analysis with DESeq2 or limma"]
    not: ["functional enrichment analysis alone", "variant association testing", "differential peak accessibility analysis"]
    review: "PI 2026-10-04"
  enrichment_analysis:
    branch: operation
    definition: "testing gene lists or ranked genes for enrichment of biological functions, pathways or other gene sets"
    ok: ["GO over-representation analysis", "rank-based GSEA"]
    not: ["per-gene differential expression testing", "assigning functional annotations without enrichment tests"]
    review: "PI 2026-10-04"
  read_mapping:
    branch: operation
    definition: "aligning reads to a reference"
    review: "PI 2026-10-04"
  variant_calling:
    branch: operation
    definition: "calling variants from alignments"
    review: "PI 2026-10-04"
  data_retrieval:
    branch: operation
    definition: "fetching data from a public or local source"
    review: "PI 2026-10-04"

  # tier=extended; pipelines=atacseq,chipseq,ampliseq,taxprofiler,mag,differentialabundance; edam=Matrix
  abundance_table:
    branch: data
    definition: "a matrix of quantitative feature abundances across samples or observations, excluding gene or transcript expression matrices"
    ok: ["ASV-by-sample abundance table", "consensus-peak count matrix", "taxon relative-abundance matrix"]
    not: ["gene-by-sample RNA count matrix", "cell-by-gene matrix", "differential abundance statistics"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=scrnaseq,spatialaxe; edam=Count matrix
  cell_feature_matrix:
    branch: data
    definition: "a matrix of molecular feature measurements for individual cells or spatially resolved cell-like units"
    ok: ["cell-by-gene UMI count matrix", "segmented-cell by gene expected-count matrix"]
    not: ["bulk gene-by-sample count matrix", "sample metadata", "cell boundary coordinates"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnaseq,methylseq,atacseq,chipseq,cutandrun,nanoseq,sarek,raredisease,viralrecon,pacbio-hifi-wgs; edam=Annotation track
  coverage_track:
    branch: data
    definition: "a genome-position track of read depth, signal intensity or another continuous coverage measure"
    ok: ["normalized bigWig signal track", "per-base methylation bedGraph", "mosdepth coverage track"]
    not: ["read alignment file", "called peak intervals", "coverage summary table without genomic positions"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=methylseq; edam=Annotation track (closest Data label)
  methylation_profile:
    branch: data
    definition: "methylation measurements at cytosines or genomic intervals with their positions and measured levels"
    ok: ["per-CpG methylation calls", "MethylDackel CpG bedGraph"]
    not: ["bisulfite-aligned reads", "differential methylation statistics", "generic coverage without methylation values"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=ampliseq,mag,taxprofiler,bacass,viralrecon; edam=Taxonomic classification
  taxonomic_profile:
    branch: data
    definition: "taxonomic assignments for a sample or features, optionally with counts or relative abundances"
    ok: ["Kraken2 taxon profile", "ASV taxonomy table", "viral lineage abundance table"]
    not: ["unclassified feature abundance matrix", "phylogenetic tree", "genome annotation"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=ampliseq,mag; edam=Phylogenetic tree
  phylogenetic_tree:
    branch: data
    definition: "a tree representing inferred evolutionary relationships among sequences, taxa or genome bins"
    ok: ["Newick tree of amplicon sequence variants", "genome-bin phylogeny"]
    not: ["taxonomic classification table", "sequence alignment", "tree plot without reusable tree data"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnasplice; edam=Gene expression profile (closest Data label)
  splicing_table:
    branch: data
    definition: "per-event or per-isoform splicing measurements and, when tested, differential splicing statistics"
    ok: ["PSI matrix", "contrast-level dPSI table with significance"]
    not: ["gene-level differential expression table", "transcript TPM matrix", "splice-junction coordinates alone"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=sarek,raredisease; edam=Sequence variations (closest Data label)
  copy_number_profile:
    branch: data
    definition: "copy-number estimates or segments across a genome for one or more samples"
    ok: ["CNV segment table", "tumor purity-adjusted copy-number profile"]
    not: ["SNV or indel VCF", "read-depth track without copy-number inference", "structural variant breakpoints alone"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=spatialaxe; edam=Annotation track (closest Data label)
  spatial_annotations:
    branch: data
    definition: "spatial coordinates, boundaries or assignments linking molecular observations to cells or tissue locations"
    ok: ["cell polygon GeoJSON", "transcript-to-cell assignments", "cell centroid table"]
    not: ["cell-by-gene matrix without coordinates", "microscopy image", "sample metadata without spatial positions"]
    review: "PI 2026-10-04"

  # tier=core; pipelines=rnaseq,sarek,fetchngs,differentialabundance,methylseq,atacseq,chipseq,cutandrun,scrnaseq,ampliseq,mag,taxprofiler,nanoseq,rnasplice,raredisease,bacass,viralrecon,spatialaxe,pacbio-hifi-wgs; edam=HTML
  html:
    branch: format
    definition: "HTML document or interactive report"
    extensions: [".html", ".htm"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=sarek,raredisease; edam=CRAM
  cram:
    branch: format
    definition: "reference-compressed alignment file"
    extensions: [".cram"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnaseq,atacseq,chipseq,cutandrun,nanoseq,raredisease; edam=bigWig
  bigwig:
    branch: format
    definition: "indexed binary genome track for dense continuous values"
    extensions: [".bigwig", ".bigWig", ".bw"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=methylseq,cutandrun,nanoseq,sarek; edam=bedgraph
  bedgraph:
    branch: format
    definition: "bedGraph text for continuous values over genomic intervals"
    extensions: [".bedgraph", ".bedGraph"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnaseq,atacseq,chipseq,cutandrun,nanoseq,rnasplice; edam=GTF
  gtf:
    branch: format
    definition: "Gene Transfer Format feature annotation text"
    extensions: [".gtf"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=ampliseq,mag,bacass; edam=GFF
  gff:
    branch: format
    definition: "version-unspecified General Feature Format text"
    extensions: [".gff"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnaseq,scrnaseq,spatialaxe,viralrecon; edam=HDF5
  hdf5:
    branch: format
    definition: "generic HDF5 container that is not the more specific h5ad format"
    extensions: [".h5", ".hdf5"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=scrnaseq; edam=Matrix format (closest Format label)
  mtx:
    branch: format
    definition: "Matrix Market coordinate or array text"
    extensions: [".mtx"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=ampliseq,mag; edam=newick
  newick:
    branch: format
    definition: "Newick text representation of a tree"
    extensions: [".newick", ".nwk", ".tree"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnaseq,differentialabundance,atacseq,chipseq,ampliseq,rnasplice; edam=R file format
  rds:
    branch: format
    definition: "serialized single R object"
    extensions: [".rds"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=atacseq,chipseq; edam=ENCODE narrow peak format / ENCODE broad peak format
  encode_peak:
    branch: format
    definition: "ENCODE narrow, broad or gapped peak interval format"
    extensions: [".narrowPeak", ".broadPeak", ".gappedPeak"]
    review: "PI 2026-10-04"
  # tier=defer; pipelines=ampliseq; edam=ZIP format (container match only)
  qiime2_artifact:
    branch: format
    definition: "QIIME 2 artifact or visualization archive"
    extensions: [".qza", ".qzv"]
    review: "PI 2026-10-04"
  # tier=defer; pipelines=spatialaxe; edam=Binary format (closest Format label)
  parquet:
    branch: format
    definition: "Apache Parquet columnar data file"
    extensions: [".parquet"]
    review: "PI 2026-10-04"
  # tier=defer; pipelines=spatialaxe; edam=TIFF / OME-TIFF
  tiff:
    branch: format
    definition: "TIFF image, including OME-TIFF microscopy images"
    extensions: [".tif", ".tiff", ".ome.tif", ".ome.tiff"]
    review: "PI 2026-10-04"

  # tier=core; pipelines=rnaseq,sarek,fetchngs,differentialabundance,methylseq,atacseq,chipseq,cutandrun,scrnaseq,ampliseq,mag,taxprofiler,nanoseq,rnasplice,raredisease,bacass,viralrecon,isoseq,spatialaxe,pacbio-hifi-wgs; edam=Sequencing quality control
  quality_control:
    branch: operation
    definition: "assessing data or result quality with explicit metrics, checks or thresholds"
    ok: ["read-quality assessment and MultiQC aggregation", "assembly completeness assessment", "variant-call QC"]
    not: ["writing an analysis report without quality checks", "plotting data without a quality criterion"]
    review: "PI 2026-10-04"
  # tier=core; pipelines=rnaseq,sarek,fetchngs,methylseq,atacseq,chipseq,cutandrun,scrnaseq,ampliseq,mag,taxprofiler,nanoseq,rnasplice,raredisease,bacass,viralrecon,isoseq,pacbio-hifi-wgs; edam=Sequence trimming (closest Operation label)
  read_preprocessing:
    branch: operation
    definition: "preparing sequence reads by demultiplexing, adapter trimming, quality filtering or contaminant removal"
    ok: ["adapter and quality trimming", "barcode demultiplexing", "host-read filtering"]
    not: ["mapping reads to the analysis reference", "calling variants", "normalizing a count matrix"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnaseq,atacseq,chipseq,scrnaseq,ampliseq,taxprofiler,nanoseq,rnasplice,spatialaxe; edam=Quantification
  quantification:
    branch: operation
    definition: "estimating counts, abundances or signal levels for biological features"
    ok: ["transcript abundance estimation", "peak read counting", "cell-by-gene UMI counting"]
    not: ["testing a contrast", "assigning taxonomic labels without abundance estimation", "read mapping alone"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnaseq,differentialabundance,atacseq,chipseq,cutandrun,scrnaseq,ampliseq,rnasplice; edam=Standardisation and normalisation
  normalization:
    branch: operation
    definition: "adjusting measurements to make samples or observations quantitatively comparable"
    ok: ["library-size normalization", "spike-in signal normalization", "relative-abundance scaling"]
    not: ["log transformation without scaling", "statistical testing", "read trimming"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=mag,bacass,viralrecon; edam=Genome assembly
  genome_assembly:
    branch: operation
    definition: "constructing genome or metagenome sequences from reads"
    ok: ["de novo bacterial assembly", "metagenome contig assembly", "viral genome assembly"]
    not: ["mapping reads to a reference", "reference-guided transcript reconstruction", "calling variants"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnaseq,nanoseq,isoseq; edam=Transcriptome assembly
  transcriptome_assembly:
    branch: operation
    definition: "reconstructing transcript models from RNA sequencing reads or alignments"
    ok: ["StringTie transcript reconstruction", "Iso-Seq transcript model collapse"]
    not: ["gene expression quantification", "genome assembly", "alternative splicing testing"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnaseq,mag,bacass,isoseq; edam=Sequence annotation
  sequence_annotation:
    branch: operation
    definition: "assigning biological features or functions to assembled or reference sequences"
    ok: ["Prokka bacterial genome annotation", "gene-model annotation of assembled transcripts"]
    not: ["annotating variant consequences", "calling peaks", "taxonomic profiling"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=atacseq,chipseq,cutandrun; edam=Peak calling
  peak_calling:
    branch: operation
    definition: "detecting genomic intervals with enriched chromatin accessibility or binding signal"
    ok: ["MACS peak calling", "SEACR peak calling"]
    not: ["read-depth track generation", "peak annotation", "differential peak testing"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=differentialabundance,atacseq,chipseq,ampliseq; edam=Statistical calculation (closest Operation label)
  differential_abundance_analysis:
    branch: operation
    definition: "testing non-gene features for abundance differences across specified conditions or contrasts"
    ok: ["differential taxon abundance testing", "differential peak accessibility testing"]
    not: ["gene-level differential expression analysis", "feature quantification without a contrast", "functional enrichment analysis"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=methylseq; edam=Methylation calling
  methylation_calling:
    branch: operation
    definition: "estimating methylation state or level at cytosines or genomic intervals"
    ok: ["per-CpG methylation calling from bisulfite alignments"]
    not: ["bisulfite read mapping", "differential methylation testing", "generic variant calling"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=ampliseq,mag,taxprofiler,bacass,viralrecon; edam=Taxonomic classification
  taxonomic_profiling:
    branch: operation
    definition: "assigning taxa to reads or features and optionally estimating their abundances"
    ok: ["Kraken2 taxonomic profiling", "ASV taxonomy assignment", "viral lineage assignment"]
    not: ["genome functional annotation", "phylogenetic tree inference", "host-read filtering alone"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=rnasplice; edam=Splicing analysis
  splicing_analysis:
    branch: operation
    definition: "measuring or testing alternative transcript splicing or isoform usage"
    ok: ["PSI estimation", "differential splicing analysis"]
    not: ["gene-level differential expression", "transcript quantification without splicing inference", "splice-aware read mapping"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=sarek,raredisease,viralrecon,pacbio-hifi-wgs; edam=Variant effect prediction
  variant_annotation:
    branch: operation
    definition: "adding predicted consequences, genes, frequencies or clinical knowledge to called variants"
    ok: ["VEP consequence annotation", "SnpEff functional effect annotation"]
    not: ["variant calling", "genome feature annotation", "variant prioritization without adding annotations"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=pacbio-hifi-wgs; edam=Phasing
  phasing:
    branch: operation
    definition: "assigning alleles or variants to haplotypes"
    ok: ["WhatsHap read-backed variant phasing"]
    not: ["joint genotyping", "haplotag-free alignment", "variant calling without phase sets"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=viralrecon,isoseq,pacbio-hifi-wgs; edam=Sequence assembly (closest Operation label)
  consensus_generation:
    branch: operation
    definition: "deriving a representative consensus sequence from aligned or clustered reads"
    ok: ["viral consensus genome generation", "PacBio circular consensus sequence generation"]
    not: ["de novo genome assembly", "multiple sequence alignment", "copying a reference sequence"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=spatialaxe; edam=Image analysis (closest Operation label)
  cell_segmentation:
    branch: operation
    definition: "identifying cell or nucleus boundaries from images or spatial molecular coordinates"
    ok: ["Cellpose image segmentation", "Proseg transcript-coordinate segmentation"]
    not: ["single-cell clustering", "cell-type annotation", "transcript quantification without boundary inference"]
    review: "PI 2026-10-04"

  # tier=extended; pipelines=rnaseq,differentialabundance; edam=RNA-Seq
  bulk_rna_seq:
    branch: topic
    definition: "bulk RNA sequencing for gene or transcript expression analysis"
    ok: ["poly-A bulk RNA-seq", "ribo-depleted bulk RNA-seq"]
    not: ["single-cell RNA-seq", "microarray expression", "Iso-Seq transcript discovery"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=scrnaseq; edam=Single-cell sequencing
  single_cell_rna_seq:
    branch: topic
    definition: "single-cell or single-nucleus RNA sequencing with cell-resolved expression measurements"
    ok: ["10x single-cell RNA-seq", "single-nucleus RNA-seq with intron counting"]
    not: ["bulk RNA-seq", "spatial transcriptomics", "single-cell ATAC-seq"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=spatialaxe; edam=Transcriptomics (closest Topic label)
  spatial_transcriptomics:
    branch: topic
    definition: "transcript measurements retained with positions in intact tissue"
    ok: ["10x Xenium in-situ transcriptomics"]
    not: ["dissociated single-cell RNA-seq", "bulk RNA-seq", "microscopy without transcript measurements"]
    review: "PI 2026-10-04"
  # tier=extended; pipelines=atacseq; edam=ATAC-seq
  atac_seq:
    branch: topic
    definition: "ATAC-seq analysis of chromatin accessibility"
    ok: ["bulk ATAC-seq peak and accessibility analysis"]
    not: ["ChIP-seq", "CUT&RUN", "single-cell ATAC-seq"]
