order: 4
id: public-protein-qc
title: 소형 공개 UniProt manifest QC
request: >-
  제공한 공개 단백질 manifest를 QC하라. 행 수, unique accession 수, 중복 accession,
  길이의 양수 여부를 보고하고 외부 다운로드는 하지 않는다.
references:
  - label: UniProt manifest excerpt
    path: references/protein-manifest.tsv
    source: https://www.uniprot.org/
scripted_pi_answers:
  - question_contains: 중복
    answer: 중복은 제거하지 말고 원본 4행과 unique 3개를 함께 보고한다.
check:
  script: checks/contains_terms.py
  args:
    - 'num:4:(?:^\s*(?:[-*>]|\d+\.)?\s*\|?\s*|[;。!?]\s*|\.\s+|,\s*)(?:(?:데이터|전체|총|원본|발췌본|excerpt|total|data)(?:은|는)?\s*[:|]?\s*)?(?:(?:행\s*수|rows?(?:\s*count)?)[ \t:|=]*(?:(?:은|는|이|가)\s*)?|(?=[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?\s*(?:행(?!과|·|에서|에|째)|rows?|records?)(?![A-Za-z])))(?<![A-Za-z0-9_.,+-])(?P<value>[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)(?!\d|[.,]\d)\s*(?:행(?!과|·|에서|에|째)|rows?|records?)?'
    - 'num:3:(?<![\w])(?:unique(?:\s*accessions?)?|고유(?:\s*accession)?)(?:\s*(?:수|값\s*수))?[ \t:|=]*(?:(?:은|는|이|가)\s*)?(?<![A-Za-z0-9_.,+-])(?P<value>[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)(?!\d|[.,]\d)'
    - 're:(?<![A-Za-z0-9_])P01116(?![A-Za-z0-9_])[^\n.;]{0,25}(?:중복|duplicat)|(?:중복|duplicat)[^\n.;]{0,25}(?<![A-Za-z0-9_])P01116(?![A-Za-z0-9_])'
    - 'num:1863:(?:BRCA1(?:_HUMAN)?|(?<![·가-힣])(?:최대|최댓값|가장\s*긴|maximum|max|longest))[^\d\n.;·]{0,25}(?<![A-Za-z0-9_.,+-])(?P<value>[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)(?!\d|[.,]\d)\s*(?:aa|amino\s*acids?)?'
    - 're:(?:모든\s*길이|길이(?:는|가)?\s*모두)[^\n.;]{0,15}(?:양수|양의\s*정수|0\s*초과)|all\s*(?:declared\s*)?lengths?\s*(?:are\s*)?(?:positive|>\s*0)|길이\s*양수\s*검사는\s*모든\s*행이\s*통과|길이\s*(?:필드는\s*)?전수\s*양수'
budget_usd: 0.5
mock_answer: |
  # 공개 단백질 manifest QC
  원본은 4행이고 unique 3 accession이다. P01116이 중복이며 모든 길이는 양수다.
  가장 긴 선언값은 BRCA1_HUMAN의 1863 aa다.
